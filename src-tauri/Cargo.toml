[package]
name = "myanimerank"
version = "2.0.0"
description = "Anchored relative scoring for anime and manga, synced with AniList"
edition = "2021"
publish = false

[lib]
name = "myanimerank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio", "http1"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
env_logger = "0.11.11"
http-body-util = "0.1.5"
log = "0.4.34"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
tempfile = "3.27.0"

# Small, fast release binary: this app's whole point is a low footprint.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
