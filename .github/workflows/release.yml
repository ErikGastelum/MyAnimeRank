name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject AniList credentials
        env:
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
        shell: python
        run: |
          import os
          secret = os.environ.get('ANILIST_CLIENT_SECRET', '')
          with open('_secrets.py', 'w') as f:
              f.write(f'ANILIST_CLIENT_SECRET = {secret!r}\n')

      - name: Build executable
        run: pyinstaller MyAnimeRank.spec

      - name: Upload build artifact (always — for testing)
        uses: actions/upload-artifact@v4
        with:
          name: MyAnimeRank-exe
          path: dist/MyAnimeRank.exe
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/MyAnimeRank.exe
          body: |
            ## MyAnimeRank ${{ github.ref_name }}

            A local-first desktop app for ranking anime through anchored relative scoring.

            ### Install
            1. Download **MyAnimeRank.exe** below
            2. Double-click to run — no installation needed

            > **Requires Windows 10 or 11** (Edge WebView2 is pre-installed on both)

            ### What's inside
            - Anchored comparison-based rating across 5 criteria
            - Import from AniList or MAL by username, or via file upload
            - Export ratings as MyAnimeList XML
            - Backup / restore your library as JSON
            - Seasonal recommendations based on your top genres
            - Fully local — no account, no cloud, no tracking
