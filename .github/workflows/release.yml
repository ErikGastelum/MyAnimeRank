name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller MyAnimeRank.spec

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MyAnimeRank.exe
          body: |
            ## MyAnimeRank ${{ github.ref_name }}

            A local-first desktop app for ranking anime through anchored relative scoring.

            ### Install
            1. Download **MyAnimeRank.exe** below
            2. Double-click to run — no installation needed

            > **Requires Windows 10 or 11** (Edge WebView2 is pre-installed on both)

            ### What's inside
            - Anchored comparison-based rating across 5 criteria
            - Import from AniList or MAL by username, or via file upload
            - Export ratings as MyAnimeList XML
            - Backup / restore your library as JSON
            - Seasonal recommendations based on your top genres
            - Fully local — no account, no cloud, no tracking
