<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyAnimeRank</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,300..900;1,300..900&family=Overpass+Mono:wght@400;600;700&display=swap');

:root {
  --bg:        #0c0d10;
  --surface:   #131419;
  --surface-2: #181a21;
  --raised:    #1e212a;
  --hover:     #232631;
  --line:      rgba(255,255,255,0.075);
  --line-2:    rgba(255,255,255,0.12);
  --text:      #eef1f6;
  --text-2:    #aab2c0;
  --text-3:    #6b7282;
  --text-4:    #474d5a;
  --accent:      #34a8f0;
  --accent-2:    #5cc0ff;
  --accent-deep: #1c6bb0;
  --radius:    14px;
  --radius-sm: 9px;
  --shadow:    0 18px 50px -12px rgba(0,0,0,0.7);
  --sans: 'Overpass', system-ui, sans-serif;
  --mono: 'Overpass Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #060709; }

#stage {
  position: fixed; inset: 0;
  background: radial-gradient(1100px 700px at 50% -10%, #11141b, #060709 70%);
  overflow: hidden;
}
#scaler { width: 100%; height: 100%; }

.mar-root {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100%;
  display: flex;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.mar-root::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(900px 480px at 14% -8%, rgba(52,168,240,0.10), transparent 60%),
    radial-gradient(700px 520px at 100% 120%, rgba(52,168,240,0.06), transparent 55%);
  pointer-events: none;
  z-index: 0;
}
.mar-root.no-ambient::before { opacity: 0; }

.mar-nav {
  width: 232px; flex-shrink: 0; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 22px 16px;
  position: relative; z-index: 2;
  background: linear-gradient(180deg, rgba(255,255,255,0.018), transparent 40%);
}
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px;
  border-radius: 10px; font-size: 14px; font-weight: 600;
  color: var(--text-3); transition: all .14s ease; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--raised); color: var(--text-2); }
.nav-item.active {
  background: var(--raised); color: var(--text);
  box-shadow: 0 0 0 1px var(--line) inset;
}
.nav-item.active .nav-dot { opacity: 1; }
.nav-dot {
  width: 3px; height: 16px; border-radius: 2px;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
  opacity: 0; margin-left: auto;
}
.mar-content { flex: 1; min-width: 0; overflow-y: auto; position: relative; }

.mar-slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 10px;
  border-radius: 999px; outline: none; cursor: pointer;
  background:
    linear-gradient(90deg, var(--accent) var(--fill), transparent var(--fill)),
    linear-gradient(90deg, oklch(0.6 0.18 18 / .35), oklch(0.7 0.16 60 / .3) 45%, oklch(0.74 0.16 150 / .4));
}
.mar-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px var(--thumb), 0 0 22px var(--thumb), 0 4px 10px rgba(0,0,0,0.5);
  cursor: grab; transition: transform .1s ease;
}
.mar-slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.12); }
.mar-slider::-moz-range-thumb {
  width: 26px; height: 26px; border: none; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px var(--thumb), 0 0 22px var(--thumb); cursor: grab;
}
.mar-slider-sm { height: 6px; }
.mar-slider-sm::-webkit-slider-thumb { width: 16px; height: 16px; box-shadow: 0 0 0 3px var(--thumb), 0 0 12px var(--thumb); }
.mar-slider-sm::-moz-range-thumb  { width: 16px; height: 16px; box-shadow: 0 0 0 3px var(--thumb); }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 8px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #353a48; }
::selection { background: rgba(52,168,240,0.32); color: #fff; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input  { font-family: inherit; }
.mono  { font-family: var(--mono); }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 13.5px; letter-spacing: 0.01em;
  padding: 10px 16px; border-radius: 10px;
  transition: all .16s ease; white-space: nowrap;
}
.btn-primary {
  background: var(--accent); color: #04121f;
  box-shadow: 0 0 0 1px rgba(92,192,255,0.4) inset, 0 6px 20px -6px rgba(52,168,240,0.7);
}
.btn-primary:hover {
  background: var(--accent-2);
  box-shadow: 0 0 0 1px rgba(92,192,255,0.6) inset, 0 8px 26px -6px rgba(52,168,240,0.9);
  transform: translateY(-1px);
}
.btn-ghost { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line) inset; }
.btn-ghost:hover { background: var(--hover); box-shadow: 0 0 0 1px var(--line-2) inset; }
.btn-quiet { color: var(--text-2); padding: 9px 12px; border-radius: 9px; font-weight: 600; }
.btn-quiet:hover { background: var(--raised); color: var(--text); }

@keyframes mar-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes mar-fade    { from { opacity: 0; } to { opacity: 1; } }
@keyframes newpop      { 0% { transform: scale(0.97); } 60% { transform: scale(1.015); } 100% { transform: scale(1); } }
@keyframes mar-pulse   { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.fade-up { animation: mar-fade-up .4s cubic-bezier(.2,.7,.2,1) both; }
.fade-in { animation: mar-fade .3s ease both; }
.mar-newrow { animation: newpop .22s ease; }
</style>
</head>
<body>
<div id="stage"><div id="scaler"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ─── Data layer ───────────────────────────────────────────────────────── */
const CRITERIA = [
  { key:'story',      label:'Story'      },
  { key:'characters', label:'Characters' },
  { key:'animation',  label:'Animation'  },
  { key:'audio',      label:'Audio'      },
  { key:'enjoyment',  label:'Enjoyment'  },
];

const scoreColor = (v) => {
  if (v == null) return 'var(--text-4)';
  const t = Math.max(0, Math.min(1, (v-1)/9));
  return `oklch(0.74 0.155 ${(18 + t*132).toFixed(0)})`;
};
const scoreColorSoft = (v) => {
  if (v == null) return 'rgba(255,255,255,0.04)';
  const t = Math.max(0, Math.min(1, (v-1)/9));
  return `oklch(0.74 0.155 ${(18 + t*132).toFixed(0)} / 0.16)`;
};
const overall = (r) => {
  if (!r) return null;
  const s = CRITERIA.reduce((a,c) => a + r[c.key], 0) / CRITERIA.length;
  return Math.round(s*10)/10;
};
const titleHue = (title) => {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h*31 + title.charCodeAt(i)) % 360;
  return h;
};
const fmt = (v) => v == null ? '—' : v.toFixed(1);
const scoreLabel = (v) => {
  if (v == null) return '';
  if (v >= 9.3) return 'Masterpiece';
  if (v >= 8.0) return 'Great';
  if (v >= 7.0) return 'Good';
  if (v >= 6.0) return 'Fine';
  if (v >= 5.0) return 'Average';
  if (v >= 4.0) return 'Mediocre';
  if (v >= 3.0) return 'Bad';
  return 'Awful';
};

const normaliseRanked = (row) => {
  const { story, characters, animation, audio, enjoyment, overall: ov, updated_at, ...rest } = row;
  return { ...rest, rating: { story, characters, animation, audio, enjoyment, overall: ov, updated_at } };
};


/* ─── Shared UI atoms ──────────────────────────────────────────────────── */
function Poster({ anime, w=64, radius=9, showBadge=false, style={} }) {
  const [imgErr, setImgErr] = useState(false);
  const h = titleHue(anime.title), h2 = (h+38)%360;
  const initials = anime.title.replace(/[^A-Za-z0-9 ]/g,'').split(' ')
    .filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();
  const height = w * 1.42;
  const showImg = anime.cover_url && !imgErr;
  return (
    <div style={{
      position:'relative', width:w, height, borderRadius:radius, overflow:'hidden', flexShrink:0,
      background:`linear-gradient(150deg, oklch(0.42 0.13 ${h}), oklch(0.22 0.09 ${h2}) 78%)`,
      boxShadow:'0 6px 18px -8px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06) inset',
      ...style,
    }}>
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        fontFamily:'var(--mono)', fontWeight:700, fontSize:w*0.62,
        color:`oklch(0.9 0.12 ${h})`, opacity:0.14, letterSpacing:'-0.04em' }}>{initials}</div>
      <div style={{ position:'absolute', inset:0,
        background:'repeating-linear-gradient(125deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 9px)' }} />
      <div style={{ position:'absolute', inset:0,
        background:`radial-gradient(120% 70% at 22% 8%, oklch(0.7 0.16 ${h} / 0.35), transparent 55%)` }} />
      {showImg && (
        <img src={anime.cover_url} alt="" onError={() => setImgErr(true)}
          style={{ position:'absolute', inset:0, width:'100%', height:'100%',
            objectFit:'cover', objectPosition:'top center' }} />
      )}
      <div style={{
        position:'absolute', left:0, right:0, bottom:0,
        padding: w<80 ? '14px 7px 7px' : '22px 9px 9px',
        background: showImg
          ? 'linear-gradient(to top, rgba(0,0,0,0.82) 30%, rgba(0,0,0,0.3) 70%, transparent)'
          : 'linear-gradient(to top, rgba(0,0,0,0.78), transparent)',
        fontWeight:800, fontSize:Math.max(8.5, w*0.135), lineHeight:1.12,
        color:'#fff', letterSpacing:'-0.01em',
      }}>{anime.title}</div>
      {showBadge && (
        <div style={{ position:'absolute', top:7, left:7, fontFamily:'var(--mono)', fontSize:9, fontWeight:700,
          padding:'2px 6px', borderRadius:5, background:'rgba(0,0,0,0.55)', color:'#dfe6ef',
          letterSpacing:'0.04em', backdropFilter:'blur(2px)' }}>{anime.format}</div>
      )}
    </div>
  );
}

function ScoreBadge({ value, size='md' }) {
  const c = scoreColor(value);
  const px = size==='lg' ? 56 : size==='sm' ? 34 : 44;
  const fs = size==='lg' ? 23 : size==='sm' ? 14 : 18;
  return (
    <div style={{
      width:px, height:px, borderRadius: size==='lg' ? 14 : 10,
      display:'grid', placeItems:'center',
      fontFamily:'var(--mono)', fontWeight:700, fontSize:fs, color:c,
      background:scoreColorSoft(value),
      boxShadow:`0 0 0 1px ${c.replace(')','/ 0.4)').replace('oklch(','oklch(')} inset`,
      letterSpacing:'-0.02em',
    }}>{value==null ? '—' : value.toFixed(1)}</div>
  );
}

function GenreChip({ children, active, onClick, small }) {
  return (
    <button onClick={onClick} style={{
      fontSize: small ? 11 : 12, fontWeight:600, letterSpacing:'0.01em',
      padding: small ? '3px 9px' : '6px 12px', borderRadius:999,
      color: active ? '#04121f' : 'var(--text-2)',
      background: active ? 'var(--accent)' : 'var(--raised)',
      boxShadow: active ? 'none' : '0 0 0 1px var(--line) inset',
      transition:'all .14s ease', whiteSpace:'nowrap',
      cursor: onClick ? 'pointer' : 'default',
    }}>{children}</button>
  );
}

function FormatTab({ active, onClick, children, count }) {
  return (
    <button onClick={onClick} style={{
      background: 'none', border: 'none', cursor: 'pointer',
      padding: '8px 16px', borderRadius: 9, whiteSpace: 'nowrap',
      fontWeight: active ? 700 : 500, fontSize: 14,
      color: active ? 'var(--accent)' : 'var(--text-2)',
      background: active ? 'rgba(52,168,240,0.12)' : 'transparent',
      display: 'flex', gap: 6, alignItems: 'center',
      transition: 'background 0.15s, color 0.15s',
    }}>
      {children}
      {count != null && (
        <span style={{ fontSize: 11, fontWeight: 600,
          color: active ? 'var(--accent)' : 'var(--text-3)',
          background: 'var(--surface-2)', borderRadius: 99,
          padding: '1px 7px', lineHeight: '18px' }}>{count}</span>
      )}
    </button>
  );
}

const ICON_PATHS = {
  story:      'M5 4.5h9a2 2 0 0 1 2 2V19l-3.5-2-3 2V6.5a2 2 0 0 0-2-2H5z M5 4.5C4 4.5 3.5 5 3.5 6v12.5c0 1 .5 1.5 1.5 1.5',
  characters: 'M8.5 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3.5 19c0-2.8 2.2-5 5-5s5 2.2 5 5 M15.5 13.2A3 3 0 1 0 14 7.4 M16 14c2.2.3 4 2.2 4 4.6',
  animation:  'M4 4.5h16v15H4z M4 9h16 M4 15h16 M8 4.5v15 M16 4.5v15',
  audio:      'M3 12h2l2-6 3 14 3-11 2 5 2-2h4',
  enjoyment:  'M12 20s-7-4.4-9.2-9C1.3 8 2.6 4.8 6 4.8c2 0 3.2 1.4 4 2.6.8-1.2 2-2.6 4-2.6 3.4 0 4.7 3.2 3.2 6.2C19 15.6 12 20 12 20z',
  rank:       'M5 20V9 M12 20V4 M19 20v-7',
  add:        'M12 5v14 M5 12h14',
  search:     'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4',
  star:       'M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.9z',
  back:       'M15 5l-7 7 7 7',
  trash:      'M4 7h16 M9 7V5h6v2 M6 7l1 13h10l1-13',
  close:      'M6 6l12 12 M18 6L6 18',
  check:      'M5 12l5 5 9-11',
  chevron:    'M9 6l6 6-6 6',
  insights:   'M4 20V14 M9 20V8 M14 20V11 M19 20V4',
  upload:     'M12 19V5 M5 12l7-7 7 7 M3 19h18',
};

function Ico({ name, size=18, sw=1.7, color='currentColor', style={} }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
      style={{ flexShrink:0, ...style }}>
      {ICON_PATHS[name].trim().split(/\s+M/).map((seg,i) => (
        <path key={i} d={i===0 ? seg : 'M'+seg} />
      ))}
    </svg>
  );
}

/* ─── Rankings screen ──────────────────────────────────────────────────── */
function MiniScore({ label, value, active }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, minWidth:52 }}>
      <span style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:14.5,
        color: active ? scoreColor(value) : 'var(--text)', opacity: active ? 1 : 0.92 }}>{fmt(value)}</span>
      <span style={{ fontSize:9.5, letterSpacing:'0.06em', textTransform:'uppercase', fontWeight:700,
        color: active ? 'var(--accent-2)' : 'var(--text-3)' }}>{label}</span>
    </div>
  );
}

function RankRow({ anime, rank, onOpen, sortKey }) {
  const [hover, setHover] = useState(false);
  const ov = overall(anime.rating);
  const top = rank <= 3;
  return (
    <div onClick={onOpen} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      className="fade-up"
      style={{
        display:'flex', alignItems:'center', gap:18,
        padding:'13px 18px 13px 14px', borderRadius:14,
        background: hover ? 'var(--hover)' : 'var(--surface)',
        boxShadow: hover
          ? '0 0 0 1px var(--line-2) inset, 0 14px 36px -16px rgba(0,0,0,0.8)'
          : '0 0 0 1px var(--line) inset',
        cursor:'pointer', transition:'background .14s ease, box-shadow .14s ease, transform .14s ease',
        transform: hover ? 'translateY(-1px)' : 'none',
      }}>
      <div style={{ width:34, textAlign:'center', fontFamily:'var(--mono)', fontWeight:700,
        fontSize: top?22:18, color: top?'var(--accent-2)':'var(--text-3)',
        textShadow: top?'0 0 18px rgba(52,168,240,0.5)':'none', flexShrink:0 }}>{rank}</div>
      <Poster anime={anime} w={50} radius={7} />
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontWeight:700, fontSize:16, letterSpacing:'-0.01em',
          whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{anime.title}</div>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:5, color:'var(--text-3)', fontSize:12 }}>
          <span className="mono">{anime.year}</span>
          <span style={{opacity:.4}}>&bull;</span>
          <span>{anime.format}{anime.episodes > 1 ? ` · ${anime.episodes} ep` : ''}</span>
          <span style={{opacity:.4}}>&bull;</span>
          <span style={{ whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', color:'var(--text-2)' }}>
            {anime.genres.slice(0,3).join(' · ')}
          </span>
        </div>
      </div>
      <div style={{ display:'flex', gap:4 }}>
        {CRITERIA.map(c => <MiniScore key={c.key} label={c.label.slice(0,4)} value={anime.rating[c.key]} active={sortKey===c.key} />)}
      </div>
      <div style={{ width:1, height:40, background:'var(--line)', margin:'0 2px' }} />
      <ScoreBadge value={ov} />
    </div>
  );
}

function DropdownSelect({ label, value, onChange, options, render }) {
  return (
    <label style={{ display:'flex', alignItems:'center', gap:8, fontSize:12.5, color:'var(--text-3)', fontWeight:600 }}>
      {label}
      <div style={{ position:'relative' }}>
        <select value={value} onChange={e=>onChange(e.target.value)} style={{
          appearance:'none', background:'var(--raised)', color:'var(--text)',
          border:'none', boxShadow:'0 0 0 1px var(--line) inset', borderRadius:8,
          padding:'7px 30px 7px 11px', fontSize:13, fontWeight:600, fontFamily:'inherit',
          cursor:'pointer', outline:'none',
        }}>
          {options.map(o => <option key={o} value={o} style={{background:'#1a1c23'}}>{render ? render(o) : o}</option>)}
        </select>
        <span style={{ position:'absolute', right:9, top:'50%', transform:'translateY(-50%) rotate(90deg)', pointerEvents:'none', color:'var(--text-3)' }}>
          <Ico name="chevron" size={14} />
        </span>
      </div>
    </label>
  );
}

function Rankings({ library, navigate }) {
  const [q, setQ]             = useState('');
  const [genre, setGenre]     = useState('All');
  const [fmtFilter, setFmt]   = useState('All');
  const [season, setSeason]   = useState('All');
  const [sortKey, setSortKey] = useState('overall');

  const rated  = library.filter(a => a.rating);
  const genres = useMemo(() => {
    const s = new Set(); rated.forEach(a => a.genres.forEach(g => s.add(g)));
    return ['All', ...[...s].sort()];
  }, [library]);
  const formats = useMemo(() => {
    const s = new Set(); rated.forEach(a => a.format && s.add(a.format));
    const order = ['TV','Movie','OVA','ONA','Special','Music'];
    return ['All', ...order.filter(f => s.has(f)), ...[...s].filter(f => !order.includes(f)).sort()];
  }, [library]);
  const fmtCounts = useMemo(() => {
    const m = { All: rated.length };
    rated.forEach(a => { if (a.format) m[a.format] = (m[a.format] || 0) + 1; });
    return m;
  }, [library]);
  const seasons = useMemo(() => {
    const s = new Set(); rated.forEach(a => a.season && s.add(a.season));
    return ['All', ...[...s].sort((a,b) => b.localeCompare(a))];
  }, [library]);

  const list = useMemo(() => {
    const l = rated.filter(a =>
      (genre==='All' || a.genres.includes(genre)) &&
      (fmtFilter==='All' || a.format===fmtFilter) &&
      (season==='All' || a.season===season) &&
      (q==='' || a.title.toLowerCase().includes(q.toLowerCase())));
    const val = (a) => sortKey==='overall' ? overall(a.rating) : a.rating[sortKey];
    return l.sort((a,b) => val(b) - val(a));
  }, [library, q, genre, fmtFilter, season, sortKey]);

  const sortOpts = [{ key:'overall', label:'Overall' }, ...CRITERIA];

  const exportMAL = () => {
    const cd = (s) => `<![CDATA[${s ?? ''}]]>`;
    const entries = rated.map(a => [
      '  <anime>',
      `    <series_animedb_id>${a.api_id || 0}</series_animedb_id>`,
      `    <series_title>${cd(a.title)}</series_title>`,
      `    <series_type>${a.format || ''}</series_type>`,
      `    <series_episodes>${a.episodes || 0}</series_episodes>`,
      `    <my_id>0</my_id>`,
      `    <my_watched_episodes>${a.episodes || 0}</my_watched_episodes>`,
      `    <my_start_date>0000-00-00</my_start_date>`,
      `    <my_finish_date>${a.rating.updated_at || '0000-00-00'}</my_finish_date>`,
      `    <my_score>${Math.round(a.rating.overall)}</my_score>`,
      `    <my_status>Completed</my_status>`,
      `    <my_tags>${cd(a.genres.join(', '))}</my_tags>`,
      `    <my_comments>${cd(`Story:${a.rating.story} Characters:${a.rating.characters} Animation:${a.rating.animation} Audio:${a.rating.audio} Enjoyment:${a.rating.enjoyment}`)}</my_comments>`,
      `    <update_on_import>1</update_on_import>`,
      '  </anime>',
    ].join('\n')).join('\n');

    const xml = [
      '<?xml version="1.0" encoding="UTF-8"?>',
      '<myanimelist>',
      '  <myinfo>',
      `    <user_export_type>1</user_export_type>`,
      `    <user_total_anime>${rated.length}</user_total_anime>`,
      `    <user_total_completed>${rated.length}</user_total_completed>`,
      `    <user_total_watching>0</user_total_watching>`,
      `    <user_total_onhold>0</user_total_onhold>`,
      `    <user_total_dropped>0</user_total_dropped>`,
      `    <user_total_plantowatch>0</user_total_plantowatch>`,
      '  </myinfo>',
      entries,
      '</myanimelist>',
    ].join('\n');

    const url = URL.createObjectURL(new Blob([xml], { type:'text/xml' }));
    Object.assign(document.createElement('a'), { href:url, download:'myanimelist.xml' }).click();
    URL.revokeObjectURL(url);
  };

  return (
    <div style={{ padding:'30px 38px 60px', position:'relative', zIndex:1 }}>
      <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:20, marginBottom:22 }}>
        <div>
          <h1 style={{ margin:0, fontSize:30, fontWeight:800, letterSpacing:'-0.02em' }}>Your Rankings</h1>
          <p style={{ margin:'6px 0 0', color:'var(--text-3)', fontSize:13.5 }}>
            <span className="mono" style={{color:'var(--text-2)'}}>{rated.length}</span> titles ranked by anchored comparison
          </p>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          {rated.length > 0 && (
            <button className="btn btn-ghost" onClick={exportMAL} title="Export as MyAnimeList XML">
              <Ico name="back" size={16} sw={2.2} style={{transform:'rotate(90deg)'}} /> Export XML
            </button>
          )}
          <button className="btn btn-primary" onClick={()=>navigate({name:'search'})}>
            <Ico name="add" size={17} sw={2.2} /> Add anime
          </button>
        </div>
      </div>

      <div style={{ display:'flex', gap:2, marginBottom:4, overflowX:'auto',
        borderBottom:'1px solid var(--line)', paddingBottom:2 }}>
        {formats.map(f => (
          <FormatTab key={f} active={fmtFilter===f} onClick={()=>setFmt(f)} count={fmtCounts[f]}>
            {f}
          </FormatTab>
        ))}
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:14, flexWrap:'wrap',
        padding:'14px 16px', borderRadius:14, background:'var(--surface)',
        boxShadow:'0 0 0 1px var(--line) inset', marginBottom:20 }}>
        <div style={{ display:'flex', alignItems:'center', gap:9, flex:1, minWidth:200 }}>
          <Ico name="search" size={16} color="var(--text-3)" />
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Filter your library…"
            style={{ flex:1, background:'none', border:'none', outline:'none', color:'var(--text)', fontSize:14 }} />
        </div>
        <div style={{ width:1, height:22, background:'var(--line)' }} />
        {seasons.length > 2 && <DropdownSelect label="Season" value={season} onChange={setSeason} options={seasons} />}
        <DropdownSelect label="Sort" value={sortKey} onChange={setSortKey}
          options={sortOpts.map(o=>o.key)} render={k => sortOpts.find(o=>o.key===k).label} />
      </div>

      <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:22 }}>
        {genres.map(g => <GenreChip key={g} active={genre===g} onClick={()=>setGenre(g)}>{g}</GenreChip>)}
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:9 }}>
        {list.map((a,i) => (

            onOpen={()=>navigate({name:'detail', animeId:a.id})} />
        ))}
        {list.length===0 && (
          <div style={{ textAlign:'center', padding:'60px 0', color:'var(--text-3)' }}>No titles match these filters.</div>
        )}
      </div>
    </div>
  );
}

function StatCard({ label, value, sub }) {

    <div style={{ flex:1, minWidth:140, padding:'18px 20px', borderRadius:14,
      background:'var(--surface)', boxShadow:'0 0 0 1px var(--line) inset' }}>

      {sub && <div style={{ fontSize:12, color:'var(--text-3)', marginTop:4 }}>{sub}</div>}
    </div>

}

function HBar({ label, value, max, color }) {
  const pct = max > 0 ? (value / max) * 100 : 0;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:12 }}>
      <div style={{ width:96, fontSize:13, color:'var(--text-2)', fontWeight:600,
        textAlign:'right', flexShrink:0 }}>{label}</div>
      <div style={{ flex:1, height:10, borderRadius:99, background:'var(--raised)',
        overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', borderRadius:99,
          background: color || 'var(--accent)', transition:'width 0.4s ease' }} />
      </div>
      <div style={{ width:36, fontFamily:'var(--mono)', fontSize:13,
        fontWeight:700, color:'var(--text-2)', textAlign:'right' }}>
        {value.toFixed(1)}
      </div>
    </div>
  );
}

function Insights({ library }) {
  const rated = library.filter(a => a.rating);

  const avgOverall = rated.length
    ? (rated.reduce((s, a) => s + a.rating.overall, 0) / rated.length)
    : 0;

  const avgVsMal = useMemo(() => {
    const withMal = rated.filter(a => a.mal_score != null);
    if (!withMal.length) return null;
    const delta = withMal.reduce((s, a) => s + (a.rating.overall - a.mal_score), 0) / withMal.length;
    return { delta, count: withMal.length };
  }, [library]);

  const criterionAvgs = useMemo(() => {
    if (!rated.length) return {};
    return CRITERIA.reduce((acc, c) => {
      acc[c.key] = rated.reduce((s, a) => s + (a.rating[c.key] || 0), 0) / rated.length;
      return acc;
    }, {});
  }, [library]);

  const genreStats = useMemo(() => {
    const map = {};
    rated.forEach(a => {
      a.genres.forEach(g => {
        if (!map[g]) map[g] = { sum: 0, count: 0 };
        map[g].sum   += a.rating.overall;
        map[g].count += 1;
      });
    });
    return Object.entries(map)
      .map(([g, { sum, count }]) => ({ genre: g, avg: sum / count, count }))
      .sort((a, b) => b.avg - a.avg)
      .slice(0, 10);
  }, [library]);

  const distribution = useMemo(() => {
    const buckets = {};
    for (let i = 1; i <= 10; i += 0.5) buckets[i.toFixed(1)] = 0;
    rated.forEach(a => {
      const b = (Math.floor(a.rating.overall * 2) / 2).toFixed(1);
      if (buckets[b] !== undefined) buckets[b]++;
    });
    return Object.entries(buckets).map(([score, count]) => ({ score, count }));
  }, [library]);

  const distMax = Math.max(...distribution.map(d => d.count), 1);

  const formatStats = useMemo(() => {
    const map = {};
    rated.forEach(a => {
      const f = a.format || 'Unknown';
      if (!map[f]) map[f] = { sum: 0, count: 0 };
      map[f].sum   += a.rating.overall;
      map[f].count += 1;
    });
    const order = ['TV','Movie','OVA','ONA','Special','Music'];
    return Object.entries(map)
      .map(([fmt, { sum, count }]) => ({ fmt, avg: sum / count, count }))
      .sort((a, b) => (order.indexOf(a.fmt) + 99) - (order.indexOf(b.fmt) + 99)
        || b.count - a.count);
  }, [library]);

  const topGenre = genreStats[0]?.genre || '—';
  const criterionMax = Math.max(...Object.values(criterionAvgs), 10);

  const CRITERION_COLORS = {
    story: '#34a8f0', characters: '#a78bfa', animation: '#34d399',
    audio: '#fbbf24', enjoyment: '#f87171',
  };

  if (!rated.length) return (
    <div style={{ padding:'30px 38px', color:'var(--text-3)', textAlign:'center',
      paddingTop:80 }}>Add and rate some anime to see your insights.</div>
  );

  return (
    <div style={{ padding:'30px 38px 60px', position:'relative', zIndex:1 }}>
      <h1 style={{ margin:'0 0 6px', fontSize:30, fontWeight:800, letterSpacing:'-0.02em' }}>
        Insights
      </h1>
      <p style={{ margin:'0 0 28px', color:'var(--text-3)', fontSize:13.5 }}>
        Stats across your <span className="mono" style={{color:'var(--text-2)'}}>{rated.length}</span> rated titles
      </p>

      {/* Summary cards */}
      <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:32 }}>
        <StatCard label="Titles ranked" value={rated.length} />
        <StatCard label="Avg overall" value={avgOverall.toFixed(2)} />
        <StatCard label="Top genre" value={topGenre}
          sub={genreStats[0] ? `${genreStats[0].count} titles · ${genreStats[0].avg.toFixed(1)} avg` : null} />
        {avgVsMal && (
          <StatCard label="Avg vs MAL"
            value={(avgVsMal.delta >= 0 ? '+' : '') + avgVsMal.delta.toFixed(2)}
            sub={`across ${avgVsMal.count} title${avgVsMal.count !== 1 ? 's' : ''} with MAL data`} />
        )}
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, marginBottom:24 }}>
        {/* Criterion averages */}
        <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
          boxShadow:'0 0 0 1px var(--line) inset' }}>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
            Criterion averages
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            {CRITERIA.map(c => (
              <HBar key={c.key} label={c.label}
                value={criterionAvgs[c.key] || 0}
                max={criterionMax}
                color={CRITERION_COLORS[c.key]} />
            ))}
          </div>
        </div>

        {/* Score distribution */}
        <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
          boxShadow:'0 0 0 1px var(--line) inset' }}>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
            Score distribution
          </div>
          <div style={{ display:'flex', alignItems:'flex-end', gap:3, height:80 }}>
            {distribution.map(({ score, count }) => (
              <div key={score} style={{ flex:1, display:'flex', flexDirection:'column',
                alignItems:'center', gap:3 }}>
                <div style={{ width:'100%', borderRadius:'3px 3px 0 0',
                  background: count > 0 ? 'var(--accent)' : 'var(--raised)',
                  height: `${(count / distMax) * 70}px`,
                  opacity: count > 0 ? 0.85 : 0.3,
                  transition:'height 0.3s ease', minHeight: count > 0 ? 4 : 0 }} />
              </div>
            ))}
          </div>
          <div style={{ display:'flex', justifyContent:'space-between',
            marginTop:6, fontSize:10, color:'var(--text-4)', fontFamily:'var(--mono)' }}>
            <span>1</span><span>5</span><span>10</span>
          </div>
        </div>
      </div>

      {/* Genre leaderboard */}
      <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
        boxShadow:'0 0 0 1px var(--line) inset', marginBottom:20 }}>
        <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
          textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
          Genre leaderboard
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {genreStats.map(({ genre, avg, count }, i) => (
            <div key={genre} style={{ display:'flex', alignItems:'center', gap:12 }}>
              <div style={{ width:20, fontFamily:'var(--mono)', fontSize:11,
                color:'var(--text-4)', textAlign:'right' }}>{i+1}</div>
              <div style={{ flex:1, fontSize:13.5, fontWeight:600, color:'var(--text)' }}>{genre}</div>
              <div style={{ fontSize:12, color:'var(--text-3)' }}>{count} title{count!==1?'s':''}</div>
              <div style={{ width:38, fontFamily:'var(--mono)', fontSize:13, fontWeight:700,
                color:'var(--accent-2)', textAlign:'right' }}>{avg.toFixed(1)}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Format breakdown */}
      {formatStats.length > 1 && (
        <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
          boxShadow:'0 0 0 1px var(--line) inset' }}>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
            Format breakdown
          </div>
          <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
            {formatStats.map(({ fmt, avg, count }) => (
              <div key={fmt} style={{ padding:'10px 16px', borderRadius:10,
                background:'var(--raised)', boxShadow:'0 0 0 1px var(--line) inset',
                minWidth:100 }}>
                <div style={{ fontSize:12, color:'var(--text-3)', fontWeight:600 }}>{fmt}</div>
                <div style={{ fontFamily:'var(--mono)', fontSize:20, fontWeight:700,
                  color:'var(--text)', marginTop:2 }}>{count}</div>
                <div style={{ fontSize:11, color:'var(--accent)', marginTop:1 }}>
                  {avg.toFixed(1)} avg
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── AniList import ───────────────────────────────────────────────────── */
function parseAniListCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const rows = lines.slice(1).map(line => {
    const fields = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { fields.push(cur); cur = ''; continue; }
      cur += c;
    }
    fields.push(cur);
    return fields;
  });
  const scores = rows.map(f => parseFloat(f[2]) || 0).filter(s => s > 0);
  const use100 = scores.some(s => s > 10);
  return rows
    .filter(f => f[0] && (parseFloat(f[2]) || 0) > 0)
    .map(f => ({
      title: f[0].trim(),
      status: (f[1] || '').trim(),
      score: Math.min(10, Math.max(1, use100 ? parseFloat(f[2]) / 10 : parseFloat(f[2]))),
    }));
}

function AniListImport({ onClose, library, setLibrary }) {
  const [phase, setPhase]         = useState('pick');
  const [entries, setEntries]     = useState([]);
  const [progress, setProgress]   = useState(0);
  const [current, setCurrent]     = useState('');
  const [doneCount, setDoneCount] = useState(0);
  const [skipCount, setSkipCount] = useState(0);
  const have = new Set(library.map(a => a.title.toLowerCase()));

  const onFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const parsed = parseAniListCSV(ev.target.result);
      setEntries(parsed.filter(en => !have.has(en.title.toLowerCase())));
      setPhase('preview');
    };
    reader.readAsText(file);
  };

  const runImport = async () => {
    setPhase('importing');
    let done = 0, skipped = 0;
    for (let i = 0; i < entries.length; i++) {
      const en = entries[i];
      setProgress(i);
      setCurrent(en.title);
      try {
        const r = await fetch(`/search?q=${encodeURIComponent(en.title)}`).then(r => r.json());
        const match = r.results?.[0];
        if (!match) { skipped++; await new Promise(res => setTimeout(res, 400)); continue; }
        const v = Math.round(en.score * 10) / 10;
        const scores = { story: v, characters: v, animation: v, audio: v, enjoyment: v };
        const { id } = await fetch('/anime', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            api_id: match.api_id, title: match.title, cover_url: match.cover_url,
            genres: match.genres, year: match.year, season: match.season,
            episodes: match.episodes, format: match.format, synopsis: match.synopsis,
            mal_score: match.mal_score,
          }),
        }).then(r => r.json());
        await fetch(`/anime/${id}/rating`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(scores),
        });
        const rating = { ...scores, overall: v, updated_at: new Date().toISOString().slice(0, 10) };
        setLibrary(lib => [...lib, { ...match, id, rating }]);
        done++;
      } catch { skipped++; }
      await new Promise(res => setTimeout(res, 400));
    }
    setDoneCount(done);
    setSkipCount(skipped);
    setPhase('done');
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:100,
      display:'flex', alignItems:'center', justifyContent:'center' }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:'var(--surface)', borderRadius:18, padding:32, width:480,
        maxHeight:'80vh', overflow:'auto',
        boxShadow:'0 24px 80px rgba(0,0,0,0.4)', border:'1px solid var(--line)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
          <h2 style={{ margin:0, fontSize:20, fontWeight:800 }}>Import from AniList</h2>
          <button className="btn-quiet" onClick={onClose} style={{padding:6}}><Ico name="close" size={18} /></button>
        </div>

        {phase === 'pick' && (
          <div>
            <p style={{ color:'var(--text-3)', fontSize:13.5, margin:'0 0 20px', lineHeight:1.6 }}>
              Export your list from AniList:{' '}
              <span style={{color:'var(--text-2)'}}>Settings &rarr; Export &rarr; Anime List (CSV)</span>.
              Upload the file below. Only scored entries are imported.
            </p>
            <label style={{ display:'block', border:'2px dashed var(--line)', borderRadius:12,
              padding:'32px 24px', textAlign:'center', cursor:'pointer' }}>
              <Ico name="upload" size={28} color="var(--accent-2)" />
              <div style={{ marginTop:10, fontSize:14, color:'var(--text-2)', fontWeight:600 }}>
                Choose AniList CSV export
              </div>
              <div style={{ fontSize:12, color:'var(--text-3)', marginTop:4 }}>
                Entries already in your library are skipped
              </div>
              <input type="file" accept=".csv" style={{ display:'none' }} onChange={onFile} />
            </label>
          </div>
        )}

        {phase === 'preview' && (
          <div>
            <p style={{ color:'var(--text-3)', fontSize:13.5, margin:'0 0 16px' }}>
              Found{' '}
              <span style={{color:'var(--text)', fontWeight:700}}>{entries.length}</span>{' '}
              scored {entries.length === 1 ? 'entry' : 'entries'} not yet in your library.
              Each score is applied equally across all 5 criteria.
            </p>
            <div style={{ maxHeight:260, overflowY:'auto', marginBottom:20,
              border:'1px solid var(--line)', borderRadius:10 }}>
              {entries.length === 0
                ? <div style={{ padding:'32px 16px', textAlign:'center', color:'var(--text-3)' }}>
                    No new scored entries to import.
                  </div>
                : entries.map((en, i) => (
                  <div key={i} style={{ display:'flex', justifyContent:'space-between',
                    alignItems:'center', padding:'10px 16px',
                    borderBottom: i < entries.length - 1 ? '1px solid var(--line)' : 'none',
                    fontSize:13.5 }}>
                    <span style={{ flex:1, whiteSpace:'nowrap', overflow:'hidden',
                      textOverflow:'ellipsis', marginRight:12 }}>{en.title}</span>
                    <span style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:13,
                      color:'var(--accent)', flexShrink:0 }}>{en.score.toFixed(1)}</span>
                  </div>
                ))}
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button className="btn btn-ghost" onClick={onClose} style={{ flex:1 }}>Cancel</button>
              <button className="btn" onClick={runImport} disabled={entries.length === 0} style={{ flex:2 }}>
                Import {entries.length} {entries.length === 1 ? 'entry' : 'entries'}
              </button>
            </div>
          </div>
        )}

        {phase === 'importing' && (
          <div>
            <p style={{ color:'var(--text-3)', fontSize:13.5, margin:'0 0 16px', textAlign:'center' }}>
              Importing&hellip;{' '}
              <span style={{color:'var(--text-2)', fontFamily:'var(--mono)'}}>
                {progress + 1} / {entries.length}
              </span>
            </p>
            <div style={{ height:6, borderRadius:99, background:'var(--raised)', overflow:'hidden', marginBottom:12 }}>
              <div style={{ width:`${((progress + 1) / entries.length) * 100}%`, height:'100%',
                borderRadius:99, background:'var(--accent)', transition:'width 0.4s ease' }} />
            </div>
            <div style={{ fontSize:12.5, color:'var(--text-3)', textAlign:'center',
              whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              {current}
            </div>
          </div>
        )}

        {phase === 'done' && (
          <div style={{ textAlign:'center', padding:'8px 0' }}>
            <div style={{ width:48, height:48, borderRadius:'50%', background:'rgba(52,168,240,0.12)',
              display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 16px' }}>
              <Ico name="check" size={24} sw={2.4} color="var(--accent-2)" />
            </div>
            <div style={{ fontSize:17, fontWeight:700, marginBottom:6 }}>
              Imported {doneCount} {doneCount === 1 ? 'title' : 'titles'}
            </div>
            {skipCount > 0 && (
              <div style={{ fontSize:13, color:'var(--text-3)', marginBottom:20 }}>
                {skipCount} {skipCount === 1 ? 'entry' : 'entries'} couldn&rsquo;t be matched on MyAnimeList &mdash; add them manually.
              </div>
            )}
            <button className="btn" onClick={onClose}
              style={{ width:'100%', marginTop: skipCount > 0 ? 0 : 20 }}>
              View Rankings
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function ManualAdd({ onClose, onAdd }) {
  const [f, setF] = useState({ title:'', year:'2024', episodes:'12', format:'TV', genres:'' });
  const valid = f.title.trim().length > 1;
  const submit = () => {
    if (!valid) return;
    onAdd({
      title: f.title.trim(), year: parseInt(f.year)||2024, season:'',
      episodes: parseInt(f.episodes)||1, format: f.format,
      genres: f.genres.split(',').map(s=>s.trim()).filter(Boolean).slice(0,5) || ['Unknown'],
      synopsis:'',
    });
  };
  const field = (lbl, key, props={}) => (
    <label style={{ display:'flex', flexDirection:'column', gap:6, fontSize:12, fontWeight:700,
      color:'var(--text-3)', letterSpacing:'0.03em', textTransform:'uppercase' }}>
      {lbl}
      <input value={f[key]} onChange={e=>setF({...f,[key]:e.target.value})} {...props}
        style={{ background:'var(--raised)', border:'none', boxShadow:'0 0 0 1px var(--line) inset',
          borderRadius:9, padding:'11px 13px', color:'var(--text)', fontSize:14, outline:'none',
          fontWeight:500, textTransform:'none', letterSpacing:0 }} />
    </label>
  );
  return (
    <div onClick={onClose} className="fade-in" style={{ position:'fixed', inset:0,
      background:'rgba(4,5,8,0.7)', backdropFilter:'blur(4px)',
      display:'grid', placeItems:'center', zIndex:50 }}>
      <div onClick={e=>e.stopPropagation()} className="fade-up" style={{ width:460, maxWidth:'90vw',
        background:'var(--surface-2)', borderRadius:18, padding:26,
        boxShadow:'0 0 0 1px var(--line-2) inset, var(--shadow)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:4 }}>
          <h2 style={{ margin:0, fontSize:20, fontWeight:800 }}>Add manually</h2>
          <button className="btn-quiet" onClick={onClose} style={{padding:6}}><Ico name="close" size={18} /></button>
        </div>
        <p style={{ margin:'0 0 20px', color:'var(--text-3)', fontSize:13 }}>For titles the API can&rsquo;t reach. You can edit these later.</p>
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {field('Title','title',{placeholder:'Anime title',autoFocus:true})}
          <div style={{display:'flex',gap:12}}>
            <div style={{flex:1}}>{field('Year','year',{type:'number'})}</div>
            <div style={{flex:1}}>{field('Episodes','episodes',{type:'number'})}</div>
          </div>
          {field('Genres','genres',{placeholder:'Action, Drama, Fantasy'})}
        </div>
        <div style={{ display:'flex', justifyContent:'flex-end', gap:10, marginTop:24 }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit}
            style={{ opacity:valid?1:0.5, pointerEvents:valid?'auto':'none' }}>Continue to rating</button>
        </div>
      </div>
    </div>
  );
}

function Search({ library, navigate, importAnime, setLibrary }) {
  const [q, setQ]             = useState('');
  const [manual, setManual]   = useState(false);
  const [aniList, setAniList]   = useState(false);
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const have = new Set(library.map(a => a.title.toLowerCase()));

  useEffect(() => {
    if (!q.trim()) { setResults([]); return; }
    const id = setTimeout(() => {
      setLoading(true);
      fetch(`/search?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(d => setResults(d.results || []))
        .catch(() => setResults([]))
        .finally(() => setLoading(false));
    }, 320);
    return () => clearTimeout(id);
  }, [q]);

  return (
    <div style={{ padding:'30px 38px 60px', position:'relative', zIndex:1, maxWidth:940 }}>
      <button className="btn-quiet" onClick={()=>navigate({name:'rankings'})}
        style={{ display:'inline-flex', alignItems:'center', gap:6, marginBottom:16 }}>
        <Ico name="back" size={16} /> Rankings
      </button>
      <h1 style={{ margin:'0 0 6px', fontSize:30, fontWeight:800, letterSpacing:'-0.02em' }}>Add an anime</h1>
      <p style={{ margin:'0 0 22px', color:'var(--text-3)', fontSize:13.5 }}>
        Search pulls metadata from <span style={{color:'var(--text-2)'}}>Jikan (MyAnimeList)</span> &mdash; cover, genres, year &amp; episodes autofill.
      </p>

      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'15px 18px', borderRadius:14,
        background:'var(--surface)', boxShadow:'0 0 0 1px var(--line-2) inset, 0 0 30px -10px rgba(52,168,240,0.3)',
        marginBottom:8 }}>
        <Ico name="search" size={20} color="var(--accent-2)" />
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Search by title… e.g. Jujutsu Kaisen"
          style={{ flex:1, background:'none', border:'none', outline:'none', color:'var(--text)', fontSize:16, fontWeight:500 }} />
        {q && <button className="btn-quiet" onClick={()=>setQ('')} style={{padding:6}}><Ico name="close" size={16} /></button>}
      </div>

      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
        margin:'14px 2px 14px', color:'var(--text-3)', fontSize:12.5 }}>
        <span className="mono">
          {loading ? 'Searching…' : `${results.length} result${results.length!==1?'s':''}`}
        </span>
        <div style={{ display:'flex', gap:8 }}>
          <button className="btn-quiet" onClick={()=>setManual(true)} style={{fontSize:12.5}}>Can&rsquo;t find it? Add manually</button>
          <button className="btn-quiet" onClick={()=>setAniList(true)}
            style={{ fontSize:12.5, display:'flex', alignItems:'center', gap:5 }}>
            <Ico name="upload" size={13} /> Import from AniList
          </button>
        </div>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
        {results.map(item => (
          <ResultCard key={item.api_id || item.title} item={item}
            inLibrary={have.has(item.title.toLowerCase())} onImport={importAnime} />
        ))}
        {!loading && q.trim() && results.length===0 && (
          <div style={{ textAlign:'center', padding:'40px 0', color:'var(--text-3)' }}>
            No matches found.{' '}
            <button className="btn-quiet" onClick={()=>setManual(true)} style={{color:'var(--accent-2)'}}>Add it manually &rarr;</button>
          </div>
        )}
        {!q.trim() && (
          <div style={{ textAlign:'center', padding:'60px 0', color:'var(--text-3)' }}>
            Type a title above to search MyAnimeList.
          </div>
        )}
      </div>
      {manual && <ManualAdd onClose={()=>setManual(false)}
        onAdd={(item) => { setManual(false); importAnime(item); }} />}
      {aniList && <AniListImport onClose={()=>setAniList(false)} library={library} setLibrary={setLibrary} />}
    </div>
  );
}

/* ─── Rating flow ──────────────────────────────────────────────────────── */
function CompCard({ anime, critKey, setAnchorScore }) {
  const [editing, setEditing] = useState(false);
  const v = anime.rating[critKey];
  return (
    <div className="fade-in" style={{ width:104, flexShrink:0 }}>
      <div style={{ position:'relative' }}>
        <Poster anime={anime} w={104} radius={9} />
        <div style={{
          position:'absolute', top:7, right:7, fontFamily:'var(--mono)', fontWeight:700, fontSize:13,
          padding:'2px 7px', borderRadius:7, color:scoreColor(v),
          background:'rgba(0,0,0,0.62)', backdropFilter:'blur(2px)',
          boxShadow:`0 0 0 1px ${scoreColor(v).replace(')','/ 0.5)')} inset`,
        }}>{v.toFixed(1)}</div>
      </div>
      <div style={{ marginTop:7, display:'flex', justifyContent:'center' }}>
        <button onClick={()=>setEditing(e=>!e)} style={{
          fontSize:11, fontWeight:700, color: editing ? 'var(--accent-2)' : 'var(--text-3)',
          padding:'3px 8px', borderRadius:7, transition:'color .12s ease',
        }}>{editing ? 'Done' : 'Change score'}</button>
      </div>
      {editing && (
        <div className="fade-in" style={{marginTop:4}}>
          <input className="mar-slider mar-slider-sm" type="range" min={10} max={100} step={1}
            value={Math.round(v*10)}
            onChange={e=>setAnchorScore(anime.id, critKey, parseInt(e.target.value)/10)}
            style={{ '--fill':`${((v-1)/9)*100}%`, '--thumb':scoreColor(v) }} />
        </div>
      )}
    </div>
  );
}

function Bucket({ dir, label, items, critKey, setAnchorScore }) {
  if (items.length===0) return null;
  const up = dir==='higher';
  return (
    <div style={{ marginBottom:26 }}>
      <div style={{ display:'flex', alignItems:'center', gap:9, marginBottom:14 }}>
        <span style={{ fontSize:13, color: up ? scoreColor(8.6) : scoreColor(5.2) }}>{up ? '▲' : '▼'}</span>
        <span style={{ fontSize:12, fontWeight:800, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--text-2)' }}>{label}</span>
        <span className="mono" style={{ fontSize:11.5, color:'var(--text-4)' }}>{items.length}</span>
      </div>
      <div style={{ display:'flex', flexWrap:'wrap', gap:18 }}>
        {items.map(({a}) => <CompCard key={a.id} anime={a} critKey={critKey} setAnchorScore={setAnchorScore} />)}
      </div>
    </div>
  );
}

function RatingFlow({ anime, library, navigate, saveRating, setAnchorScore }) {
  const [step, setStep]   = useState(0);
  const [scores, setScores] = useState(() => {
    const init = {};
    CRITERIA.forEach(c => { init[c.key] = anime.rating ? anime.rating[c.key] : 7.0; });
    return init;
  });
  const [broaden, setBroaden] = useState(false);

  const crit  = CRITERIA[step];
  const value = scores[crit.key];
  const setValue = (v) => setScores(s => ({ ...s, [crit.key]: v }));

  const sharedAnchors = useMemo(() =>
    library.filter(a => a.id!==anime.id && a.rating && a.genres.some(g=>anime.genres.includes(g))),
    [library, anime.id]);
  const allAnchors = useMemo(() =>
    library.filter(a => a.id!==anime.id && a.rating), [library, anime.id]);

  const fewMatches = sharedAnchors.length < 2;
  const useAll     = broaden || fewMatches;
  const pool       = (useAll ? allAnchors : sharedAnchors).map(a => ({ a, v: a.rating[crit.key] }));
  const higher     = pool.filter(x => x.v > value+0.001).sort((a,b) => a.v-b.v);
  const lower      = pool.filter(x => x.v < value-0.001).sort((a,b) => b.v-a.v);
  const same       = pool.filter(x => Math.abs(x.v-value) <= 0.001).sort((a,b) => a.a.title.localeCompare(b.a.title));
  const nearestAbove = higher[0];
  const nearestBelow = lower[0];

  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState(null);
  const done           = step === CRITERIA.length - 1;
  const runningOverall = overall(scores);
  const finish         = async () => {
    setSaving(true); setSaveErr(null);
    try { await saveRating(anime, { ...scores }); }
    catch { setSaving(false); setSaveErr('Save failed — check the server and try again.'); }
  };

  return (
    <div style={{ position:'relative', zIndex:1, height:'100%', display:'flex', flexDirection:'column' }}>
      {/* top bar */}
      <div style={{ display:'flex', alignItems:'center', gap:16, padding:'18px 36px', borderBottom:'1px solid var(--line)' }}>
        <button className="btn-quiet" onClick={()=>navigate({name:'search'})} style={{padding:7}}><Ico name="back" size={18} /></button>
        <Poster anime={anime} w={38} radius={7} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:16.5, letterSpacing:'-0.01em' }}>{anime.title}</div>
          <div style={{ fontSize:12, color:'var(--text-3)', marginTop:2 }}>
            {anime.genres.join(' · ')} &middot; <span className="mono">{anime.year}</span>
          </div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontSize:10, letterSpacing:'0.07em', textTransform:'uppercase', fontWeight:700, color:'var(--text-3)', marginBottom:2 }}>Overall so far</div>
          <div style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:21, color:scoreColor(runningOverall) }}>{runningOverall.toFixed(1)}</div>
        </div>
      </div>

      {/* criteria stepper */}
      <div style={{ display:'flex', gap:8, padding:'15px 36px 0' }}>
        {CRITERIA.map((c,i) => {
          const cur = i===step, passed = i<step;
          return (
            <button key={c.key} onClick={()=>setStep(i)} style={{
              flex:1, padding:'9px 12px', borderRadius:10, textAlign:'left',
              background: cur ? 'var(--raised)' : 'transparent',
              boxShadow: cur ? '0 0 0 1px var(--accent) inset' : '0 0 0 1px var(--line) inset',
              transition:'all .15s ease',
            }}>
              <div style={{ display:'flex', alignItems:'center', gap:7 }}>
                <Ico name={c.key} size={15} sw={1.7}
                  color={cur ? 'var(--accent-2)' : (passed ? 'var(--text-2)' : 'var(--text-4)')} />
                <span style={{ fontSize:12.5, fontWeight:700, color: cur?'var(--text)':'var(--text-3)' }}>{c.label}</span>
              </div>
              <div style={{ marginTop:5, fontFamily:'var(--mono)', fontWeight:700, fontSize:15, color:scoreColor(scores[c.key]) }}>
                {scores[c.key].toFixed(1)}
              </div>
            </button>
          );
        })}
      </div>

      {/* main split */}
      <div style={{ flex:1, display:'grid', gridTemplateColumns:'372px 1fr', minHeight:0 }}>
        {/* left: candidate + input */}
        <div style={{ padding:'24px 28px 24px 36px', display:'flex', flexDirection:'column', borderRight:'1px solid var(--line)' }}>
          <div style={{ fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase', fontWeight:800, color:'var(--accent-2)' }}>
            You&rsquo;re about to rate &middot; {step+1} / 5
          </div>
          <h2 style={{ margin:'9px 0 18px', fontSize:22, fontWeight:800, letterSpacing:'-0.02em', lineHeight:1.15 }}>
            How is its <span style={{color:'var(--accent-2)'}}>{crit.label.toLowerCase()}</span>?
          </h2>

          <div style={{ display:'flex', gap:18, alignItems:'center' }}>
            <Poster anime={anime} w={104} radius={11} showBadge />
            <div>
              <div style={{ fontSize:11, color:'var(--text-3)', fontWeight:700, letterSpacing:'0.04em', textTransform:'uppercase' }}>Score of</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:6, marginTop:2 }}>
                <span style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:52, lineHeight:1,
                  color:scoreColor(value), textShadow:`0 0 36px ${scoreColor(value).replace(')','/ 0.4)')}` }}>
                  {value.toFixed(1)}
                </span>
                <span style={{ color:'var(--text-4)', fontFamily:'var(--mono)', fontSize:16, fontWeight:600 }}>/10</span>
              </div>
              <div style={{ marginTop:6, fontWeight:800, fontSize:15, color:scoreColor(value) }}>{scoreLabel(value)}</div>
            </div>
          </div>

          <input className="mar-slider" type="range" min={10} max={100} step={1}
            style={{ marginTop:24, '--fill':`${((value-1)/9)*100}%`, '--thumb':scoreColor(value) }}
            value={Math.round(value*10)} onChange={e=>setValue(parseInt(e.target.value)/10)} />
          <div style={{ display:'flex', justifyContent:'space-between', fontFamily:'var(--mono)', fontSize:11, color:'var(--text-4)', marginTop:8 }}>
            <span>1.0</span><span>5.0</span><span>10.0</span>
          </div>

          <div style={{ marginTop:20, padding:'13px 15px', borderRadius:12, background:'var(--surface-2)',
            boxShadow:'0 0 0 1px var(--line) inset', fontSize:13, lineHeight:1.7 }}>
            {nearestAbove
              ? <div style={{color:'var(--text-2)'}}>Just below <b style={{color:'var(--text)'}}>{nearestAbove.a.title}</b>{' '}
                  <span className="mono" style={{color:scoreColor(nearestAbove.v)}}>{nearestAbove.v.toFixed(1)}</span></div>
              : <div style={{color:'var(--text-2)'}}>Your new <b style={{color:'var(--accent-2)'}}>#{1}</b> for {crit.label.toLowerCase()}.</div>}
            {nearestBelow
              ? <div style={{color:'var(--text-2)'}}>Just above <b style={{color:'var(--text)'}}>{nearestBelow.a.title}</b>{' '}
                  <span className="mono" style={{color:scoreColor(nearestBelow.v)}}>{nearestBelow.v.toFixed(1)}</span></div>
              : (nearestAbove && <div style={{color:'var(--text-2)'}}>Your lowest {crit.label.toLowerCase()} so far.</div>)}
          </div>

          <div style={{ marginTop:'auto', paddingTop:22, display:'flex', gap:10 }}>
            {step>0 && <button className="btn btn-ghost" onClick={()=>setStep(step-1)}><Ico name="back" size={16} /> Back</button>}
            {!done
              ? <button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={()=>setStep(step+1)}>
                  Next: {CRITERIA[step+1].label} <Ico name="chevron" size={16} sw={2.2} /></button>
              : <button className="btn btn-primary" style={{flex:1,justifyContent:'center',opacity:saving?0.6:1}}
                  onClick={finish} disabled={saving}>
                  <Ico name="check" size={17} sw={2.4} /> {saving ? 'Saving…' : 'Confirm & add'}</button>}
          </div>
          {saveErr && (
            <div style={{ margin:'10px 0 0', padding:'9px 14px', borderRadius:9,
              background:'rgba(248,113,113,0.1)', border:'1px solid rgba(248,113,113,0.3)',
              fontSize:13, color:'#f87171' }}>{saveErr}</div>
          )}
        </div>

        {/* right: comparison poster grid */}
        <div style={{ display:'flex', flexDirection:'column', minHeight:0 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 30px 12px' }}>
            <div style={{ fontSize:12.5, fontWeight:700, color:'var(--text-2)' }}>
              Compared to <span style={{color:'var(--text)'}}>{pool.length}</span>{' '}
              {useAll ? 'rated titles' : 'shared-genre titles'}
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <span style={{ fontSize:11, color:'var(--text-4)' }}>You can edit any previous score</span>
              {!fewMatches && (
                <button className="btn-quiet" onClick={()=>setBroaden(b=>!b)}
                  style={{ fontSize:12, padding:'5px 10px', boxShadow:'0 0 0 1px var(--line) inset', borderRadius:8 }}>
                  {broaden ? 'Shared genres' : 'All titles'}
                </button>
              )}
            </div>
          </div>
          <div style={{ flex:1, overflowY:'auto', padding:'8px 30px 30px' }}>
            <Bucket dir="higher" label="You rated higher" items={higher} critKey={crit.key} setAnchorScore={setAnchorScore} />
            {same.length>0 && <Bucket dir="higher" label="Same score" items={same} critKey={crit.key} setAnchorScore={setAnchorScore} />}
            <Bucket dir="lower"  label="You rated lower"  items={lower}  critKey={crit.key} setAnchorScore={setAnchorScore} />
            {pool.length===0 && (
              <div style={{ color:'var(--text-3)', padding:'40px 0', textAlign:'center' }}>
                No rated titles to compare against yet &mdash; this becomes your anchor.
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Detail screen ────────────────────────────────────────────────────── */
function CriterionBar({ label, ckey, value, rank, total }) {
  const pct = ((value-1)/9)*100;
  const c   = scoreColor(value);
  return (
    <div style={{ display:'flex', alignItems:'center', gap:16, padding:'13px 0' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, width:140, flexShrink:0 }}>
        <Ico name={ckey} size={18} color="var(--text-2)" />
        <span style={{ fontWeight:700, fontSize:14.5 }}>{label}</span>
      </div>
      <div style={{ flex:1, height:9, borderRadius:999, background:'rgba(255,255,255,0.06)', overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', borderRadius:999,
          background:`linear-gradient(90deg, ${c.replace(')','/ 0.5)')}, ${c})`,
          boxShadow:`0 0 14px -2px ${c.replace(')','/ 0.7)')}`,
          transition:'width .5s cubic-bezier(.2,.7,.2,1)' }} />

}

function Detail({ anime, library, navigate, deleteAnime }) {
  const [confirm, setConfirm] = useState(false);
  const rated = library.filter(a => a.rating);
  const ov    = overall(anime.rating);

  const rankOf = (key) => {
    const val = (a) => key==='overall' ? overall(a.rating) : a.rating[key];
    return [...rated].sort((a,b)=>val(b)-val(a)).findIndex(a=>a.id===anime.id) + 1;
  };
  const overallRank = rankOf('overall');

  return (
    <div style={{ position:'relative', zIndex:1 }}>
      <div style={{ position:'relative', padding:'24px 38px 0' }}>
        <button className="btn-quiet" onClick={()=>navigate({name:'rankings'})}
          style={{ display:'inline-flex', alignItems:'center', gap:6, marginBottom:18 }}>
          <Ico name="back" size={16} /> Rankings
        </button>
        <div style={{ display:'flex', gap:30 }}>
          <div style={{ position:'relative' }}>
            <Poster anime={anime} w={188} radius={14} showBadge />
            {overallRank<=3 && (
              <div style={{ position:'absolute', top:-10, right:-10, width:44, height:44, borderRadius:12,
                background:'var(--accent)', color:'#04121f', display:'grid', placeItems:'center',
                fontFamily:'var(--mono)', fontWeight:800, fontSize:17,
                boxShadow:'0 8px 22px -6px rgba(52,168,240,0.8)' }}>#{overallRank}</div>
            )}
          </div>
          <div style={{ flex:1, minWidth:0, paddingTop:4 }}>
            <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:20 }}>
              <div>
                <h1 style={{ margin:0, fontSize:32, fontWeight:800, letterSpacing:'-0.02em', lineHeight:1.1 }}>{anime.title}</h1>
                <div style={{ display:'flex', alignItems:'center', gap:9, marginTop:9, color:'var(--text-3)', fontSize:13.5 }}>
                  <span className="mono" style={{color:'var(--text-2)'}}>{anime.year}</span>
                  {anime.season && <><span style={{opacity:.4}}>&bull;</span><span>{anime.season}</span></>}
                  <span style={{opacity:.4}}>&bull;</span>
                  <span>{anime.format}</span>
                  {anime.episodes>1 && <><span style={{opacity:.4}}>&bull;</span><span>{anime.episodes} episodes</span></>}
                  {anime.mal_score != null && (() => {
                    const delta = ov - anime.mal_score;
                    const pos = delta >= 0;
                    return <>
                      <span style={{opacity:.4}}>&bull;</span>
                      <span title="MAL community score">MAL <span className="mono" style={{color:'var(--text-2)'}}>{anime.mal_score.toFixed(2)}</span></span>
                      <span className="mono" style={{
                        color: pos ? 'oklch(0.78 0.16 150)' : '#f87171',
                        fontSize:12, fontWeight:700
                      }}>{pos?'+':''}{delta.toFixed(1)} vs MAL</span>
                    </>;
                  })()}
                </div>
                <div style={{ display:'flex', gap:7, flexWrap:'wrap', marginTop:14 }}>
                  {anime.genres.map(g => <GenreChip key={g} small>{g}</GenreChip>)}
                </div>
              </div>
              <div style={{ textAlign:'center', flexShrink:0 }}>
                <ScoreBadge value={ov} size="lg" />
                <div style={{ fontSize:10.5, letterSpacing:'0.07em', textTransform:'uppercase',
                  fontWeight:700, color:'var(--text-3)', marginTop:8 }}>Overall &middot; #{overallRank}</div>
              </div>
            </div>
            {anime.synopsis && <p style={{ margin:'18px 0 0', color:'var(--text-2)', fontSize:14, lineHeight:1.65, maxWidth:620 }}>{anime.synopsis}</p>}
            <div style={{ display:'flex', gap:10, marginTop:22 }}>
              <button className="btn btn-primary" onClick={()=>navigate({name:'rate',animeId:anime.id})}>
                <Ico name="star" size={16} sw={1.9} /> Re-rate
              </button>
              <button className="btn btn-ghost" onClick={()=>setConfirm(true)}>
                <Ico name="trash" size={16} /> Delete
              </button>
            </div>
          </div>
        </div>
      </div>

      <div style={{ padding:'34px 38px 60px' }}>
        <h2 style={{ margin:'0 0 6px', fontSize:14, fontWeight:800, letterSpacing:'0.06em',
          textTransform:'uppercase', color:'var(--text-3)' }}>Score breakdown</h2>
        <div style={{ marginTop:10, padding:'8px 22px', borderRadius:16, background:'var(--surface)', boxShadow:'0 0 0 1px var(--line) inset' }}>
          {CRITERIA.map((c,i) => (
            <div key={c.key} style={{ borderTop: i ? '1px solid var(--line)' : 'none' }}>
              <CriterionBar label={c.label} ckey={c.key} value={anime.rating[c.key]} rank={rankOf(c.key)} total={rated.length} />
            </div>
          ))}
        </div>
        <p style={{ margin:'14px 2px 0', color:'var(--text-4)', fontSize:12 }}>
          Last rated <span className="mono">{anime.rating.updated_at}</span> &middot; Overall is the unweighted average of the five.
        </p>
      </div>

      {confirm && (
        <div onClick={()=>setConfirm(false)} className="fade-in" style={{ position:'fixed', inset:0,
          background:'rgba(4,5,8,0.7)', backdropFilter:'blur(4px)', display:'grid', placeItems:'center', zIndex:50 }}>
          <div onClick={e=>e.stopPropagation()} className="fade-up" style={{ width:400, maxWidth:'90vw',
            background:'var(--surface-2)', borderRadius:18, padding:26,
            boxShadow:'0 0 0 1px var(--line-2) inset, var(--shadow)' }}>
            <h2 style={{ margin:'0 0 8px', fontSize:20, fontWeight:800 }}>Delete this title?</h2>
            <p style={{ margin:'0 0 22px', color:'var(--text-2)', fontSize:14, lineHeight:1.6 }}>
              <b style={{color:'var(--text)'}}>{anime.title}</b> and its scores will be removed from your rankings.
              Other titles keep their anchors.
            </p>
            <div style={{ display:'flex', justifyContent:'flex-end', gap:10 }}>
              <button className="btn btn-ghost" onClick={()=>setConfirm(false)}>Cancel</button>
              <button className="btn" onClick={()=>deleteAnime(anime.id)}
                style={{ background:'oklch(0.62 0.2 25)', color:'#fff' }}>Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Tweaks panel ─────────────────────────────────────────────────────── */
function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits==='object' && keyOrEdits!==null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

const TWEAK_CSS = `
.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:260px;
  background:rgba(250,249,247,.82);color:#29261b;
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border:.5px solid rgba(255,255,255,.6);border-radius:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
  font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
.twk-hd b{font-size:12px;font-weight:600}
.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;font-size:14px;line-height:1}

.twk-row-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

.twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;padding:0}
.twk-toggle[data-on="1"]{background:#34c759}
.twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.twk-toggle[data-on="1"] i{transform:translateX(14px)}
.twk-chips{display:flex;gap:6px;margin-top:6px}

  box-shadow:0 0 0 .5px rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s}
.twk-chip:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.12)}

.twk-check{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
`;

function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const pos = useRef({ x:16, y:16 });

  useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type==='__activate_edit_mode')   setOpen(true);
      if (e?.data?.type==='__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => { setOpen(false); window.parent.postMessage({ type:'__edit_mode_dismissed' },'*'); };

  const onDragStart = (e) => {
    const r = ref.current.getBoundingClientRect();
    const ox = e.clientX, oy = e.clientY;
    const sr = window.innerWidth  - r.right;
    const sb = window.innerHeight - r.bottom;
    const move = (ev) => {
      pos.current = { x: sr-(ev.clientX-ox), y: sb-(ev.clientY-oy) };
      if (ref.current) { ref.current.style.right=pos.current.x+'px'; ref.current.style.bottom=pos.current.y+'px'; }
    };
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  };

  if (!open) return null;
  return (
    <>
      <style>{TWEAK_CSS}</style>
      <div ref={ref} className="twk-panel" style={{ right:pos.current.x, bottom:pos.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>&times;</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row-h">
      <span className="twk-lbl">{label}</span>
      <button className="twk-toggle" data-on={value?'1':'0'}
        role="switch" aria-checked={!!value} onClick={()=>onChange(!value)}><i /></button>
    </div>
  );
}

function isLight(hex) {
  const h = hex.replace('#',''); const x = h.length===3 ? h.replace(/./g,c=>c+c) : h.padEnd(6,'0');
  const n = parseInt(x.slice(0,6),16);
  if (isNaN(n)) return true;
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return r*299+g*587+b*114 > 148000;
}

function TweakColor({ label, value, options, onChange }) {
  return (
    <div>
      <div className="twk-lbl">{label}</div>
      <div className="twk-chips">
        {options.map((o,i) => {
          const on = o===value;
          return (
            <button key={i} className="twk-chip" data-on={on?'1':'0'} style={{background:o}}
              onClick={()=>onChange(o)} aria-label={o}>
              {on && (
                <svg className="twk-check" width="13" height="13" viewBox="0 0 14 14">
                  <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round"
                    strokeLinejoin="round" stroke={isLight(o)?'rgba(0,0,0,.78)':'#fff'} />
                </svg>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ─── App shell ────────────────────────────────────────────────────────── */

const ACCENTS = {
  Azure:   ['#34a8f0','#5cc0ff','#1c6bb0'],
  Violet:  ['#9b7bff','#bca6ff','#5b46b0'],
  Emerald: ['#2fc98e','#62e0ad','#1a7d5a'],
  Rose:    ['#ff6f90','#ff9cb2','#b03a55'],
};

function NavMark() {

    <div style={{ display:'flex', alignItems:'center', gap:11, padding:'4px 8px 22px' }}>
      <div style={{ width:30, height:30, borderRadius:9,
        background:'linear-gradient(145deg, var(--accent-2), var(--accent-deep))',

}

  return (
    <div style={{ padding:'30px 38px 60px', position:'relative', zIndex:1 }}>

        <div style={{ width:200, height:32, borderRadius:8, background:'var(--raised)',

        <div style={{ width:160, height:16, borderRadius:6, background:'var(--raised)',
