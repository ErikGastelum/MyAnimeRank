              </div>
              <div style={{ marginTop:6, fontWeight:800, fontSize:15, color:scoreColor(value) }}>{scoreLabel(value)}</div>
            </div>
          </div>

          <input className="mar-slider" type="range" min={10} max={100} step={1}
            style={{ marginTop:24, '--fill':`${((value-1)/9)*100}%`, '--thumb':scoreColor(value) }}
            value={Math.round(value*10)} onChange={e=>setValue(parseInt(e.target.value)/10)} />
          <div style={{ display:'flex', justifyContent:'space-between', fontFamily:'var(--mono)', fontSize:11, color:'var(--text-4)', marginTop:8 }}>
            <span>1.0</span><span>5.0</span><span>10.0</span>
          </div>

          <div style={{ marginTop:20, padding:'13px 15px', borderRadius:12, background:'var(--surface-2)',
            boxShadow:'0 0 0 1px var(--line) inset', fontSize:13, lineHeight:1.7 }}>
            {nearestAbove
              ? <div style={{color:'var(--text-2)'}}>Just below <b style={{color:'var(--text)'}}>{displayTitle(nearestAbove.a, englishTitles)}</b>{' '}
                  <span className="mono" style={{color:scoreColor(nearestAbove.v)}}>{nearestAbove.v.toFixed(1)}</span></div>
              : <div style={{color:'var(--text-2)'}}>Your new <b style={{color:'var(--accent-2)'}}>#{1}</b> for {crit.label.toLowerCase()}.</div>}
            {nearestBelow
              ? <div style={{color:'var(--text-2)'}}>Just above <b style={{color:'var(--text)'}}>{displayTitle(nearestBelow.a, englishTitles)}</b>{' '}
                  <span className="mono" style={{color:scoreColor(nearestBelow.v)}}>{nearestBelow.v.toFixed(1)}</span></div>
              : (nearestAbove && <div style={{color:'var(--text-2)'}}>Your lowest {crit.label.toLowerCase()} so far.</div>)}
          </div>

          <div style={{ marginTop:'auto', paddingTop:22, display:'flex', gap:10 }}>
            {step>0 && <button className="btn btn-ghost" onClick={()=>setStep(step-1)}><Ico name="back" size={16} /> Back</button>}
            {!done
              ? <button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={()=>setStep(step+1)}>
                  Next: {CRITERIA[step+1].label} <Ico name="chevron" size={16} sw={2.2} /></button>
              : <button className="btn btn-primary" style={{flex:1,justifyContent:'center',opacity:saving?0.6:1}}
                  onClick={finish} disabled={saving}>
                  <Ico name="check" size={17} sw={2.4} /> {saving ? 'Saving…' : 'Confirm & add'}</button>}
          </div>
          {saveErr && (
            <div style={{ margin:'10px 0 0', padding:'9px 14px', borderRadius:9,
              background:'rgba(248,113,113,0.1)', border:'1px solid rgba(248,113,113,0.3)',
              fontSize:13, color:'#f87171' }}>{saveErr}</div>
          )}
        </div>

        {/* right: comparison poster grid */}
        <div style={{ display:'flex', flexDirection:'column', minHeight:0 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 30px 12px' }}>
            <div style={{ fontSize:12.5, fontWeight:700, color:'var(--text-2)' }}>
              Compared to <span style={{color:'var(--text)'}}>{pool.length}</span>{' '}
              {useAll ? 'rated titles' : 'shared-genre titles'}
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <span style={{ fontSize:11, color:'var(--text-4)' }}>You can edit any previous score</span>
              {!fewMatches && (
                <button className="btn-quiet" onClick={()=>setBroaden(b=>!b)}
                  style={{ fontSize:12, padding:'5px 10px', boxShadow:'0 0 0 1px var(--line) inset', borderRadius:8 }}>
                  {broaden ? 'Shared genres' : 'All titles'}
                </button>
              )}
            </div>
          </div>
          <div style={{ flex:1, overflowY:'auto', padding:'8px 30px 30px' }}>
            <Bucket dir="higher" label="You rated higher" items={higher.slice(0, 6)} critKey={crit.key} setAnchorScore={setAnchorScore} englishTitles={englishTitles} />
            {same.length>0 && <Bucket dir="higher" label="Same score" items={same} critKey={crit.key} setAnchorScore={setAnchorScore} englishTitles={englishTitles} />}
            <Bucket dir="lower"  label="You rated lower"  items={lower.slice(0, 6)}  critKey={crit.key} setAnchorScore={setAnchorScore} englishTitles={englishTitles} />
            {pool.length===0 && (
              <div style={{ color:'var(--text-3)', padding:'40px 0', textAlign:'center' }}>
                No rated titles to compare against yet &mdash; this becomes your anchor.
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Compare modal ────────────────────────────────────────────────────── */
function CompareModal({ anime, library, onClose, englishTitles }) {
  const [right, setRight] = useState(null);
  const [q, setQ]         = useState('');
  const rated = library.filter(a => a.rating && a.id !== anime.id);
  const filtered = q ? rated.filter(a => displayTitle(a, true).toLowerCase().includes(q.toLowerCase())) : rated;

  const Panel = ({ a, other }) => {
    const ov = overall(a.rating);
    const ovOther = other ? overall(other.rating) : null;
    return (
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:'flex', gap:14, alignItems:'flex-start', marginBottom:20 }}>
          <Poster anime={a} w={68} radius={10} />
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontWeight:800, fontSize:15, lineHeight:1.25,
              display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' }}>
              {displayTitle(a, englishTitles)}
            </div>
            <div style={{ fontSize:12, color:'var(--text-3)', marginTop:4 }}>{a.year}{a.format ? ` · ${a.format}` : ''}</div>
            <div style={{ marginTop:10, display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ fontFamily:'var(--mono)', fontWeight:800, fontSize:24,
                color: ovOther===null ? 'var(--accent-2)' : ov>ovOther ? 'var(--accent-2)' : ov<ovOther ? 'var(--text-3)' : 'var(--text-2)' }}>
                {ov.toFixed(2)}
              </span>
              {ovOther!==null && ov!==ovOther && (
                <span style={{ fontSize:11, fontWeight:700, color: ov>ovOther?'oklch(0.78 0.16 150)':'#f87171' }}>
                  {ov>ovOther?'▲':'▼'} {Math.abs(ov-ovOther).toFixed(2)}
                </span>
              )}
            </div>
          </div>
        </div>
        {CRITERIA.map(c => {
          const val = a.rating[c.key];
          const otherVal = other ? other.rating[c.key] : null;
          const wins = otherVal !== null && val > otherVal;
          const ties = otherVal !== null && val === otherVal;
          return (
            <div key={c.key} style={{ marginBottom:9 }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
                <span style={{ fontSize:12, fontWeight:600, color:'var(--text-3)' }}>{c.label}</span>
                <span style={{ fontSize:13, fontFamily:'var(--mono)', fontWeight:700,
                  color: wins ? 'var(--accent-2)' : ties ? 'var(--text-2)' : 'var(--text-3)' }}>
                  {val.toFixed(1)}
                </span>
              </div>
              <div style={{ height:5, borderRadius:99, background:'var(--raised)', overflow:'hidden' }}>
                <div style={{ width:`${((val-1)/9)*100}%`, height:'100%', borderRadius:99,
                  background: wins ? 'var(--accent)' : ties ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.12)',
                  transition:'width .4s' }} />
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:100,
      display:'flex', alignItems:'center', justifyContent:'center' }}
      onClick={e => { if (e.target===e.currentTarget) onClose(); }}>
      <div style={{ background:'var(--surface)', borderRadius:18, padding:28, width:680, maxWidth:'96vw',
        maxHeight:'88vh', overflowY:'auto',
        boxShadow:'0 24px 80px rgba(0,0,0,0.5)', border:'1px solid var(--line)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:22 }}>
          <h2 style={{ margin:0, fontSize:19, fontWeight:800 }}>Compare</h2>
          <button className="btn-quiet" onClick={onClose} style={{padding:6}}><Ico name="close" size={18}/></button>
        </div>
        <div style={{ display:'flex', gap:20 }}>
          <Panel a={anime} other={right} />
          <div style={{ width:1, background:'var(--line)', flexShrink:0, alignSelf:'stretch' }} />
          {right ? (
            <Panel a={right} other={anime} />
          ) : (
            <div style={{ flex:1, minWidth:0 }}>
              <p style={{ margin:'0 0 10px', fontSize:13, color:'var(--text-3)', fontWeight:600 }}>
                Pick an anime to compare
              </p>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search library…" autoFocus
                style={{ width:'100%', background:'var(--raised)', border:'none',
                  boxShadow:'0 0 0 1px var(--line) inset', borderRadius:8,
                  padding:'9px 12px', color:'var(--text)', fontSize:13.5,
                  outline:'none', fontFamily:'inherit', marginBottom:8 }} />
              <div style={{ maxHeight:300, overflowY:'auto' }}>
                {filtered.slice(0,40).map(a => (
                  <div key={a.id} onClick={()=>setRight(a)}
                    style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 8px',
                      borderRadius:8, cursor:'pointer', transition:'background .1s' }}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--raised)'}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <Poster anime={a} w={32} radius={5} />
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontWeight:600, fontSize:13, whiteSpace:'nowrap',
                        overflow:'hidden', textOverflow:'ellipsis' }}>
                        {displayTitle(a, englishTitles)}
                      </div>
                      <div style={{ fontSize:11, color:'var(--text-3)' }}>{a.year}{a.format?` · ${a.format}`:''}</div>
                    </div>
                    <span style={{ fontFamily:'var(--mono)', fontSize:13, fontWeight:700, color:'var(--accent)', flexShrink:0 }}>
                      {overall(a.rating).toFixed(1)}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
        {right && (
          <button className="btn-quiet" onClick={()=>{ setRight(null); setQ(''); }}
            style={{ marginTop:16, fontSize:12, color:'var(--text-3)' }}>
            ← Change comparison
          </button>
        )}
      </div>
    </div>
  );
}

/* ─── Edit metadata modal ──────────────────────────────────────────────── */
function EditModal({ anime, onClose, onSave }) {
  const [form, setForm] = useState({
    status:        anime.status        || 'completed',
    rewatch_count: anime.rewatch_count != null ? String(anime.rewatch_count) : '0',
    notes:         anime.notes         || '',
  });
  const [saving, setSaving] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = async () => {
    setSaving(true);
    const payload = {
      status:        form.status || 'completed',
      rewatch_count: parseInt(form.rewatch_count) || 0,
      notes:         form.notes || undefined,
    };
    await fetch(`/anime/${anime.id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    onSave(payload);
    setSaving(false);
    onClose();
  };

  const inputStyle = { width:'100%', background:'var(--raised)', border:'none',
    boxShadow:'0 0 0 1px var(--line) inset', borderRadius:8,
    padding:'9px 11px', color:'var(--text)', fontSize:13.5,
    outline:'none', fontFamily:'inherit' };

  const fieldLabel = (label) => (
    <label style={{ display:'block', fontSize:11.5, fontWeight:700, color:'var(--text-3)',
      letterSpacing:'0.05em', textTransform:'uppercase', marginBottom:5 }}>{label}</label>
  );

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:100,
      display:'flex', alignItems:'center', justifyContent:'center' }}
      onClick={e => { if (e.target===e.currentTarget) onClose(); }}>
      <div style={{ background:'var(--surface)', borderRadius:18, padding:28, width:400,
        boxShadow:'0 24px 80px rgba(0,0,0,0.4)', border:'1px solid var(--line)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:22 }}>
          <h2 style={{ margin:0, fontSize:19, fontWeight:800 }}>Edit</h2>
          <button className="btn-quiet" onClick={onClose} style={{padding:6}}><Ico name="close" size={18}/></button>
        </div>

        <div style={{ marginBottom:14 }}>
          {fieldLabel('Status')}
          <select value={form.status} onChange={e => set('status', e.target.value)}
            style={{ ...inputStyle, cursor:'pointer' }}>
            {[['completed','Completed'],['watching','Watching'],['plan_to_watch','Plan to Watch'],['on_hold','On Hold'],['dropped','Dropped']].map(([v,l]) => (
              <option key={v} value={v}>{l}</option>
            ))}
          </select>
        </div>

        <div style={{ marginBottom:14 }}>
          {fieldLabel('Rewatch count')}
          <input type="number" min="0" value={form.rewatch_count}
            onChange={e => set('rewatch_count', e.target.value)}
            style={inputStyle} />
        </div>

        <div style={{ marginBottom:22 }}>
          {fieldLabel('Notes')}
          <textarea rows={4} value={form.notes} onChange={e => set('notes', e.target.value)}
            style={{ ...inputStyle, resize:'vertical' }} />
        </div>

        <div style={{ display:'flex', gap:10 }}>
          <button className="btn btn-ghost" onClick={onClose} style={{ flex:1 }}>Cancel</button>
          <button className="btn btn-primary" onClick={save} disabled={saving}
            style={{ flex:2, justifyContent:'center', opacity:saving?0.6:1 }}>
            {saving ? 'Saving…' : 'Save'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── Detail screen ────────────────────────────────────────────────────── */
function CriterionBar({ label, ckey, value, rank, total }) {
  const pct = ((value-1)/9)*100;
  const c   = scoreColor(value);
  return (
    <div style={{ display:'flex', alignItems:'center', gap:16, padding:'13px 0' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, width:140, flexShrink:0 }}>
        <Ico name={ckey} size={18} color="var(--text-2)" />
        <span style={{ fontWeight:700, fontSize:14.5 }}>{label}</span>
      </div>
      <div style={{ flex:1, height:9, borderRadius:999, background:'rgba(255,255,255,0.06)', overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', borderRadius:999,
          background:`linear-gradient(90deg, ${c.replace(')','/ 0.5)')}, ${c})`,
          boxShadow:`0 0 14px -2px ${c.replace(')','/ 0.7)')}`,
          transition:'width .5s cubic-bezier(.2,.7,.2,1)' }} />
      </div>
      <span style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:18, color:c, minWidth:46, textAlign:'right' }}>{value.toFixed(1)}</span>
      <span style={{ fontSize:11.5, color:'var(--text-3)', width:78, textAlign:'right' }}>
        #{rank} <span style={{color:'var(--text-4)'}}>of {total}</span>
      </span>
    </div>
  );
}

function Detail({ anime, library, navigate, deleteAnime, updateAnime, englishTitles }) {
  const [confirm, setConfirm]       = useState(false);
  const [showEdit, setShowEdit]     = useState(false);
  const [showCompare, setShowCompare] = useState(false);
  const [rewatching, setRewatching] = useState(false);
  const [notesText, setNotesText]   = useState(anime.notes || '');
  const [notesEdit, setNotesEdit]   = useState(false);
  const [notesSaving, setNotesSaving] = useState(false);
  const rated = library.filter(a => a.rating);
  const ov    = overall(anime.rating);

  const onRewatch = async () => {
    setRewatching(true);
    const newCount = (anime.rewatch_count || 0) + 1;
    await fetch(`/anime/${anime.id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rewatch_count: newCount }),
    });
    updateAnime(anime.id, { rewatch_count: newCount });
    setRewatching(false);
  };

  const saveNotes = async () => {
    setNotesSaving(true);
    await fetch(`/anime/${anime.id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes: notesText }),
    });
    updateAnime(anime.id, { notes: notesText });
    setNotesSaving(false);
    setNotesEdit(false);
  };

  const rankOf = (key) => {
    const val = (a) => key==='overall' ? overall(a.rating) : a.rating[key];
    return [...rated].sort((a,b)=>val(b)-val(a)).findIndex(a=>a.id===anime.id) + 1;
  };
  const overallRank = rankOf('overall');

  return (
    <div style={{ position:'relative', zIndex:1 }}>
      <div style={{ position:'relative', padding:'24px 38px 0' }}>
        <button className="btn-quiet" onClick={()=>navigate({name:'rankings'})}
          style={{ display:'inline-flex', alignItems:'center', gap:6, marginBottom:18 }}>
          <Ico name="back" size={16} /> Rankings
        </button>
        <div style={{ display:'flex', gap:30 }}>
          <div style={{ position:'relative' }}>
            <Poster anime={anime} w={188} radius={14} showBadge />
            {overallRank<=3 && (
              <div style={{ position:'absolute', top:-10, right:-10, width:44, height:44, borderRadius:12,
                background:'var(--accent)', color:'#04121f', display:'grid', placeItems:'center',
                fontFamily:'var(--mono)', fontWeight:800, fontSize:17,
                boxShadow:'0 8px 22px -6px rgba(52,168,240,0.8)' }}>#{overallRank}</div>
            )}
          </div>
          <div style={{ flex:1, minWidth:0, paddingTop:4 }}>
            <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:20 }}>
              <div>
                <h1 style={{ margin:0, fontSize:32, fontWeight:800, letterSpacing:'-0.02em', lineHeight:1.1 }}>{displayTitle(anime, englishTitles)}</h1>
                <div style={{ display:'flex', alignItems:'center', gap:9, marginTop:9, color:'var(--text-3)', fontSize:13.5 }}>
                  <span className="mono" style={{color:'var(--text-2)'}}>{anime.year}</span>
                  {anime.season && <><span style={{opacity:.4}}>&bull;</span><span>{anime.season}</span></>}
                  <span style={{opacity:.4}}>&bull;</span>
                  <span>{anime.format}</span>
                  {anime.episodes>1 && <><span style={{opacity:.4}}>&bull;</span><span>{anime.episodes} episodes</span></>}
                  {anime.mal_score != null && (() => {
                    const delta = ov - anime.mal_score;
                    const pos = delta >= 0;
                    return <>
                      <span style={{opacity:.4}}>&bull;</span>
                      <span title="MAL community score">MAL <span className="mono" style={{color:'var(--text-2)'}}>{anime.mal_score.toFixed(2)}</span></span>
                      <span className="mono" style={{
                        color: pos ? 'oklch(0.78 0.16 150)' : '#f87171',
                        fontSize:12, fontWeight:700
                      }}>{pos?'+':''}{delta.toFixed(1)} vs MAL</span>
                    </>;
                  })()}
                  {(anime.rewatch_count||0) > 0 && <>
                    <span style={{opacity:.4}}>&bull;</span>
                    <span style={{color:'var(--text-2)'}}>Rewatched {anime.rewatch_count}×</span>
                  </>}
                  {(() => {
                    const s = anime.status;
                    if (!s || s === 'completed') return null;
                    const MAP = { watching:['Watching','var(--accent)'], plan_to_watch:['Plan to Watch','var(--text-3)'], on_hold:['On Hold','#f0b429'], dropped:['Dropped','#f87171'] };
                    const [label, color] = MAP[s] || [];
                    if (!label) return null;
                    return <span style={{ fontSize:11, fontWeight:700, letterSpacing:'0.04em',
                      padding:'2px 9px', borderRadius:999,
                      background:`color-mix(in srgb, ${color} 14%, transparent)`,
                      color, border:`1px solid color-mix(in srgb, ${color} 35%, transparent)` }}>{label}</span>;
                  })()}
                </div>
                <div style={{ display:'flex', gap:7, flexWrap:'wrap', marginTop:14 }}>
                  {anime.genres.map(g => <GenreChip key={g} small>{g}</GenreChip>)}
                </div>
              </div>
              <div style={{ textAlign:'center', flexShrink:0 }}>
                <ScoreBadge value={ov} size="lg" />
                <div style={{ fontSize:10.5, letterSpacing:'0.07em', textTransform:'uppercase',
                  fontWeight:700, color:'var(--text-3)', marginTop:8 }}>Overall &middot; #{overallRank}</div>
              </div>
            </div>
            {anime.synopsis && <p style={{ margin:'18px 0 0', color:'var(--text-2)', fontSize:14, lineHeight:1.65, maxWidth:620 }}>{anime.synopsis}</p>}
            <div style={{ display:'flex', gap:10, marginTop:22, flexWrap:'wrap' }}>
              <button className="btn btn-primary" onClick={()=>navigate({name:'rate',animeId:anime.id})}>
                <Ico name="star" size={16} sw={1.9} /> Re-rate
              </button>
              <button className="btn btn-ghost" onClick={onRewatch} disabled={rewatching}>
                <Ico name="check" size={15} /> {rewatching ? '…' : '+ Rewatch'}
              </button>
              <button className="btn btn-ghost" onClick={()=>setShowCompare(true)}>
                <Ico name="compare" size={16} /> Compare
              </button>
              <button className="btn btn-ghost" onClick={()=>setShowEdit(true)}>
                <Ico name="edit" size={16} /> Edit
              </button>
              <button className="btn btn-ghost" onClick={()=>setConfirm(true)}>
                <Ico name="trash" size={16} /> Delete
              </button>
            </div>
          </div>
        </div>
      </div>

      <div style={{ padding:'34px 38px 60px' }}>
        <h2 style={{ margin:'0 0 6px', fontSize:14, fontWeight:800, letterSpacing:'0.06em',
          textTransform:'uppercase', color:'var(--text-3)' }}>Score breakdown</h2>
        <div style={{ marginTop:10, padding:'8px 22px', borderRadius:16, background:'var(--surface)', boxShadow:'0 0 0 1px var(--line) inset' }}>
          {CRITERIA.map((c,i) => (
            <div key={c.key} style={{ borderTop: i ? '1px solid var(--line)' : 'none' }}>
              <CriterionBar label={c.label} ckey={c.key} value={anime.rating[c.key]} rank={rankOf(c.key)} total={rated.length} />
            </div>
          ))}
        </div>
        <p style={{ margin:'14px 2px 0', color:'var(--text-4)', fontSize:12 }}>
          Last rated <span className="mono">{anime.rating.updated_at}</span> &middot; Overall is the unweighted average of the five.
        </p>

        <div style={{ marginTop:32 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
            <h2 style={{ margin:0, fontSize:14, fontWeight:800, letterSpacing:'0.06em',
              textTransform:'uppercase', color:'var(--text-3)' }}>Notes</h2>
            {!notesEdit && (
              <button className="btn-quiet" onClick={()=>setNotesEdit(true)}
                style={{ padding:'3px 8px', fontSize:12, display:'flex', alignItems:'center', gap:4 }}>
                <Ico name="edit" size={12} /> {notesText ? 'Edit' : 'Add'}
              </button>
            )}
          </div>
          {notesEdit ? (
            <div>
              <textarea value={notesText} onChange={e=>setNotesText(e.target.value)}
                rows={4} autoFocus
                style={{ width:'100%', background:'var(--surface)', border:'none',
                  boxShadow:'0 0 0 1px var(--line-2) inset', borderRadius:10,
                  padding:'12px 14px', color:'var(--text)', fontSize:14, lineHeight:1.6,
                  outline:'none', fontFamily:'inherit', resize:'vertical', display:'block' }} />
              <div style={{ display:'flex', gap:8, marginTop:8 }}>

  );

const _TWEAKS_KEY = 'mar-tweaks';

function useTweaks(defaults) {
  const [values, setValues] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(_TWEAKS_KEY) || '{}');
      return { ...defaults, ...saved };
    } catch { return defaults; }
  });
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits==='object' && keyOrEdits!==null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => {
      const next = { ...prev, ...edits };
      try { localStorage.setItem(_TWEAKS_KEY, JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const pos = useRef({ x:16, y:16 });

  useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type==='__activate_edit_mode')   setOpen(true);
      if (e?.data?.type==='__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => { setOpen(false); window.parent.postMessage({ type:'__edit_mode_dismissed' },'*'); };

  const onDragStart = (e) => {
    const r = ref.current.getBoundingClientRect();
    const ox = e.clientX, oy = e.clientY;
    const sr = window.innerWidth  - r.right;
    const sb = window.innerHeight - r.bottom;
    const move = (ev) => {
      pos.current = { x: sr-(ev.clientX-ox), y: sb-(ev.clientY-oy) };
      if (ref.current) { ref.current.style.right=pos.current.x+'px'; ref.current.style.bottom=pos.current.y+'px'; }
    };
    const up = () => { window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  };

  if (!open) return null;
  return (
    <>
      <style>{TWEAK_CSS}</style>
      <div ref={ref} className="twk-panel" style={{ right:pos.current.x, bottom:pos.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>&times;</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

function TweakToggle({ label, value, onChange }) {

      <button className="twk-toggle" data-on={value?'1':'0'}
        role="switch" aria-checked={!!value} onClick={()=>onChange(!value)}><i /></button>
    </div>
  );
}

function isLight(hex) {
  const h = hex.replace('#',''); const x = h.length===3 ? h.replace(/./g,c=>c+c) : h.padEnd(6,'0');
  const n = parseInt(x.slice(0,6),16);
  if (isNaN(n)) return true;
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return r*299+g*587+b*114 > 148000;
}

function TweakColor({ label, value, options, onChange }) {
  return (
    <div>
      <div className="twk-lbl">{label}</div>
      <div className="twk-chips">
        {options.map((o,i) => {
          const on = o===value;
          return (
            <button key={i} className="twk-chip" data-on={on?'1':'0'} style={{background:o}}
              onClick={()=>onChange(o)} aria-label={o}>
              {on && (
                <svg className="twk-check" width="13" height="13" viewBox="0 0 14 14">
                  <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round"
                    strokeLinejoin="round" stroke={isLight(o)?'rgba(0,0,0,.78)':'#fff'} />
                </svg>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [library, setLibrary]     = useState([]);
  const [loadErr, setLoadErr]     = useState(null);
  const [appLoading, setAppLoading] = useState(true);
  const [view, setView]           = useState({ name:'rankings' });
  const [t, setTweak]             = useTweaks({ accent:'Azure', ambient:true, englishTitles:true, rankView:'grid' });

  useEffect(() => {
    fetch('/rankings')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { setLibrary((d.results || []).map(normaliseRanked)); setAppLoading(false); })
      .catch(() => { setLoadErr('Could not load rankings — is the server running?'); setAppLoading(false); });
  }, []);

  useEffect(() => {
    const [a,a2,ad] = ACCENTS[t.accent] || ACCENTS.Azure;
    const s = document.documentElement.style;
    s.setProperty('--accent', a); s.setProperty('--accent-2', a2); s.setProperty('--accent-deep', ad);
  }, [t.accent]);

  const navigate = (v) => { setView(v); document.querySelector('.mar-content')?.scrollTo(0,0); };
  const importAnime = (item) => navigate({ name:'rate', draft:{ ...item, id:null, rating:null } });

  const saveRating = async (anime, scores) => {
    const rating = { ...scores, overall: overall(scores), updated_at: new Date().toISOString().slice(0,10) };
    if (anime.id != null) {
      await fetch(`/anime/${anime.id}/rating`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(scores),
      });
      setLibrary(lib => lib.map(a => a.id===anime.id ? { ...a, rating } : a));
      navigate({ name:'detail', animeId: anime.id });
    } else {
      const { id } = await fetch('/anime', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          api_id: anime.api_id, title: anime.title, title_ro: anime.title_ro, cover_url: anime.cover_url,
          genres: anime.genres, year: anime.year, season: anime.season,
          episodes: anime.episodes, format: anime.format, synopsis: anime.synopsis,
        }),
      }).then(r => r.json());
      await fetch(`/anime/${id}/rating`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(scores),
      });
      setLibrary(lib => [...lib, { ...anime, id, rating }]);
      navigate({ name:'detail', animeId: id });
    }
  };

  const deleteAnime = async (id) => {
    await fetch(`/anime/${id}`, { method: 'DELETE' });
    setLibrary(lib => lib.filter(a => a.id !== id));
    navigate({ name:'rankings' });
  };

  const updateAnime = async (id, fields) => {
    setLibrary(lib => lib.map(a => {
      if (a.id !== id) return a;
      const genres = Array.isArray(fields.genres) ? fields.genres : a.genres;
      return { ...a, ...fields, genres };
    }));
  };

  const [showDeleteLib, setShowDeleteLib] = useState(false);

  const exportBackup = async () => {
    const data = await fetch('/backup').then(r => r.json());
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `myanimrank-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const restoreInput = React.useRef(null);
  const restoreBackup = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const res = await fetch('/restore', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(res.status);
      const d = await fetch('/rankings').then(r => r.json());
      setLibrary((d.results || []).map(normaliseRanked));
    } catch (err) {
      alert(`Restore failed: ${err.message}`);
    }
    e.target.value = '';
  };

    fetch(`/anime/${id}/rating`, { method:'PUT',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(scores) });
    setLibrary(lib => lib.map(a => {
      if (a.id !== id || !a.rating) return a;
      return { ...a, rating: { ...newRating, overall: overall(newRating) } };

              <button onClick={exportBackup} title="Export backup JSON"
                style={{ flex:1, padding:'7px 10px', borderRadius:9, border:'none', cursor:'pointer',
                  background:'var(--raised)', color:'var(--text-3)', fontWeight:600, fontSize:11.5,
                  fontFamily:'inherit', boxShadow:'0 0 0 1px var(--line) inset',
                  transition:'all .14s ease', display:'flex', alignItems:'center', justifyContent:'center', gap:5 }}
                onMouseEnter={e => { e.currentTarget.style.color='var(--text)'; }}
                onMouseLeave={e => { e.currentTarget.style.color='var(--text-3)'; }}>
                <Ico name="upload" size={12} /> Export
              </button>
              <button onClick={() => restoreInput.current?.click()} title="Restore from backup JSON"
                style={{ flex:1, padding:'7px 10px', borderRadius:9, border:'none', cursor:'pointer',
                  background:'var(--raised)', color:'var(--text-3)', fontWeight:600, fontSize:11.5,
                  fontFamily:'inherit', boxShadow:'0 0 0 1px var(--line) inset',
                  transition:'all .14s ease', display:'flex', alignItems:'center', justifyContent:'center', gap:5 }}
                onMouseEnter={e => { e.currentTarget.style.color='var(--text)'; }}
                onMouseLeave={e => { e.currentTarget.style.color='var(--text-3)'; }}>
                <Ico name="add" size={12} sw={2.4} /> Restore
              </button>
              <input ref={restoreInput} type="file" accept=".json" style={{ display:'none' }} onChange={restoreBackup} />
            </div>
            <button onClick={() => setShowDeleteLib(true)}
              style={{ width:'100%', padding:'8px 12px', borderRadius:9, border:'none', cursor:'pointer',
                background:'rgba(248,113,113,0.07)', color:'var(--text-4)', fontWeight:600, fontSize:12,
                fontFamily:'inherit', boxShadow:'0 0 0 1px rgba(248,113,113,0.18) inset',
                transition:'all .14s ease', textAlign:'center' }}
              onMouseEnter={e => { e.target.style.background='rgba(248,113,113,0.14)'; e.target.style.color='#f87171'; }}
              onMouseLeave={e => { e.target.style.background='rgba(248,113,113,0.07)'; e.target.style.color='var(--text-4)'; }}>
              Delete library
            </button>
          </>)}
        </div>
      </nav>
      <main className="mar-content">
        {loadErr && (
          <div style={{ margin:'32px 38px 0', padding:'14px 18px', borderRadius:12,
            background:'rgba(248,113,113,0.1)', border:'1px solid rgba(248,113,113,0.3)',
            fontSize:14, color:'#f87171', display:'flex', alignItems:'center', gap:10 }}>
            <Ico name="close" size={16} color="#f87171" />
            {loadErr}
          </div>
        )}
        {appLoading && view.name==='rankings' ? <RankingsSkeleton /> : screen}
      </main>
      {showDeleteLib && (
        <DeleteLibraryModal count={ratedCount} onClose={() => setShowDeleteLib(false)} onConfirm={deleteLibrary} />
      )}
      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="Accent" value={(ACCENTS[t.accent]||ACCENTS.Azure)[0]}
          options={Object.values(ACCENTS).map(a=>a[0])}
          onChange={(hex) => setTweak('accent', Object.keys(ACCENTS).find(k=>ACCENTS[k][0]===hex)||'Azure')} />
        <TweakToggle label="Ambient glow" value={t.ambient} onChange={v=>setTweak('ambient',v)} />
        <TweakSection label="Titles" />
        <TweakToggle label="English names" value={t.englishTitles} onChange={v=>setTweak('englishTitles',v)} />
      </TweaksPanel>
    </div>
  );
}

function Root() {
  return <App />;
}

ReactDOM.createRoot(document.getElementById('scaler')).render(<Root />);

</script>
<script>
(function () {
  window.addEventListener('pywebviewready', function () {
    const tb = document.getElementById('titlebar');
    let dragging = false;
    let maximized = false;
    let dragGen = 0;
    let startScreenX = 0, startScreenY = 0;
    let startWinX = 0, startWinY = 0;

    window._toggleMaximize = function () {
      maximized = !maximized;
      dragging = false;
      dragGen++;
      if (maximized) {
        window.pywebview.api.maximize_window();
      } else {
        window.pywebview.api.restore_window();
      }
    };

    tb.addEventListener('mousedown', async function (e) {
      if (maximized || e.button !== 0 || e.target.closest('.tb-controls')) return;
      const gen = ++dragGen;
      dragging = true;
      startScreenX = e.screenX;
      startScreenY = e.screenY;
      const pos = await window.pywebview.api.get_position();
      if (gen !== dragGen) return;
      startWinX = pos.x;
      startWinY = pos.y;
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      if (!(e.buttons & 1)) { dragging = false; return; }
      window.pywebview.api.move_to(
        startWinX + (e.screenX - startScreenX),
        startWinY + (e.screenY - startScreenY)
      );
    });

    document.addEventListener('mouseup', function () {
      dragging = false;
    });
  });
})();
</script>
</body>
