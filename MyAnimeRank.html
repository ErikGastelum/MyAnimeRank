<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyAnimeRank</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,300..900;1,300..900&family=Overpass+Mono:wght@400;600;700&display=swap');

:root {
  --bg:        #0c0d10;
  --surface:   #131419;
  --surface-2: #181a21;
  --raised:    #1e212a;
  --hover:     #232631;
  --line:      rgba(255,255,255,0.075);
  --line-2:    rgba(255,255,255,0.12);
  --text:      #eef1f6;
  --text-2:    #aab2c0;
  --text-3:    #6b7282;
  --text-4:    #474d5a;
  --accent:      #34a8f0;
  --accent-2:    #5cc0ff;
  --accent-deep: #1c6bb0;
  --radius:    14px;
  --radius-sm: 9px;
  --shadow:    0 18px 50px -12px rgba(0,0,0,0.7);
  --sans: 'Overpass', system-ui, sans-serif;
  --mono: 'Overpass Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #060709; -webkit-app-region: no-drag; }

#stage {
  position: fixed; inset: 0;
  background: radial-gradient(1100px 700px at 50% -10%, #11141b, #060709 70%);
  overflow: hidden;
  display: flex; flex-direction: column;
}
#scaler { width: 100%; flex: 1; min-height: 0; }

#titlebar {
  height: 32px; background: #0c0d10; flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.075);
  display: flex; align-items: center;
  position: relative; z-index: 9999;
  cursor: default; user-select: none;
}
.tb-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-family: 'Overpass', system-ui, sans-serif; font-size: 12px;
  font-weight: 700; letter-spacing: -0.01em;
  color: rgba(255,255,255,0.25); pointer-events: none;
  -webkit-app-region: no-drag; user-select: none;
}
.tb-controls {
  margin-left: auto; display: flex; align-items: center;
  gap: 2px; padding-right: 8px;
  -webkit-app-region: no-drag; app-region: no-drag;
}
.tb-btn {
  width: 28px; height: 28px; border-radius: 6px; border: none;
  background: transparent; color: rgba(255,255,255,0.3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s;
}
.tb-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); }
.tb-close:hover { background: rgba(248,113,113,0.18) !important; color: #f87171 !important; }

.mar-root {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100%;
  display: flex;
  position: relative;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.mar-root::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(900px 480px at 14% -8%, rgba(52,168,240,0.10), transparent 60%),
    radial-gradient(700px 520px at 100% 120%, rgba(52,168,240,0.06), transparent 55%);
  pointer-events: none;
  z-index: 0;
}
.mar-root.no-ambient::before { opacity: 0; }

.mar-nav {
  width: 232px; flex-shrink: 0; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 22px 16px;
  position: relative; z-index: 2;
  background: linear-gradient(180deg, rgba(255,255,255,0.018), transparent 40%);
}
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px;
  border-radius: 10px; font-size: 14px; font-weight: 600;
  color: var(--text-3); transition: all .14s ease; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--raised); color: var(--text-2); }
.nav-item.active {
  background: var(--raised); color: var(--text);
  box-shadow: 0 0 0 1px var(--line) inset;
}
.nav-item.active .nav-dot { opacity: 1; }
.nav-dot {
  width: 3px; height: 16px; border-radius: 2px;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
  opacity: 0; margin-left: auto;
}
.mar-content { flex: 1; min-width: 0; overflow-y: auto; position: relative; }

.mar-slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 10px;
  border-radius: 999px; outline: none; cursor: pointer;
  background:
    linear-gradient(90deg, var(--accent) var(--fill), transparent var(--fill)),
    linear-gradient(90deg, oklch(0.6 0.18 18 / .35), oklch(0.7 0.16 60 / .3) 45%, oklch(0.74 0.16 150 / .4));
}
.mar-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px var(--thumb), 0 0 22px var(--thumb), 0 4px 10px rgba(0,0,0,0.5);
  cursor: grab; transition: transform .1s ease;
}
.mar-slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.12); }
.mar-slider::-moz-range-thumb {
  width: 26px; height: 26px; border: none; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px var(--thumb), 0 0 22px var(--thumb); cursor: grab;
}
.mar-slider-sm { height: 6px; }
.mar-slider-sm::-webkit-slider-thumb { width: 16px; height: 16px; box-shadow: 0 0 0 3px var(--thumb), 0 0 12px var(--thumb); }
.mar-slider-sm::-moz-range-thumb  { width: 16px; height: 16px; box-shadow: 0 0 0 3px var(--thumb); }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 8px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #353a48; }
::selection { background: rgba(52,168,240,0.32); color: #fff; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input  { font-family: inherit; }
.mono  { font-family: var(--mono); }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 13.5px; letter-spacing: 0.01em;
  padding: 10px 16px; border-radius: 10px;
  transition: all .16s ease; white-space: nowrap;
}
.btn-primary {
  background: var(--accent); color: #04121f;
  box-shadow: 0 0 0 1px rgba(92,192,255,0.4) inset, 0 6px 20px -6px rgba(52,168,240,0.7);
}
.btn-primary:hover {
  background: var(--accent-2);
  box-shadow: 0 0 0 1px rgba(92,192,255,0.6) inset, 0 8px 26px -6px rgba(52,168,240,0.9);
  transform: translateY(-1px);
}
.btn-ghost { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line) inset; }
.btn-ghost:hover { background: var(--hover); box-shadow: 0 0 0 1px var(--line-2) inset; }
.btn-quiet { color: var(--text-2); padding: 9px 12px; border-radius: 9px; font-weight: 600; }
.btn-quiet:hover { background: var(--raised); color: var(--text); }

@keyframes mar-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes mar-fade    { from { opacity: 0; } to { opacity: 1; } }
@keyframes newpop      { 0% { transform: scale(0.97); } 60% { transform: scale(1.015); } 100% { transform: scale(1); } }
@keyframes mar-pulse   { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.fade-up { animation: mar-fade-up .4s cubic-bezier(.2,.7,.2,1) both; }
.fade-in { animation: mar-fade .3s ease both; }
.mar-newrow { animation: newpop .22s ease; }
</style>
</head>
<body>
<div id="stage">
<div id="titlebar">
  <span class="tb-title">MyAnimeRank</span>
  <div class="tb-controls">
    <button class="tb-btn" onclick="window.pywebview?.api?.minimize()" title="Minimize">
      <svg width="10" height="2" viewBox="0 0 10 2"><rect width="10" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="tb-btn" onclick="window._toggleMaximize?.()" title="Maximize">
      <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
    </button>
    <button class="tb-btn tb-close" onclick="window.pywebview?.api?.close()" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<div id="scaler"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ─── Data layer ───────────────────────────────────────────────────────── */
const CRITERIA = [
  { key:'story',      label:'Story'      },
  { key:'characters', label:'Characters' },
  { key:'animation',  label:'Animation'  },
  { key:'audio',      label:'Audio'      },
  { key:'enjoyment',  label:'Enjoyment'  },
];

const scoreColor = (v) => {
  if (v == null) return 'var(--text-4)';
  const t = Math.max(0, Math.min(1, (v-1)/9));
  return `oklch(0.74 0.155 ${(18 + t*132).toFixed(0)})`;
};
const scoreColorSoft = (v) => {
  if (v == null) return 'rgba(255,255,255,0.04)';
  const t = Math.max(0, Math.min(1, (v-1)/9));
  return `oklch(0.74 0.155 ${(18 + t*132).toFixed(0)} / 0.16)`;
};
const overall = (r) => {
  if (!r) return null;
  const s = CRITERIA.reduce((a,c) => a + r[c.key], 0) / CRITERIA.length;
  return Math.round(s*10)/10;
};
const titleHue = (title) => {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h*31 + title.charCodeAt(i)) % 360;
  return h;
};
const fmt = (v) => v == null ? '—' : v.toFixed(1);
const scoreLabel = (v) => {
  if (v == null) return '';
  if (v >= 9.3) return 'Masterpiece';
  if (v >= 8.0) return 'Great';
  if (v >= 7.0) return 'Good';
  if (v >= 6.0) return 'Fine';
  if (v >= 5.0) return 'Average';
  if (v >= 4.0) return 'Mediocre';
  if (v >= 3.0) return 'Bad';
  return 'Awful';
};

const normaliseRanked = (row) => {
  const { story, characters, animation, audio, enjoyment, overall: ov, updated_at, ...rest } = row;
  return { ...rest, rating: { story, characters, animation, audio, enjoyment, overall: ov, updated_at } };
};


/* ─── Shared UI atoms ──────────────────────────────────────────────────── */
function Poster({ anime, w=64, radius=9, showBadge=false, fluid=false, style={} }) {
  const [imgErr, setImgErr] = useState(false);
  const h = titleHue(anime.title), h2 = (h+38)%360;
  const initials = anime.title.replace(/[^A-Za-z0-9 ]/g,'').split(' ')
    .filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();
  const showImg = anime.cover_url && !imgErr;
  const outerStyle = fluid
    ? { position:'relative', width:'100%', paddingBottom:'142%', height:0, borderRadius:radius, overflow:'hidden',
        background:`linear-gradient(150deg, oklch(0.42 0.13 ${h}), oklch(0.22 0.09 ${h2}) 78%)`,
        boxShadow:'0 6px 18px -8px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06) inset',
        ...style }
    : { position:'relative', width:w, height:w*1.42, borderRadius:radius, overflow:'hidden', flexShrink:0,
        background:`linear-gradient(150deg, oklch(0.42 0.13 ${h}), oklch(0.22 0.09 ${h2}) 78%)`,
        boxShadow:'0 6px 18px -8px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06) inset',
        ...style };
  return (
    <div style={outerStyle}>
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        fontFamily:'var(--mono)', fontWeight:700, fontSize: fluid ? '14%' : w*0.62,
        color:`oklch(0.9 0.12 ${h})`, opacity:0.14, letterSpacing:'-0.04em' }}>{initials}</div>
      <div style={{ position:'absolute', inset:0,
        background:'repeating-linear-gradient(125deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 9px)' }} />
      <div style={{ position:'absolute', inset:0,
        background:`radial-gradient(120% 70% at 22% 8%, oklch(0.7 0.16 ${h} / 0.35), transparent 55%)` }} />
      {showImg && (
        <img src={anime.cover_url} alt="" onError={() => setImgErr(true)}
          style={{ position:'absolute', inset:0, width:'100%', height:'100%',
            objectFit:'cover', objectPosition:'top center' }} />
      )}
      {showBadge && (
        <div style={{ position:'absolute', top:7, right:7, fontFamily:'var(--mono)', fontSize:9, fontWeight:700,
          padding:'2px 6px', borderRadius:5, background:'rgba(0,0,0,0.55)', color:'#dfe6ef',
          letterSpacing:'0.04em', backdropFilter:'blur(2px)' }}>{anime.format}</div>
      )}
    </div>
  );
}

function ScoreBadge({ value, size='md' }) {
  const c = scoreColor(value);
  const px = size==='lg' ? 56 : size==='sm' ? 34 : 44;
  const fs = size==='lg' ? 23 : size==='sm' ? 14 : 18;
  return (
    <div style={{
      width:px, height:px, borderRadius: size==='lg' ? 14 : 10,
      display:'grid', placeItems:'center',
      fontFamily:'var(--mono)', fontWeight:700, fontSize:fs, color:c,
      background:scoreColorSoft(value),
      boxShadow:`0 0 0 1px ${c.replace(')','/ 0.4)').replace('oklch(','oklch(')} inset`,
      letterSpacing:'-0.02em',
    }}>{value==null ? '—' : value.toFixed(1)}</div>
  );
}

function GenreChip({ children, active, onClick, small }) {
  return (
    <button onClick={onClick} style={{
      fontSize: small ? 11 : 12, fontWeight:600, letterSpacing:'0.01em',
      padding: small ? '3px 9px' : '6px 12px', borderRadius:999,
      color: active ? '#04121f' : 'var(--text-2)',
      background: active ? 'var(--accent)' : 'var(--raised)',
      boxShadow: active ? 'none' : '0 0 0 1px var(--line) inset',
      transition:'all .14s ease', whiteSpace:'nowrap',
      cursor: onClick ? 'pointer' : 'default',
    }}>{children}</button>
  );
}

function FormatTab({ active, onClick, children, count }) {
  return (
    <button onClick={onClick} style={{
      background: 'none', border: 'none', cursor: 'pointer',
      padding: '8px 16px', borderRadius: 9, whiteSpace: 'nowrap',
      fontWeight: active ? 700 : 500, fontSize: 14,
      color: active ? 'var(--accent)' : 'var(--text-2)',
      background: active ? 'rgba(52,168,240,0.12)' : 'transparent',
      display: 'flex', gap: 6, alignItems: 'center',
      transition: 'background 0.15s, color 0.15s',
    }}>
      {children}
      {count != null && (
        <span style={{ fontSize: 11, fontWeight: 600,
          color: active ? 'var(--accent)' : 'var(--text-3)',
          background: 'var(--surface-2)', borderRadius: 99,
          padding: '1px 7px', lineHeight: '18px' }}>{count}</span>
      )}
    </button>
  );
}

const ICON_PATHS = {
  story:      'M5 4.5h9a2 2 0 0 1 2 2V19l-3.5-2-3 2V6.5a2 2 0 0 0-2-2H5z M5 4.5C4 4.5 3.5 5 3.5 6v12.5c0 1 .5 1.5 1.5 1.5',
  characters: 'M8.5 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3.5 19c0-2.8 2.2-5 5-5s5 2.2 5 5 M15.5 13.2A3 3 0 1 0 14 7.4 M16 14c2.2.3 4 2.2 4 4.6',
  animation:  'M4 4.5h16v15H4z M4 9h16 M4 15h16 M8 4.5v15 M16 4.5v15',
  audio:      'M3 12h2l2-6 3 14 3-11 2 5 2-2h4',
  enjoyment:  'M12 20s-7-4.4-9.2-9C1.3 8 2.6 4.8 6 4.8c2 0 3.2 1.4 4 2.6.8-1.2 2-2.6 4-2.6 3.4 0 4.7 3.2 3.2 6.2C19 15.6 12 20 12 20z',
  rank:       'M5 20V9 M12 20V4 M19 20v-7',
  add:        'M12 5v14 M5 12h14',
  search:     'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4',
  star:       'M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.9z',
  back:       'M15 5l-7 7 7 7',
  trash:      'M4 7h16 M9 7V5h6v2 M6 7l1 13h10l1-13',
  close:      'M6 6l12 12 M18 6L6 18',
  check:      'M5 12l5 5 9-11',
  chevron:    'M9 6l6 6-6 6',
  insights:   'M4 20V14 M9 20V8 M14 20V11 M19 20V4',
  upload:     'M12 19V5 M5 12l7-7 7 7 M3 19h18',
  viewList:   'M3 6h18 M3 12h18 M3 18h18',
  viewCard:   'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',
  viewGrid:   'M3 3h4v4H3z M10 3h4v4h-4z M17 3h4v4h-4z M3 10h4v4H3z M10 10h4v4h-4z M17 10h4v4h-4z M3 17h4v4H3z M10 17h4v4h-4z M17 17h4v4h-4z',
  edit:       'M4 20h4L18.5 9.5l-4-4L4 20z M14.5 5.5l4 4',
  seasonal:   'M12 3v2 M12 19v2 M3 12H1 M23 12h-2 M5.6 5.6l1.4 1.4 M17 17l1.4 1.4 M5.6 18.4l1.4-1.4 M17 7l1.4-1.4 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
  compare:    'M3 6h8 M3 10h8 M3 14h8 M13 6h8 M13 10h8 M13 14h8',
  discover:   'M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z M12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
};

function Ico({ name, size=18, sw=1.7, color='currentColor', style={} }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
      style={{ flexShrink:0, ...style }}>
      {ICON_PATHS[name].trim().split(/\s+M/).map((seg,i) => (
        <path key={i} d={i===0 ? seg : 'M'+seg} />
      ))}
    </svg>
  );
}

/* ─── Rankings screen ──────────────────────────────────────────────────── */
function MiniScore({ label, value, active }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, minWidth:52 }}>
      <span style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:14.5,
        color: active ? scoreColor(value) : 'var(--text)', opacity: active ? 1 : 0.92 }}>{fmt(value)}</span>
      <span style={{ fontSize:9.5, letterSpacing:'0.06em', textTransform:'uppercase', fontWeight:700,
        color: active ? 'var(--accent-2)' : 'var(--text-3)' }}>{label}</span>
    </div>
  );
}

function RankCard({ anime, rank, onOpen, sortKey, englishTitles, variant='grid' }) {
  const [hover, setHover] = useState(false);
  const ov = overall(anime.rating);
  const top = rank <= 3;
  const base = {
    cursor:'pointer', transition:'background .14s ease, box-shadow .14s ease, transform .14s ease',
    background: hover ? 'var(--hover)' : 'var(--surface)',
    boxShadow: hover ? '0 0 0 1px var(--line-2) inset, 0 14px 36px -14px rgba(0,0,0,0.85)' : '0 0 0 1px var(--line) inset',
    transform: hover ? 'translateY(-2px)' : 'none',
  };

  if (variant === 'list') {
    return (
      <div onClick={onOpen} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
        className="fade-up"
        style={{ ...base, display:'flex', alignItems:'center', gap:16,
          padding:'12px 16px 12px 14px', borderRadius:13 }}>
        <div style={{ width:32, textAlign:'center', fontFamily:'var(--mono)', fontWeight:700,
          fontSize: top?20:16, color: top?'var(--accent-2)':'var(--text-3)',
          textShadow: top?'0 0 14px rgba(52,168,240,0.5)':'none', flexShrink:0 }}>{rank}</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:15, letterSpacing:'-0.01em',
            whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
            {displayTitle(anime, englishTitles)}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:4, color:'var(--text-3)', fontSize:12 }}>
            <span className="mono">{anime.year}</span>
            {anime.format && <><span style={{opacity:.4}}>&bull;</span><span>{anime.format}</span></>}
            {anime.genres.length > 0 && <><span style={{opacity:.4}}>&bull;</span>
              <span style={{color:'var(--text-2)'}}>{anime.genres.slice(0,3).join(' · ')}</span></>}
          </div>
        </div>
        <div style={{ display:'flex', gap:3 }}>
          {CRITERIA.map(c => <MiniScore key={c.key} label={c.label.slice(0,4)} value={anime.rating[c.key]} active={sortKey===c.key} />)}
        </div>
        <div style={{ width:1, height:38, background:'var(--line)', margin:'0 2px', flexShrink:0 }} />
        <ScoreBadge value={ov} />
      </div>
    );
  }

  return (
    <div onClick={onOpen} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      className="fade-up"
      style={{ ...base, borderRadius:16, overflow:'hidden' }}>
      <div style={{ position:'relative' }}>
        <Poster anime={anime} fluid radius={0} showBadge />
        <div style={{
          position:'absolute', top:10, left:10,
          fontFamily:'var(--mono)', fontWeight:700,
          fontSize: top ? 20 : 15,
          color: top ? 'var(--accent-2)' : 'rgba(255,255,255,0.75)',
          textShadow: top ? '0 0 14px rgba(52,168,240,0.7), 0 1px 4px rgba(0,0,0,0.8)' : '0 1px 4px rgba(0,0,0,0.8)',
          lineHeight:1,
        }}>#{rank}</div>
      </div>
      {variant === 'card'
        ? (
          <div style={{ padding:'12px 13px 13px' }}>
            <div style={{ fontWeight:700, fontSize:14, letterSpacing:'-0.01em', lineHeight:1.25,
              display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden',
              marginBottom:5 }}>{displayTitle(anime, englishTitles)}</div>
            <div style={{ fontSize:11.5, color:'var(--text-3)', marginBottom:10,
              whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              <span className="mono">{anime.year}</span>
              {anime.format && <><span style={{opacity:.4}}> · </span><span>{anime.format}</span></>}
              {anime.genres.length > 0 && <><span style={{opacity:.4}}> · </span>
                <span style={{color:'var(--text-2)'}}>{anime.genres.slice(0,2).join(', ')}</span></>}
            </div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:4 }}>
              <div style={{ display:'flex', gap:0 }}>
                {CRITERIA.map(c => <MiniScore key={c.key} label={c.label.slice(0,3)} value={anime.rating[c.key]} active={sortKey===c.key} />)}
              </div>
              <ScoreBadge value={ov} size='sm' />
            </div>
          </div>
        ) : (
          <div style={{ padding:'8px 10px 10px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:6 }}>
            <div style={{ fontWeight:700, fontSize:12, letterSpacing:'-0.01em', lineHeight:1.2,
              whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', flex:1, minWidth:0
            }}>{displayTitle(anime, englishTitles)}</div>
            <ScoreBadge value={ov} size='sm' />
          </div>
        )}
    </div>
  );
}

function DropdownSelect({ label, value, onChange, options, render }) {
  return (
    <label style={{ display:'flex', alignItems:'center', gap:8, fontSize:12.5, color:'var(--text-3)', fontWeight:600 }}>
      {label}
      <div style={{ position:'relative' }}>
        <select value={value} onChange={e=>onChange(e.target.value)} style={{
          appearance:'none', background:'var(--raised)', color:'var(--text)',
          border:'none', boxShadow:'0 0 0 1px var(--line) inset', borderRadius:8,
          padding:'7px 30px 7px 11px', fontSize:13, fontWeight:600, fontFamily:'inherit',
          cursor:'pointer', outline:'none',
        }}>
          {options.map(o => <option key={o} value={o} style={{background:'#1a1c23'}}>{render ? render(o) : o}</option>)}
        </select>
        <span style={{ position:'absolute', right:9, top:'50%', transform:'translateY(-50%) rotate(90deg)', pointerEvents:'none', color:'var(--text-3)' }}>
          <Ico name="chevron" size={14} />
        </span>
      </div>
    </label>
  );
}

function DiscoverPanelCard({ item, inLibrary, onImport }) {

      <div onClick={() => setShowPreview(true)}

        style={{ display:'flex', gap:10, padding:'10px', borderRadius:12, cursor:'pointer',

            marginBottom:5 }}>{item.title}</div>
          <div style={{ fontSize:11, color:'var(--text-3)' }}>

function Rankings({ library, navigate, englishTitles, rankView, setRankView, importAnime }) {
  const [q, setQ]             = useState('');
  const [genre, setGenre]     = useState('All');
  const [fmtFilter, setFmt]   = useState('All');
  const [season, setSeason]   = useState('All');
  const [sortKey, setSortKey]           = useState('overall');
  const [statusFilter, setStatusFilter] = useState('all');
  const [seasonal, setSeasonal]         = useState(null);

  useEffect(() => {
    if (seasonal !== null) return;
    const rated = library.filter(a => a.rating);
    if (rated.length < 5) return;
    fetch('/seasonal').then(r => r.ok ? r.json() : { results:[] })
      .then(d => setSeasonal(d.results || []));
  }, [library.filter(a=>a.rating).length]);

  const rated  = library.filter(a => a.rating);
  const genres = useMemo(() => {
    const s = new Set(); rated.forEach(a => a.genres.forEach(g => s.add(g)));
    return ['All', ...[...s].sort()];
  }, [library]);
  const formats = useMemo(() => {
    const s = new Set(); rated.forEach(a => a.format && s.add(a.format));
    const order = ['TV','Movie','OVA','ONA','Special','Music'];
    return ['All', ...order.filter(f => s.has(f)), ...[...s].filter(f => !order.includes(f)).sort()];
  }, [library]);
  const fmtCounts = useMemo(() => {
    const m = { All: rated.length };
    rated.forEach(a => { if (a.format) m[a.format] = (m[a.format] || 0) + 1; });
    return m;
  }, [library]);
  const seasons = useMemo(() => {
    const s = new Set(); rated.forEach(a => a.season && s.add(a.season));
    return ['All', ...[...s].sort((a,b) => b.localeCompare(a))];
  }, [library]);

  const list = useMemo(() => {
    const l = rated.filter(a =>
      (statusFilter==='all' || (a.status||'completed')===statusFilter) &&
      (genre==='All' || a.genres.includes(genre)) &&
      (fmtFilter==='All' || a.format===fmtFilter) &&
      (season==='All' || a.season===season) &&
      (q==='' || a.title.toLowerCase().includes(q.toLowerCase())));
    const val = (a) => sortKey==='overall' ? overall(a.rating) : a.rating[sortKey];
    return l.sort((a,b) => val(b) - val(a));
  }, [library, q, genre, fmtFilter, season, sortKey, statusFilter]);

  const sortOpts = [{ key:'overall', label:'Overall' }, ...CRITERIA];

  const exportMAL = () => { window.location.href = '/export/mal-xml'; };

  const discoverRecs = useMemo(() => {
    if (!seasonal || seasonal.length === 0) return { recs: [], topGenres: [] };
    const libraryTitles = new Set(library.map(a => a.title.toLowerCase()));
    const genreScore = {}, genreCount = {};
    rated.forEach(a => {
      a.genres.forEach(g => {
        genreScore[g] = (genreScore[g] || 0) + overall(a.rating);
        genreCount[g] = (genreCount[g] || 0) + 1;
      });
    });
    const topGenres = Object.entries(genreScore)
      .map(([g, s]) => ({ g, avg: s / genreCount[g] }))
      .sort((a, b) => b.avg - a.avg)
      .slice(0, 3)
      .map(x => x.g);
    const recs = seasonal.filter(item =>
      !libraryTitles.has((item.title || '').toLowerCase()) &&
      (item.genres || []).some(g => topGenres.includes(g))
    ).slice(0, 10);
    return { recs, topGenres };
  }, [seasonal, library, rated]);

  const showPanel = seasonal !== null && discoverRecs.recs.length > 0;

  return (
    <div style={{ display:'flex', alignItems:'flex-start', position:'relative', zIndex:1, minHeight:'100%' }}>
      <div style={{ flex:1, minWidth:0, padding:'30px 38px 60px' }}>
        <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:20, marginBottom:22 }}>
          <div>
            <h1 style={{ margin:0, fontSize:30, fontWeight:800, letterSpacing:'-0.02em' }}>Your Rankings</h1>
            <p style={{ margin:'6px 0 0', color:'var(--text-3)', fontSize:13.5 }}>
              <span className="mono" style={{color:'var(--text-2)'}}>{rated.length}</span> titles ranked by anchored comparison
            </p>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{ display:'flex', gap:2, padding:'3px', borderRadius:10,
              background:'var(--surface)', boxShadow:'0 0 0 1px var(--line) inset' }}>
              {[
                { key:'list', icon:'viewList', title:'List' },
                { key:'card', icon:'viewCard', title:'Cards' },
                { key:'grid', icon:'viewGrid', title:'Grid' },
              ].map(({ key, icon, title }) => (
                <button key={key} title={title} onClick={()=>setRankView(key)}
                  style={{ padding:'5px 8px', borderRadius:7, border:'none', cursor:'pointer',
                    background: rankView===key ? 'var(--raised)' : 'transparent',
                    color: rankView===key ? 'var(--accent-2)' : 'var(--text-3)',
                    boxShadow: rankView===key ? '0 0 0 1px var(--line) inset' : 'none',
                    transition:'all .12s ease', display:'flex', alignItems:'center' }}>
                  <Ico name={icon} size={15} sw={1.6} />
                </button>
              ))}
            </div>
            {rated.length > 0 && (
              <button className="btn btn-ghost" onClick={exportMAL} title="Export as MyAnimeList XML">
                <Ico name="back" size={16} sw={2.2} style={{transform:'rotate(90deg)'}} /> Export XML
              </button>
            )}
            <button className="btn btn-primary" onClick={()=>navigate({name:'search'})}>
              <Ico name="add" size={17} sw={2.2} /> Add anime
            </button>
          </div>
        </div>

        {(() => {
          const STATUS_TABS = [
            ['all','All'], ['watching','Watching'], ['completed','Completed'],
            ['plan_to_watch','Plan to Watch'], ['on_hold','On Hold'], ['dropped','Dropped'],
          ];
          const statusCounts = { all: rated.length };
          rated.forEach(a => {
            const s = a.status || 'completed';
            statusCounts[s] = (statusCounts[s] || 0) + 1;
          });
          const activeTabs = STATUS_TABS.filter(([k]) => k==='all' || statusCounts[k]);
          if (activeTabs.length <= 2) return null;
          return (
            <div style={{ display:'flex', gap:2, marginBottom:8, overflowX:'auto' }}>
              {activeTabs.map(([key, label]) => (
                <button key={key} onClick={() => setStatusFilter(key)}
                  style={{ padding:'6px 14px', borderRadius:8, border:'none', cursor:'pointer',
                    fontFamily:'inherit', fontWeight:600, fontSize:12.5,
                    background: statusFilter===key ? 'var(--accent)' : 'var(--surface)',
                    color: statusFilter===key ? '#fff' : 'var(--text-3)',
                    boxShadow: statusFilter===key ? 'none' : '0 0 0 1px var(--line) inset',
                    transition:'all .12s', whiteSpace:'nowrap', flexShrink:0 }}>
                  {label}
                  <span style={{ marginLeft:6, fontFamily:'var(--mono)', fontSize:11,
                    opacity: statusFilter===key ? 0.75 : 0.5 }}>
                    {statusCounts[key] || 0}
                  </span>
                </button>
              ))}
            </div>
          );
        })()}

        <div style={{ display:'flex', gap:2, marginBottom:4, overflowX:'auto',
          borderBottom:'1px solid var(--line)', paddingBottom:2 }}>
          {formats.map(f => (
            <FormatTab key={f} active={fmtFilter===f} onClick={()=>setFmt(f)} count={fmtCounts[f]}>
              {f}
            </FormatTab>
          ))}
        </div>

        <div style={{ display:'flex', alignItems:'center', gap:14, flexWrap:'wrap',
          padding:'14px 16px', borderRadius:14, background:'var(--surface)',
          boxShadow:'0 0 0 1px var(--line) inset', marginBottom:20 }}>
          <div style={{ display:'flex', alignItems:'center', gap:9, flex:1, minWidth:200 }}>
            <Ico name="search" size={16} color="var(--text-3)" />
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Filter your library…"
              style={{ flex:1, background:'none', border:'none', outline:'none', color:'var(--text)', fontSize:14 }} />
          </div>
          <div style={{ width:1, height:22, background:'var(--line)' }} />
          {seasons.length > 2 && <DropdownSelect label="Season" value={season} onChange={setSeason} options={seasons} />}
          <DropdownSelect label="Sort" value={sortKey} onChange={setSortKey}
            options={sortOpts.map(o=>o.key)} render={k => sortOpts.find(o=>o.key===k).label} />
        </div>

        <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:22 }}>
          {genres.map(g => <GenreChip key={g} active={genre===g} onClick={()=>setGenre(g)}>{g}</GenreChip>)}
        </div>

        <div style={{ display:'grid',
          gridTemplateColumns: rankView==='list' ? '1fr' : rankView==='card' ? 'repeat(3, 1fr)' : 'repeat(6, 1fr)',
          gap: rankView==='list' ? 8 : 16 }}>
          {list.map((a,i) => (
            <RankCard key={a.id} anime={a} rank={i+1} sortKey={sortKey}
              onOpen={()=>navigate({name:'detail', animeId:a.id})} englishTitles={englishTitles} variant={rankView} />
          ))}
          {list.length===0 && (
            <div style={{ gridColumn:'1/-1', textAlign:'center', padding:'60px 0', color:'var(--text-3)' }}>No titles match these filters.</div>
          )}
        </div>
      </div>

      {showPanel && (
        <div style={{ width:292, flexShrink:0, borderLeft:'1px solid var(--line)',
          position:'sticky', top:0, height:'100vh', overflowY:'auto',
          padding:'28px 18px 40px',
          background:'linear-gradient(180deg, rgba(255,255,255,0.012), transparent 40%)' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
            <h2 style={{ margin:0, fontSize:16, fontWeight:800, letterSpacing:'-0.01em',
              display:'flex', alignItems:'center', gap:7 }}>
              <Ico name="discover" size={15} color="var(--accent-2)" /> Discover
            </h2>
            <button className="btn-quiet" onClick={()=>navigate({name:'seasonal'})}
              style={{ fontSize:12, color:'var(--text-3)', padding:'4px 8px' }}>
              All <Ico name="chevron" size={12} style={{transform:'rotate(-90deg)'}} />
            </button>
          </div>
          <p style={{ margin:'0 0 16px', color:'var(--text-3)', fontSize:12, lineHeight:1.5 }}>
            This season · {discoverRecs.topGenres.join(', ')}
          </p>
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {discoverRecs.recs.map(item => (
              <DiscoverPanelCard key={item.api_id || item.title} item={item} onImport={importAnime}
                inLibrary={new Set(library.map(a=>a.title.toLowerCase())).has((item.title||'').toLowerCase())} />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Insights / stats screen ──────────────────────────────────────────── */
function StatCard({ label, value, sub }) {
  return (
    <div style={{ flex:1, minWidth:140, padding:'18px 20px', borderRadius:14,
      background:'var(--surface)', boxShadow:'0 0 0 1px var(--line) inset' }}>
      <div style={{ fontSize:11, fontWeight:700, letterSpacing:'0.07em',
        textTransform:'uppercase', color:'var(--text-3)', marginBottom:6 }}>{label}</div>
      <div style={{ fontFamily:'var(--mono)', fontSize:28, fontWeight:700,
        color:'var(--text)', lineHeight:1 }}>{value}</div>
      {sub && <div style={{ fontSize:12, color:'var(--text-3)', marginTop:4 }}>{sub}</div>}
    </div>
  );
}

function HBar({ label, value, max, color }) {
  const pct = max > 0 ? (value / max) * 100 : 0;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:12 }}>
      <div style={{ width:96, fontSize:13, color:'var(--text-2)', fontWeight:600,
        textAlign:'right', flexShrink:0 }}>{label}</div>
      <div style={{ flex:1, height:10, borderRadius:99, background:'var(--raised)',
        overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', borderRadius:99,
          background: color || 'var(--accent)', transition:'width 0.4s ease' }} />
      </div>
      <div style={{ width:36, fontFamily:'var(--mono)', fontSize:13,
        fontWeight:700, color:'var(--text-2)', textAlign:'right' }}>
        {value.toFixed(1)}
      </div>
    </div>
  );
}

function Insights({ library }) {
  const rated = library.filter(a => a.rating);

  const avgOverall = rated.length
    ? (rated.reduce((s, a) => s + a.rating.overall, 0) / rated.length)
    : 0;

  const avgVsMal = useMemo(() => {
    const withMal = rated.filter(a => a.mal_score != null);
    if (!withMal.length) return null;
    const delta = withMal.reduce((s, a) => s + (a.rating.overall - a.mal_score), 0) / withMal.length;
    return { delta, count: withMal.length };
  }, [library]);

  const criterionAvgs = useMemo(() => {
    if (!rated.length) return {};
    return CRITERIA.reduce((acc, c) => {
      acc[c.key] = rated.reduce((s, a) => s + (a.rating[c.key] || 0), 0) / rated.length;
      return acc;
    }, {});
  }, [library]);

  const genreStats = useMemo(() => {
    const map = {};
    rated.forEach(a => {
      a.genres.forEach(g => {
        if (!map[g]) map[g] = { sum: 0, count: 0 };
        map[g].sum   += a.rating.overall;
        map[g].count += 1;
      });
    });
    return Object.entries(map)
      .map(([g, { sum, count }]) => ({ genre: g, avg: sum / count, count }))
      .sort((a, b) => b.avg - a.avg)
      .slice(0, 10);
  }, [library]);

  const distribution = useMemo(() => {
    const buckets = {};
    for (let i = 1; i <= 10; i += 0.5) buckets[i.toFixed(1)] = 0;
    rated.forEach(a => {
      const b = (Math.floor(a.rating.overall * 2) / 2).toFixed(1);
      if (buckets[b] !== undefined) buckets[b]++;
    });
    return Object.entries(buckets).map(([score, count]) => ({ score, count }));
  }, [library]);

  const distMax = Math.max(...distribution.map(d => d.count), 1);

  const formatStats = useMemo(() => {
    const map = {};
    rated.forEach(a => {
      const f = a.format || 'Unknown';
      if (!map[f]) map[f] = { sum: 0, count: 0 };
      map[f].sum   += a.rating.overall;
      map[f].count += 1;
    });
    const order = ['TV','Movie','OVA','ONA','Special','Music'];
    return Object.entries(map)
      .map(([fmt, { sum, count }]) => ({ fmt, avg: sum / count, count }))
      .sort((a, b) => (order.indexOf(a.fmt) + 99) - (order.indexOf(b.fmt) + 99)
        || b.count - a.count);
  }, [library]);

  const topGenre = genreStats[0]?.genre || '—';
  const criterionMax = Math.max(...Object.values(criterionAvgs), 10);

  const CRITERION_COLORS = {
    story: '#34a8f0', characters: '#a78bfa', animation: '#34d399',
    audio: '#fbbf24', enjoyment: '#f87171',
  };

  if (!rated.length) return (
    <div style={{ padding:'30px 38px', color:'var(--text-3)', textAlign:'center',
      paddingTop:80 }}>Add and rate some anime to see your insights.</div>
  );

  return (
    <div style={{ padding:'30px 38px 60px', position:'relative', zIndex:1 }}>
      <h1 style={{ margin:'0 0 6px', fontSize:30, fontWeight:800, letterSpacing:'-0.02em' }}>
        Insights
      </h1>
      <p style={{ margin:'0 0 28px', color:'var(--text-3)', fontSize:13.5 }}>
        Stats across your <span className="mono" style={{color:'var(--text-2)'}}>{rated.length}</span> rated titles
      </p>

      {/* Summary cards */}
      <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginBottom:32 }}>
        <StatCard label="Titles ranked" value={rated.length} />
        <StatCard label="Avg overall" value={avgOverall.toFixed(2)} />
        <StatCard label="Top genre" value={topGenre}
          sub={genreStats[0] ? `${genreStats[0].count} titles · ${genreStats[0].avg.toFixed(1)} avg` : null} />
        {avgVsMal && (
          <StatCard label="Avg vs MAL"
            value={(avgVsMal.delta >= 0 ? '+' : '') + avgVsMal.delta.toFixed(2)}
            sub={`across ${avgVsMal.count} title${avgVsMal.count !== 1 ? 's' : ''} with MAL data`} />
        )}
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, marginBottom:24 }}>
        {/* Criterion averages */}
        <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
          boxShadow:'0 0 0 1px var(--line) inset' }}>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
            Criterion averages
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            {CRITERIA.map(c => (
              <HBar key={c.key} label={c.label}
                value={criterionAvgs[c.key] || 0}
                max={criterionMax}
                color={CRITERION_COLORS[c.key]} />
            ))}
          </div>
        </div>

        {/* Score distribution */}
        <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
          boxShadow:'0 0 0 1px var(--line) inset' }}>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
            Score distribution
          </div>
          <div style={{ display:'flex', alignItems:'flex-end', gap:3, height:80 }}>
            {distribution.map(({ score, count }) => (
              <div key={score} style={{ flex:1, display:'flex', flexDirection:'column',
                alignItems:'center', gap:3 }}>
                <div style={{ width:'100%', borderRadius:'3px 3px 0 0',
                  background: count > 0 ? 'var(--accent)' : 'var(--raised)',
                  height: `${(count / distMax) * 70}px`,
                  opacity: count > 0 ? 0.85 : 0.3,
                  transition:'height 0.3s ease', minHeight: count > 0 ? 4 : 0 }} />
              </div>
            ))}
          </div>
          <div style={{ display:'flex', justifyContent:'space-between',
            marginTop:6, fontSize:10, color:'var(--text-4)', fontFamily:'var(--mono)' }}>
            <span>1</span><span>5</span><span>10</span>
          </div>
        </div>
      </div>

      {/* Genre leaderboard */}
      <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
        boxShadow:'0 0 0 1px var(--line) inset', marginBottom:20 }}>
        <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
          textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
          Genre leaderboard
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {genreStats.map(({ genre, avg, count }, i) => (
            <div key={genre} style={{ display:'flex', alignItems:'center', gap:12 }}>
              <div style={{ width:20, fontFamily:'var(--mono)', fontSize:11,
                color:'var(--text-4)', textAlign:'right' }}>{i+1}</div>
              <div style={{ flex:1, fontSize:13.5, fontWeight:600, color:'var(--text)' }}>{genre}</div>
              <div style={{ fontSize:12, color:'var(--text-3)' }}>{count} title{count!==1?'s':''}</div>
              <div style={{ width:38, fontFamily:'var(--mono)', fontSize:13, fontWeight:700,
                color:'var(--accent-2)', textAlign:'right' }}>{avg.toFixed(1)}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Format breakdown */}
      {formatStats.length > 1 && (
        <div style={{ padding:'20px 24px', borderRadius:14, background:'var(--surface)',
          boxShadow:'0 0 0 1px var(--line) inset' }}>
          <div style={{ fontSize:12, fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--text-3)', marginBottom:16 }}>
            Format breakdown
          </div>
          <div style={{ display:'flex', gap:12, flexWrap:'wrap' }}>
            {formatStats.map(({ fmt, avg, count }) => (
              <div key={fmt} style={{ padding:'10px 16px', borderRadius:10,
                background:'var(--raised)', boxShadow:'0 0 0 1px var(--line) inset',
                minWidth:100 }}>
                <div style={{ fontSize:12, color:'var(--text-3)', fontWeight:600 }}>{fmt}</div>
                <div style={{ fontFamily:'var(--mono)', fontSize:20, fontWeight:700,
                  color:'var(--text)', marginTop:2 }}>{count}</div>
                <div style={{ fontSize:11, color:'var(--accent)', marginTop:1 }}>
                  {avg.toFixed(1)} avg
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── AniList import ───────────────────────────────────────────────────── */
function parseAniListCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const rows = lines.slice(1).map(line => {
    const fields = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { fields.push(cur); cur = ''; continue; }
      cur += c;
    }
    fields.push(cur);
    return fields;
  });
  const scores = rows.map(f => parseFloat(f[2]) || 0).filter(s => s > 0);
  const use100 = scores.some(s => s > 10);
  return rows
    .filter(f => f[0] && (parseFloat(f[2]) || 0) > 0)
    .map(f => ({
      title: f[0].trim(),
      status: (f[1] || '').trim(),
      score: Math.min(10, Math.max(1, use100 ? parseFloat(f[2]) / 10 : parseFloat(f[2]))),
    }));
}

function AniListImport({ onClose, library, setLibrary }) {
  const [phase, setPhase]         = useState('pick');
  const [entries, setEntries]     = useState([]);
  const [progress, setProgress]   = useState(0);
  const [current, setCurrent]     = useState('');
  const [doneCount, setDoneCount] = useState(0);
  const [skipCount, setSkipCount] = useState(0);
  const [fileErr, setFileErr]         = useState('');
  const [pickTab, setPickTab]         = useState('anilist');
  const [username, setUsername]       = useState('');
  const [fetching, setFetching]       = useState(false);
  const [malUsername, setMalUsername] = useState('');
  const [malFetching, setMalFetching] = useState(false);
  const [overwrite, setOverwrite]     = useState(false);
  const haveMap = new Map([
    ...library.map(a => [a.title.toLowerCase(), a.id]),
    ...library.filter(a => a.title_ro).map(a => [a.title_ro.toLowerCase(), a.id]),
  ]);
  const haveMapByApiId = new Map(library.filter(a => a.api_id).map(a => [String(a.api_id), a.id]));

  const fetchByUsername = async () => {
    if (!username.trim()) return;
    setFetching(true);
    setFileErr('');
    try {
      const query = `query ($u: String) {
        MediaListCollection(userName: $u, type: ANIME) {
          lists { entries { score status repeat media {
            idMal title { english romaji native }
            coverImage { large } episodes format averageScore
            startDate { year } genres description(asHtml: false)
          } } }
        }
      }`;
      const res = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ query, variables: { u: username.trim() } }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.errors) {
        setFileErr(json.errors[0]?.message || 'AniList returned an error.');
        setFetching(false);
        return;
      }
      const rawEntries = (json.data?.MediaListCollection?.lists ?? []).flatMap(l => l.entries);
      const scores = rawEntries.map(e => e.score).filter(s => s > 0);
      const use100 = scores.some(s => s > 10);
      const parsed = rawEntries
        .map(e => {
          const t = e.media?.title ?? {};
          const title = t.english || t.romaji || t.native || '';
          const rawScore = e.score || 0;
          const score = rawScore > 0
            ? Math.round(Math.min(10, Math.max(1, use100 ? rawScore / 10 : rawScore)) * 10) / 10
            : 0;
          const m = e.media ?? {};
          return {
            title, score, status: e.status || '', rewatch_count: e.repeat || 0,
            mal_id: m.idMal || null,
            anilist_cover: m.coverImage?.large || null,
            anilist_episodes: m.episodes || null,
            anilist_format: m.format || null,
            anilist_score: m.averageScore ? m.averageScore / 10 : null,
            anilist_year: m.startDate?.year || null,
            anilist_genres: m.genres || [],
            anilist_synopsis: m.description || null,
          };
        })
        .filter(e => e.title);
      setEntries(parsed.map(en => {
        const existingId = haveMap.get(en.title.toLowerCase());
        return existingId != null ? { ...en, existingId } : en;
      }));
      setPhase('preview');
    } catch (err) {
      setFileErr(`Could not fetch list — check the username is correct and the list is public. (${err.message})`);
    }
    setFetching(false);
  };

  const fetchByMal = async () => {
    if (!malUsername.trim()) return;
    setMalFetching(true);
    setFileErr('');
    try {
      const res = await fetch(`/jikan/user/${encodeURIComponent(malUsername.trim())}`);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setFileErr(err.detail || `Could not fetch list (${res.status})`);
        setMalFetching(false);
        return;
      }
      const { entries: raw } = await res.json();
      setEntries(raw.map(en => {
        const existingId = haveMap.get(en.title.toLowerCase());
        return existingId != null ? { ...en, existingId } : en;
      }));
      setPhase('preview');
    } catch (err) {
      setFileErr(`Could not fetch list — check the username is correct and the list is public. (${err.message})`);
    }
    setMalFetching(false);
  };

  const onFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setFileErr('');
    const name = file.name.toLowerCase();

    if (name.endsWith('.csv')) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const parsed = parseAniListCSV(ev.target.result);
        setEntries(parsed.map(en => {
          const existingId = haveMap.get(en.title.toLowerCase());
          return existingId != null ? { ...en, existingId } : en;
        }));
        setPhase('preview');
      };
      reader.readAsText(file);
      return;
    }

    // ZIP, JSON, or XML: send to backend
    if (name.endsWith('.zip') || name.endsWith('.json') || name.endsWith('.xml')) {
      const form = new FormData();
      form.append('file', file);
      try {
        const res = await fetch('/import/anilist-gdpr', { method: 'POST', body: form });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          setFileErr(err.detail || `Server error ${res.status}`);
          return;
        }
        const { entries: parsed } = await res.json();
        setEntries(parsed.map(en => {
          const existingId = haveMap.get(en.title.toLowerCase());
          return existingId != null ? { ...en, existingId } : en;
        }));
        setPhase('preview');
      } catch {
        setFileErr('Failed to read file. Please try again.');
      }
      return;
    }

    setFileErr('Unsupported file type. Use .zip, .xml, .json (GDPR/MAL export) or .csv (list export).');
  };

  const runImport = async (rawImport) => {
    const toImport = [...new Map(rawImport.map(e => [e.title.toLowerCase(), e])).values()];
    setPhase('importing');
    let done = 0, skipped = 0;
    for (let i = 0; i < toImport.length; i++) {
      const en = toImport[i];
      setProgress(i);
      setCurrent(en.title);
      try {
        const v = Math.round(en.score * 10) / 10;
        const scores = en.criteria ?? { story: v, characters: v, animation: v, audio: v, enjoyment: v };
        const rating = { ...scores, overall: v, updated_at: new Date().toISOString().slice(0, 10) };
        if (en.existingId) {
          await fetch(`/anime/${en.existingId}/rating`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(scores),
          });
          if (en.rewatch_count > 0) {
            await fetch(`/anime/${en.existingId}`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ rewatch_count: en.rewatch_count }),
            });
          }
          setLibrary(lib => lib.map(a => a.id === en.existingId ? { ...a, rating, rewatch_count: en.rewatch_count || a.rewatch_count } : a));
        } else {
          // prefer direct MAL ID lookup, fall back to title search
          let match = null;
          if (en.mal_id) {
            const direct = await fetch(`/jikan/anime/${en.mal_id}`).catch(() => null);
            if (direct && direct.ok) match = await direct.json();
          }
          if (!match) {
            const r = await fetch(`/search?q=${encodeURIComponent(en.title)}`).then(r => r.json());
            match = r.results?.[0] || null;
          }
          if (!match) {
            // Fall back to AniList metadata so AniList-exclusive anime aren't silently dropped
            if (en.title) {
              match = {
                api_id: en.mal_id ? String(en.mal_id) : null,
                title: en.title,
                title_ro: en.title,
                cover_url: en.anilist_cover || null,
                genres: en.anilist_genres || [],
                year: en.anilist_year || null,
                season: null,
                episodes: en.anilist_episodes || null,
                format: en.anilist_format || null,
                synopsis: en.anilist_synopsis || null,
                mal_score: en.anilist_score || null,
              };
            } else {
              skipped++; await new Promise(res => setTimeout(res, 400)); continue;
            }
          }
          const apiIdHit = match.api_id ? haveMapByApiId.get(String(match.api_id)) : null;
          if (apiIdHit) {
            if (en.score > 0) {
              await fetch(`/anime/${apiIdHit}/rating`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scores),
              });
            }
            const patch = {};
            if (en.rewatch_count > 0) patch.rewatch_count = en.rewatch_count;
            if (en.status) patch.status = en.status.toLowerCase();
            if (Object.keys(patch).length) {
              await fetch(`/anime/${apiIdHit}`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(patch),
              });
            }
            setLibrary(lib => lib.map(a => a.id === apiIdHit
              ? { ...a, ...(en.score > 0 ? { rating } : {}), rewatch_count: en.rewatch_count || a.rewatch_count }
              : a));
            done++;
            await new Promise(res => setTimeout(res, 400));
            continue;
          }
          const { id } = await fetch('/anime', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              api_id: match.api_id, title: match.title, title_ro: match.title_ro, cover_url: match.cover_url,
              genres: match.genres, year: match.year, season: match.season,
              episodes: match.episodes, format: match.format, synopsis: match.synopsis,
              mal_score: match.mal_score,
            }),
          }).then(r => r.json());
          if (en.score > 0) {
            await fetch(`/anime/${id}/rating`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(scores),
            });
          }
          const patch = {};
          if (en.rewatch_count > 0) patch.rewatch_count = en.rewatch_count;
          if (en.status) patch.status = en.status.toLowerCase();
          if (Object.keys(patch).length) {
            await fetch(`/anime/${id}`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(patch),
            });
          }
          setLibrary(lib => [...lib, { ...match, id, ...(en.score > 0 ? { rating } : {}), rewatch_count: en.rewatch_count || 0 }]);
        }
        done++;
      } catch { skipped++; }
      await new Promise(res => setTimeout(res, 400));
    }
    setDoneCount(done);
    setSkipCount(skipped);
    setPhase('done');
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:100,
      display:'flex', alignItems:'center', justifyContent:'center' }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:'var(--surface)', borderRadius:18, padding:32, width:480,
        maxHeight:'80vh', overflow:'auto',
        boxShadow:'0 24px 80px rgba(0,0,0,0.4)', border:'1px solid var(--line)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
          <h2 style={{ margin:0, fontSize:20, fontWeight:800 }}>Import Anime List</h2>
          <button className="btn-quiet" onClick={onClose} style={{padding:6}}><Ico name="close" size={18} /></button>
        </div>

        {phase === 'pick' && (
          <div>
            <div style={{ display:'flex', gap:2, padding:'3px', borderRadius:10,
              background:'var(--surface-2)', boxShadow:'0 0 0 1px var(--line) inset', marginBottom:20 }}>
              {[['anilist','AniList'],['mal','MAL'],['file','Upload file']].map(([key,label]) => (
                <button key={key} onClick={() => { setPickTab(key); setFileErr(''); }}
                  style={{ flex:1, padding:'7px 12px', borderRadius:8, border:'none', cursor:'pointer',
                    fontWeight:600, fontSize:13, fontFamily:'inherit',
                    background: pickTab===key ? 'var(--raised)' : 'transparent',
                    color: pickTab===key ? 'var(--text)' : 'var(--text-3)',
                    boxShadow: pickTab===key ? '0 0 0 1px var(--line) inset' : 'none',
                    transition:'all .12s ease' }}>{label}</button>
              ))}
            </div>

            {pickTab === 'anilist' && (
              <div>
                <p style={{ color:'var(--text-3)', fontSize:13.5, margin:'0 0 16px', lineHeight:1.6 }}>
                  Enter your AniList username to fetch your anime list directly.
                  Your list must be <span style={{color:'var(--text-2)'}}>public</span>.
                </p>
                <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                  <input value={username} onChange={e => setUsername(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && fetchByUsername()}
                    placeholder="AniList username" autoFocus
                    style={{ flex:1, background:'var(--raised)', border:'none',
                      boxShadow:'0 0 0 1px var(--line) inset', borderRadius:9,
                      padding:'11px 13px', color:'var(--text)', fontSize:14,
                      outline:'none', fontWeight:500, fontFamily:'inherit' }} />
                  <button className="btn btn-primary" onClick={fetchByUsername}
                    disabled={fetching || !username.trim()}
                    style={{ opacity:(fetching||!username.trim())?0.5:1,
                      pointerEvents:(fetching||!username.trim())?'none':'auto' }}>
                    {fetching ? 'Fetching…' : 'Fetch list'}
                  </button>
                </div>
                {fileErr && <div style={{ marginTop:10, fontSize:13, color:'#e07070' }}>{fileErr}</div>}
              </div>
            )}

            {pickTab === 'mal' && (
              <div>
                <p style={{ color:'var(--text-3)', fontSize:13.5, margin:'0 0 16px', lineHeight:1.6 }}>
                  Enter your MyAnimeList username to fetch your completed anime list.
                  Your list must be <span style={{color:'var(--text-2)'}}>public</span>.
                  Scores are applied equally across all 5 criteria.
                </p>
                <div style={{ display:'flex', gap:10, alignItems:'center' }}>
                  <input value={malUsername} onChange={e => setMalUsername(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && fetchByMal()}
                    placeholder="MAL username" autoFocus
                    style={{ flex:1, background:'var(--raised)', border:'none',
                      boxShadow:'0 0 0 1px var(--line) inset', borderRadius:9,
                      padding:'11px 13px', color:'var(--text)', fontSize:14,
                      outline:'none', fontWeight:500, fontFamily:'inherit' }} />
                  <button className="btn btn-primary" onClick={fetchByMal}
                    disabled={malFetching || !malUsername.trim()}
                    style={{ opacity:(malFetching||!malUsername.trim())?0.5:1,
                      pointerEvents:(malFetching||!malUsername.trim())?'none':'auto' }}>
                    {malFetching ? 'Fetching…' : 'Fetch list'}
                  </button>
                </div>
                {fileErr && <div style={{ marginTop:10, fontSize:13, color:'#e07070' }}>{fileErr}</div>}
              </div>
            )}

            {pickTab === 'file' && (
              <div>
                <p style={{ color:'var(--text-3)', fontSize:13.5, margin:'0 0 8px', lineHeight:1.6 }}>
                  Three export formats are supported:
                </p>
                <ul style={{ color:'var(--text-3)', fontSize:13, margin:'0 0 18px', paddingLeft:18, lineHeight:1.8 }}>
                  <li><span style={{color:'var(--text-2)'}}>GDPR data download</span> &mdash; anilist.co &rarr; Settings &rarr; Account &rarr; Download Data &rarr; <em>Upload the .zip file</em></li>
                  <li><span style={{color:'var(--text-2)'}}>CSV list export</span> &mdash; anilist.co &rarr; Settings &rarr; Import &amp; Export &rarr; Export Anime List &rarr; <em>Upload the .csv file</em></li>
                  <li><span style={{color:'var(--text-2)'}}>MAL / MyAnimeRank XML</span> &mdash; myanimelist.net &rarr; Export &rarr; Download XML, or use this app&rsquo;s own Export XML &rarr; <em>Upload the .xml file (per-criterion scores restored)</em></li>
                </ul>
                <label style={{ display:'block', border:'2px dashed var(--line)', borderRadius:12,
                  padding:'32px 24px', textAlign:'center', cursor:'pointer' }}>
                  <Ico name="upload" size={28} color="var(--accent-2)" />
                  <div style={{ marginTop:10, fontSize:14, color:'var(--text-2)', fontWeight:600 }}>
                    Choose file (.zip, .json, .csv, or .xml)
                  </div>
                  <div style={{ fontSize:12, color:'var(--text-3)', marginTop:4 }}>
                    Only scored entries are imported &mdash; duplicates are skipped
                  </div>
                  <input type="file" accept=".zip,.json,.csv,.xml" style={{ display:'none' }} onChange={onFile} />
                </label>
                {fileErr && (
                  <div style={{ marginTop:12, fontSize:13, color:'#e07070', textAlign:'center' }}>
                    {fileErr}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {phase === 'preview' && (() => {
          const existingCount = entries.filter(en => en.existingId).length;
          const activeEntries = entries.filter(en => overwrite || !en.existingId);
          return (
          <div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
              <p style={{ color:'var(--text-3)', fontSize:13.5, margin:0 }}>
                <span style={{color:'var(--text)', fontWeight:700}}>{activeEntries.length}</span>{' '}
                {activeEntries.length === 1 ? 'entry' : 'entries'} to import.
                Each score is applied equally across all 5 criteria.
              </p>
              {existingCount > 0 && (
                <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer',
                  fontSize:12.5, color:'var(--text-2)', fontWeight:600, flexShrink:0, marginLeft:16 }}>
                  <div onClick={() => setOverwrite(v => !v)}
                    style={{ width:32, height:18, borderRadius:999, position:'relative', cursor:'pointer',
                      background: overwrite ? 'var(--accent)' : 'rgba(255,255,255,0.15)',
                      transition:'background .15s', flexShrink:0 }}>
                    <div style={{ position:'absolute', top:2, left: overwrite ? 14 : 2,
                      width:14, height:14, borderRadius:'50%', background:'#fff',
                      transition:'left .15s', boxShadow:'0 1px 3px rgba(0,0,0,0.4)' }} />
                  </div>
                  Update {existingCount} existing
                </label>
              )}
            </div>
            <div style={{ maxHeight:260, overflowY:'auto', marginBottom:20,
              border:'1px solid var(--line)', borderRadius:10 }}>
              {activeEntries.length === 0
                ? <div style={{ padding:'32px 16px', textAlign:'center', color:'var(--text-3)' }}>
                    No new scored entries to import.
                  </div>
                : activeEntries.map((en, i) => (
                  <div key={i} style={{ display:'flex', justifyContent:'space-between',
                    alignItems:'center', padding:'10px 16px',
                    borderBottom: i < activeEntries.length - 1 ? '1px solid var(--line)' : 'none',
                    fontSize:13.5 }}>
                    <span style={{ flex:1, whiteSpace:'nowrap', overflow:'hidden',
                      textOverflow:'ellipsis', marginRight:12 }}>{en.title}</span>
                    {en.existingId && (
                      <span style={{ fontSize:10.5, fontWeight:700, letterSpacing:'0.05em',
                        color:'var(--accent-2)', marginRight:10, flexShrink:0 }}>UPDATE</span>
                    )}
                    <span style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:13,
                      color:'var(--accent)', flexShrink:0 }}>{en.score.toFixed(1)}</span>
                  </div>
                ))}
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button className="btn btn-ghost" onClick={onClose} style={{ flex:1 }}>Cancel</button>
              <button className="btn btn-primary" onClick={() => runImport(activeEntries)}
                disabled={activeEntries.length === 0} style={{ flex:2, justifyContent:'center',
                  opacity: activeEntries.length === 0 ? 0.5 : 1 }}>
                Import {activeEntries.length} {activeEntries.length === 1 ? 'entry' : 'entries'}
              </button>
            </div>
          </div>
          );
        })()}

        {phase === 'importing' && (
          <div>
            <p style={{ color:'var(--text-3)', fontSize:13.5, margin:'0 0 16px', textAlign:'center' }}>
              Importing&hellip;{' '}
              <span style={{color:'var(--text-2)', fontFamily:'var(--mono)'}}>
                {progress + 1} / {entries.length}
              </span>
            </p>
            <div style={{ height:6, borderRadius:99, background:'var(--raised)', overflow:'hidden', marginBottom:12 }}>
              <div style={{ width:`${((progress + 1) / entries.length) * 100}%`, height:'100%',
                borderRadius:99, background:'var(--accent)', transition:'width 0.4s ease' }} />
            </div>
            <div style={{ fontSize:12.5, color:'var(--text-3)', textAlign:'center',
              whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
              {current}
            </div>
          </div>
        )}

        {phase === 'done' && (
          <div style={{ textAlign:'center', padding:'8px 0' }}>
            <div style={{ width:48, height:48, borderRadius:'50%', background:'rgba(52,168,240,0.12)',
              display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 16px' }}>

function RatingFlow({ anime, library, navigate, saveRating, setAnchorScore, englishTitles }) {
  const [step, setStep]   = useState(0);
  const [scores, setScores] = useState(() => {
    const init = {};
    CRITERIA.forEach(c => { init[c.key] = anime.rating ? anime.rating[c.key] : 7.0; });
    return init;
  });
  const [broaden, setBroaden] = useState(false);

  const crit  = CRITERIA[step];
  const value = scores[crit.key];
  const setValue = (v) => setScores(s => ({ ...s, [crit.key]: v }));

  const sharedAnchors = useMemo(() =>
    library.filter(a => a.id!==anime.id && a.rating && a.genres.some(g=>anime.genres.includes(g))),
    [library, anime.id]);
  const allAnchors = useMemo(() =>
    library.filter(a => a.id!==anime.id && a.rating), [library, anime.id]);

  const fewMatches = sharedAnchors.length < 2;
  const useAll     = broaden || fewMatches;
  const pool       = (useAll ? allAnchors : sharedAnchors).map(a => ({ a, v: a.rating[crit.key] }));
  const higher     = pool.filter(x => x.v > value+0.001).sort((a,b) => a.v-b.v);
  const lower      = pool.filter(x => x.v < value-0.001).sort((a,b) => b.v-a.v);
  const same       = pool.filter(x => Math.abs(x.v-value) <= 0.001).sort((a,b) => a.a.title.localeCompare(b.a.title));
  const nearestAbove = higher[0];
  const nearestBelow = lower[0];

  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState(null);
  const done           = step === CRITERIA.length - 1;
  const runningOverall = overall(scores);
  const finish         = async () => {
    setSaving(true); setSaveErr(null);
    try { await saveRating(anime, { ...scores }); }
    catch { setSaving(false); setSaveErr('Save failed — check the server and try again.'); }
  };

  return (
    <div style={{ position:'relative', zIndex:1, height:'100%', display:'flex', flexDirection:'column' }}>
      {/* top bar */}
      <div style={{ display:'flex', alignItems:'center', gap:16, padding:'18px 36px', borderBottom:'1px solid var(--line)' }}>
        <button className="btn-quiet" onClick={()=>navigate({name:'search'})} style={{padding:7}}><Ico name="back" size={18} /></button>
        <Poster anime={anime} w={38} radius={7} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:16.5, letterSpacing:'-0.01em' }}>{displayTitle(anime, englishTitles)}</div>
          <div style={{ fontSize:12, color:'var(--text-3)', marginTop:2 }}>
            {anime.genres.join(' · ')} &middot; <span className="mono">{anime.year}</span>
          </div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontSize:10, letterSpacing:'0.07em', textTransform:'uppercase', fontWeight:700, color:'var(--text-3)', marginBottom:2 }}>Overall so far</div>
          <div style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:21, color:scoreColor(runningOverall) }}>{runningOverall.toFixed(1)}</div>
        </div>
      </div>

      {/* criteria stepper */}
      <div style={{ display:'flex', gap:8, padding:'15px 36px 0' }}>
        {CRITERIA.map((c,i) => {
          const cur = i===step, passed = i<step;
          return (
            <button key={c.key} onClick={()=>setStep(i)} style={{
              flex:1, padding:'9px 12px', borderRadius:10, textAlign:'left',
              background: cur ? 'var(--raised)' : 'transparent',
              boxShadow: cur ? '0 0 0 1px var(--accent) inset' : '0 0 0 1px var(--line) inset',
              transition:'all .15s ease',
            }}>
              <div style={{ display:'flex', alignItems:'center', gap:7 }}>
                <Ico name={c.key} size={15} sw={1.7}
                  color={cur ? 'var(--accent-2)' : (passed ? 'var(--text-2)' : 'var(--text-4)')} />
                <span style={{ fontSize:12.5, fontWeight:700, color: cur?'var(--text)':'var(--text-3)' }}>{c.label}</span>
              </div>
              <div style={{ marginTop:5, fontFamily:'var(--mono)', fontWeight:700, fontSize:15, color:scoreColor(scores[c.key]) }}>
                {scores[c.key].toFixed(1)}
              </div>
            </button>
          );
        })}
      </div>

      {/* main split */}
      <div style={{ flex:1, display:'grid', gridTemplateColumns:'372px 1fr', minHeight:0 }}>
        {/* left: candidate + input */}
        <div style={{ padding:'24px 28px 24px 36px', display:'flex', flexDirection:'column', borderRight:'1px solid var(--line)' }}>
          <div style={{ fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase', fontWeight:800, color:'var(--accent-2)' }}>

          <h2 style={{ margin:'9px 0 18px', fontSize:22, fontWeight:800, letterSpacing:'-0.02em', lineHeight:1.15 }}>
            How is its <span style={{color:'var(--accent-2)'}}>{crit.label.toLowerCase()}</span>?
          </h2>

          <div style={{ display:'flex', gap:18, alignItems:'center' }}>
            <Poster anime={anime} w={104} radius={11} showBadge />
            <div>
              <div style={{ fontSize:11, color:'var(--text-3)', fontWeight:700, letterSpacing:'0.04em', textTransform:'uppercase' }}>Score of</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:6, marginTop:2 }}>
                <span style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:52, lineHeight:1,
                  color:scoreColor(value), textShadow:`0 0 36px ${scoreColor(value).replace(')','/ 0.4)')}` }}>
