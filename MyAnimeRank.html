function App() {
  const [library, setLibrary]     = useState([]);
  const [loadErr, setLoadErr]     = useState(null);
  const [appLoading, setAppLoading] = useState(true);
  const [view, setView]           = useState({ name:'rankings' });
  const [t, setTweak]             = useTweaks({ accent:'Azure', ambient:true });

  useEffect(() => {
    fetch('/rankings')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { setLibrary((d.results || []).map(normaliseRanked)); setAppLoading(false); })
      .catch(() => { setLoadErr('Could not load rankings — is the server running?'); setAppLoading(false); });
  }, []);

  useEffect(() => {
    const [a,a2,ad] = ACCENTS[t.accent] || ACCENTS.Azure;
    const s = document.documentElement.style;
    s.setProperty('--accent', a); s.setProperty('--accent-2', a2); s.setProperty('--accent-deep', ad);
  }, [t.accent]);

  const navigate = (v) => { setView(v); document.querySelector('.mar-content')?.scrollTo(0,0); };
  const importAnime = (item) => navigate({ name:'rate', draft:{ ...item, id:null, rating:null } });

  const saveRating = async (anime, scores) => {
    const rating = { ...scores, overall: overall(scores), updated_at: new Date().toISOString().slice(0,10) };
    if (anime.id != null) {
      await fetch(`/anime/${anime.id}/rating`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(scores),
      });
      setLibrary(lib => lib.map(a => a.id===anime.id ? { ...a, rating } : a));
      navigate({ name:'detail', animeId: anime.id });
    } else {
      const { id } = await fetch('/anime', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          api_id: anime.api_id, title: anime.title, cover_url: anime.cover_url,
          genres: anime.genres, year: anime.year, season: anime.season,
          episodes: anime.episodes, format: anime.format, synopsis: anime.synopsis,
        }),
      }).then(r => r.json());
      await fetch(`/anime/${id}/rating`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(scores),
      });
      setLibrary(lib => [...lib, { ...anime, id, rating }]);
      navigate({ name:'detail', animeId: id });
    }
  };

  const deleteAnime = async (id) => {
    await fetch(`/anime/${id}`, { method: 'DELETE' });
    setLibrary(lib => lib.filter(a => a.id !== id));
    navigate({ name:'rankings' });
  };

  const setAnchorScore = (id, key, v) => {
    const target = library.find(a => a.id === id);
    if (!target?.rating) return;
    const newRating = { ...target.rating, [key]: v };
    const scores = { story: newRating.story, characters: newRating.characters,
      animation: newRating.animation, audio: newRating.audio, enjoyment: newRating.enjoyment };
    fetch(`/anime/${id}/rating`, { method:'PUT',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(scores) });
    setLibrary(lib => lib.map(a => {
      if (a.id !== id || !a.rating) return a;
      return { ...a, rating: { ...newRating, overall: overall(newRating) } };
    }));
  };

  const resetDemo = () => window.location.reload();
  const animeFor  = (id) => library.find(a => a.id===id);

  let screen;
  if (view.name==='rankings') {
    screen = <Rankings library={library} navigate={navigate} />;
  } else if (view.name==='search') {
    screen = <Search library={library} navigate={navigate} importAnime={importAnime} setLibrary={setLibrary} />;
  } else if (view.name==='rate') {
    const anime = view.draft || animeFor(view.animeId);
    screen = anime ? <RatingFlow anime={anime} library={library} navigate={navigate}
      saveRating={saveRating} setAnchorScore={setAnchorScore} /> : null;
  } else if (view.name==='detail') {
    const anime = animeFor(view.animeId);
    screen = anime
      ? <Detail anime={anime} library={library} navigate={navigate} deleteAnime={deleteAnime} />
      : <Rankings library={library} navigate={navigate} />;
  } else if (view.name==='insights') {
    screen = <Insights library={library} />;
  }

  const ratedCount = library.filter(a=>a.rating).length;

  return (
    <div className={'mar-root' + (t.ambient ? '' : ' no-ambient')}>
      <nav className="mar-nav">
        <NavMark />
        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
          <button
            className={'nav-item' + (view.name==='rankings'||view.name==='detail' ? ' active' : '')}
            onClick={()=>navigate({name:'rankings'})}>
            <Ico name="rank" size={18} /> Rankings <span className="nav-dot" />
          </button>
          <button
            className={'nav-item' + (view.name==='insights' ? ' active' : '')}
            onClick={()=>navigate({name:'insights'})}>
            <Ico name="insights" size={18} /> Insights <span className="nav-dot" />
          </button>
          <button
            className={'nav-item' + (view.name==='search'||view.name==='rate' ? ' active' : '')}
            onClick={()=>navigate({name:'search'})}>
            <Ico name="add" size={18} sw={2.2} /> Add anime <span className="nav-dot" />
          </button>
        </div>
        <div style={{ marginTop:'auto', display:'flex', flexDirection:'column', gap:14 }}>
          <div style={{ padding:'12px 13px', borderRadius:11, background:'var(--surface)', boxShadow:'0 0 0 1px var(--line) inset' }}>
            <div style={{ fontSize:11, color:'var(--text-3)', fontWeight:600 }}>Library</div>
            <div style={{ fontFamily:'var(--mono)', fontWeight:700, fontSize:22, marginTop:2 }}>
              {ratedCount}<span style={{ color:'var(--text-4)', fontSize:13 }}> rated</span>
            </div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8, padding:'0 4px', fontSize:11.5, color:'var(--text-3)' }}>
            <span style={{ width:7, height:7, borderRadius:'50%', background:'oklch(0.78 0.16 150)', boxShadow:'0 0 8px oklch(0.78 0.16 150)' }} />
            <span className="mono">localhost:8000</span>
            <button className="btn-quiet" onClick={resetDemo} title="Reset demo data"
              style={{ marginLeft:'auto', padding:4, fontSize:11 }}>reset</button>
          </div>
        </div>
      </nav>
      <main className="mar-content">
        {loadErr && (
          <div style={{ margin:'32px 38px 0', padding:'14px 18px', borderRadius:12,
            background:'rgba(248,113,113,0.1)', border:'1px solid rgba(248,113,113,0.3)',
            fontSize:14, color:'#f87171', display:'flex', alignItems:'center', gap:10 }}>
            <Ico name="close" size={16} color="#f87171" />
            {loadErr}
          </div>
        )}
        {appLoading && view.name==='rankings' ? <RankingsSkeleton /> : screen}
      </main>
      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="Accent" value={(ACCENTS[t.accent]||ACCENTS.Azure)[0]}
          options={Object.values(ACCENTS).map(a=>a[0])}
          onChange={(hex) => setTweak('accent', Object.keys(ACCENTS).find(k=>ACCENTS[k][0]===hex)||'Azure')} />
        <TweakToggle label="Ambient glow" value={t.ambient} onChange={v=>setTweak('ambient',v)} />
      </TweaksPanel>
    </div>
  );
}

function Root() {
  return <App />;
}

ReactDOM.createRoot(document.getElementById('scaler')).render(<Root />);

</script>
