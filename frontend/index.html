/* ---- vertical list + search + On My List (Studio media, Character
   Appearances, Staff Works/Characters Voiced) ---- */
function listFilterBar(opts){
  // On My List checkbox is optional -- Characters Voiced omits it entirely
  // (a character has no clean "is this on my list" mapping; the AniList API
  // itself 500s on the nested query that would have made it possible).
  const checkbox=opts.onMyListAct?`<div data-act="${opts.onMyListAct}" data-hover="border-color:var(--accent)" style="display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:9px;background:${opts.onMyListValue?'color-mix(in srgb,var(--accent) 14%,transparent)':'var(--s1)'};border:1px solid ${opts.onMyListValue?'color-mix(in srgb,var(--accent) 40%,transparent)':'var(--line)'};cursor:pointer;white-space:nowrap;">
      <div style="width:14px;height:14px;border-radius:4px;border:1.5px solid ${opts.onMyListValue?'var(--accent)':'var(--t3)'};background:${opts.onMyListValue?'var(--accent)':'transparent'};display:flex;align-items:center;justify-content:center;">${opts.onMyListValue?'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#04121d" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
      <span style="font-size:12px;font-weight:600;color:${opts.onMyListValue?'var(--accent)':'var(--t2)'};">On My List</span>
    </div>`:'';
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;">
    <div style="position:relative;flex:1;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t4);"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input data-input="${opts.searchAct}" value="${esc(opts.searchValue||'')}" placeholder="Search…" style="width:100%;height:36px;background:var(--s1);border:1px solid var(--line);border-radius:9px;padding:0 12px 0 32px;font-size:12.5px;color:var(--t1);outline:none;" />
    </div>
    ${checkbox}
  </div>`;
}
// Studio media / Character Appearances / Staff Works -- date-grouped
// (TBA bucket first, then years descending, matching AniList's own studio
// page convention), search by title, On My List via the already-loaded
// local library array (same check catalogResults() already uses).
function mediaListView(items,opts){
  const q=(opts.searchValue||'').trim().toLowerCase();
  const filtered=items.filter(it=>{
    const title=(displayTitle(it)||'').toLowerCase();
    if(q&&!title.includes(q))return false;
    if(opts.onMyListValue&&!library.some(x=>x.anilist_id===it.anilist_id))return false;
    return true;
  });
  const groups={};
  filtered.forEach(it=>{const y=it.year||'TBA';(groups[y]=groups[y]||[]).push(it);});
  const years=Object.keys(groups).filter(y=>y!=='TBA').map(Number).sort((a,b)=>b-a);
  const order=[...(groups['TBA']?['TBA']:[]),...years];
  const row=(it)=>{
    const label=displayTitle(it)||'Untitled';
    const inLib=library.find(x=>x.anilist_id===it.anilist_id);
    return `<div data-act="openRelation" data-arg="${it.anilist_id}" data-hover="background:var(--s2)" style="display:flex;align-items:center;gap:12px;padding:8px;border-radius:9px;cursor:pointer;">
      <div style="flex:0 0 36px;height:50px;border-radius:6px;position:relative;overflow:hidden;background:${cover(label)};display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);"><span style="font-family:'Overpass Mono',monospace;font-weight:700;font-size:12px;color:rgba(255,255,255,.78);">${esc(initials(label))}</span>${povr(it.cover_url,label)}</div>
      <div style="min-width:0;flex:1;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(label)}</div>
      ${inLib?`<div style="font-family:'Overpass Mono',monospace;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:5px;padding:3px 8px;flex:0 0 auto;">${STATUS_LABEL[inLib.status]}</div>`:''}
    </div>`;
  };
  const body=order.length?order.map(y=>`<div style="margin-bottom:10px;">
      <div style="font-family:'Overpass Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--t4);text-transform:uppercase;margin:14px 0 4px 8px;">${y}</div>
      ${groups[y].map(row).join('')}
    </div>`).join(''):`<div style="text-align:center;padding:30px 20px;color:var(--t4);font-family:'Overpass Mono',monospace;font-size:12px;">no matches</div>`;
  return listFilterBar(opts)+body;
}
// Staff Characters Voiced -- year-grouped (TBA-first-then-newest, same
// convention as mediaListView) using the character's associated work's
// release year, per CharacterEdge.media (a flat, non-paginated field --
// unlike Staff.characters.nodes.media, which 500s on AniList's own server
// regardless of size, confirmed via live testing). On My List checks ANY of
// that character's known work ids against the local library.
function characterRoleListView(items,opts){
  const q=(opts.searchValue||'').trim().toLowerCase();
  const filtered=items.filter(it=>{
    if(q&&!(it.name||'').toLowerCase().includes(q))return false;
    if(opts.onMyListValue&&!(it.work_anilist_ids||[]).some(id=>library.some(x=>x.anilist_id===id)))return false;
    return true;
  });
  const groups={};
  filtered.forEach(it=>{const y=it.year||'TBA';(groups[y]=groups[y]||[]).push(it);});
  const years=Object.keys(groups).filter(y=>y!=='TBA').map(Number).sort((a,b)=>b-a);
  const order=[...(groups['TBA']?['TBA']:[]),...years];
  const row=(it)=>{
    const roleLabel=enumLabel(it.role);
    return `<div data-act="openPerson" data-arg="${it.anilist_id}" data-kind="character" data-hover="background:var(--s2)" style="display:flex;align-items:center;gap:12px;padding:8px;border-radius:9px;cursor:pointer;">
      <div style="flex:0 0 44px;height:44px;position:relative;">
        <div style="width:44px;height:44px;border-radius:50%;position:relative;overflow:hidden;background:${cover(it.name)};display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);"><span style="font-family:'Overpass Mono',monospace;font-weight:700;font-size:13px;color:rgba(255,255,255,.78);">${esc(initials(it.name))}</span>${povr(it.image_url,it.name)}</div>
        ${it.workCoverUrl?`<div style="position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 2px var(--bg0);">${povr(it.workCoverUrl,it.workTitle||'')}</div>`:''}
      </div>
      <div style="min-width:0;flex:1;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.name)}</span>
          ${roleLabel?`<span style="font-family:'Overpass Mono',monospace;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--t4);background:var(--s3);border-radius:4px;padding:2px 6px;flex:0 0 auto;">${esc(roleLabel)}</span>`:''}
        </div>
        ${it.workTitle?`<div style="font-size:11.5px;color:var(--t4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(it.workTitle)}</div>`:''}
      </div>
    </div>`;
  };
  const body=order.length?order.map(y=>`<div style="margin-bottom:10px;">
      <div style="font-family:'Overpass Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--t4);text-transform:uppercase;margin:14px 0 4px 8px;">${y}</div>
      ${groups[y].map(row).join('')}
    </div>`).join(''):`<div style="text-align:center;padding:30px 20px;color:var(--t4);font-family:'Overpass Mono',monospace;font-size:12px;">no matches</div>`;
  return listFilterBar(opts)+body;
}
// Structured Staff bio fields (Birth/Age/Gender/Years Active/Hometown/Blood
// Type) -- AniList has no Height field for Staff (confirmed via live
// introspection, not built). Every field is independently nullable; only
// non-null fields render, never an empty/broken label row.
const _MONTH_NAMES=['','January','February','March','April','May','June','July','August','September','October','November','December'];
function formatStaffBirth(y,m,d){
  if(y&&m&&d)return `${_MONTH_NAMES[m]} ${d}, ${y}`;
  if(y&&m)return `${_MONTH_NAMES[m]} ${y}`;
  if(y)return String(y);
  if(m&&d)return `${_MONTH_NAMES[m]} ${d}`;
  return null;
}
function formatYearsActive(arr){
  if(!arr||!arr.length)return null;
  return (arr.length>1&&arr[1])?`${arr[0]}–${arr[1]}`:`${arr[0]}–present`;
}
function staffBioFields(p){
  const fields=[
    ['Birth',formatStaffBirth(p.birthYear,p.birthMonth,p.birthDay)],
    ['Age',p.age!=null?String(p.age):null],
    ['Gender',p.gender],
    ['Years Active',formatYearsActive(p.yearsActive)],
    ['Hometown',p.homeTown],
    ['Blood Type',p.bloodType],
  ].filter(([,v])=>v);
  if(!fields.length)return '';
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px;">
    ${fields.map(([label,value])=>`<div><div style="font-family:'Overpass Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--t4);text-transform:uppercase;margin-bottom:3px;">${esc(label)}</div><div style="font-size:13px;font-weight:600;color:var(--t1);">${esc(value)}</div></div>`).join('')}
  </div>`;
}

function detailView(){
  if(!state.current)return libraryView();
  const it=state.current.item;const inLib=state.current.source==='lib';
  // Not-yet-imported (Discover-sourced) items have no local media_id, but do
  // have a real anilist_id -- loadCommunity() picks the by-id vs by-anilist
  // route accordingly.
  // Community data is intentionally never persisted (FR-49/PRD line 215) --
  // it's volatile and re-fetched live on every open, so the fix for the
  // empty-then-populate flash is a loading skeleton, not a cache.
  let comm,commLoading=false,commError=false;
  const real=_communityCache[it.id];

  // FR-44: Rate Series only makes sense when a real series exists -- shown/

  ].filter(m=>m[1]!=null&&m[1]!=='');
  const divergence=rated?(it.rating.overall-it.avg_score):0;

  // No overflow:hidden on the hero: the Status/Progress menus hang below it

            ${hasSeries?`<div data-act="startRatingChain" title="Rate every entry in this series, in order" data-hover="border-color:var(--accent);color:var(--t1)" style="display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;background:var(--s2);border:1px solid var(--line);cursor:${state.chainLoading?'default':'pointer'};color:var(--t2);font-size:12.5px;font-weight:600;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16l13-8z"/><path d="M18 4v16" stroke-linecap="round"/></svg>${state.chainLoading?'Loading series…':'Rate Series'}</div>`:''}

            <div data-act="toggleFav" title="Favorite" style="width:36px;height:36px;border-radius:9px;background:${it._fav?'color-mix(in srgb,#e5566f 18%,transparent)':'var(--s2)'};border:1px solid ${it._fav?'color-mix(in srgb,#e5566f 45%,transparent)':'var(--line)'};display:flex;align-items:center;justify-content:center;cursor:pointer;color:${it._fav?'#e5566f':'var(--t2)'};"><svg width="15" height="15" viewBox="0 0 24 24" fill="${it._fav?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2 4.5 5.4 4A5 5 0 0112 6.2 5 5 0 0118.6 4C22 4.5 23.5 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg></div>

        <div style="display:flex;flex-direction:column;gap:14px;">${cs.map(c=>{const v=it.rating[c.key]||0;return `<div style="background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px 18px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;"><div><div style="font-weight:600;font-size:15px;">${c.label}</div><div style="font-size:11.5px;color:var(--t4);margin-top:2px;">${c.desc}</div></div><div style="font-family:'Overpass Mono',monospace;font-size:22px;font-weight:700;">${fmtScore(v)}<span style="font-size:13px;color:var(--t4);">/10</span></div></div><div style="height:7px;border-radius:4px;background:var(--s3);overflow:hidden;"><div style="height:100%;width:${pct(v,10)};background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 50%,#000),var(--accent));border-radius:4px;"></div></div></div>`;}).join('')}</div>`:inLib?`<div style="background:var(--s1);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--t3);"><div style="font-size:14px;margin-bottom:12px;">Not rated yet.</div><div data-act="editCurrent" style="display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;background:var(--accent);color:#04121d;font-weight:700;font-size:13px;cursor:pointer;">Rate this ${it.media_type}</div></div>`:`<div style="background:var(--s1);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--t3);font-size:14px;line-height:1.6;">Add this ${it.media_type} to your library to rate and track it.</div>`}

/* ---- insights ---- */
function insightsView(){
  // _insights: null = loading, false = last fetch failed (H.openInsights retries).
  const I=_insights;
  if(!I){
    const msg=I===false?"Couldn't load insights -- open this page again to retry.":'Loading insights…';
    return `<div style="padding:30px 38px 60px;max-width:1180px;margin:0 auto;animation:rk-fade .25s ease;"><h1 style="font-size:26px;font-weight:700;letter-spacing:-.4px;margin-bottom:16px;">Insights</h1><div style="font-size:13px;color:var(--t4);">${msg}</div></div>`;
  }
  const genreSection=(mt)=>{
    const rows=I.by_genre.filter(g=>g.media_type===mt).sort((a,b)=>b.avg_overall-a.avg_overall);
    if(!rows.length)return `<div style="font-size:12.5px;color:var(--t4);">Not enough rated titles yet.</div>`;
    return rows.map(g=>`<div><div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:13px;color:var(--t2);font-weight:500;">${esc(g.genre)}</span><span style="font-family:'Overpass Mono',monospace;font-size:12px;color:var(--t3);">${g.count} &middot; ${fmtScore(g.avg_overall)}</span></div><div style="height:8px;border-radius:5px;background:var(--s3);overflow:hidden;"><div style="height:100%;width:${(g.avg_overall/10*100).toFixed(0)}%;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,#000),var(--accent));border-radius:5px;"></div></div></div>`).join('');
  };
  const criterionCard=(mt,label)=>{
    const c=I.top_criterion[mt];
    return `<div style="background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;flex:1;"><div style="font-family:'Overpass Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--t4);text-transform:uppercase;margin-bottom:10px;">${label}</div>${c?`<div style="font-size:20px;font-weight:700;text-transform:capitalize;">${esc(c.criterion)}</div><div style="font-family:'Overpass Mono',monospace;font-size:12px;color:var(--accent);margin-top:4px;">${fmtScore(c.avg_score)} avg</div>`:`<div style="font-size:12.5px;color:var(--t4);">Not enough rated titles yet.</div>`}</div>`;
  };
  const divergenceRow=(e)=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);"><span style="font-size:13px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${esc(displayTitle(e))}</span><span style="font-family:'Overpass Mono',monospace;font-size:11.5px;color:var(--t4);flex:0 0 auto;">${fmtScore(e.your_score)} vs ${fmtScore(e.avg_score)}</span><span style="font-family:'Overpass Mono',monospace;font-size:12px;font-weight:700;color:${e.delta>=0?'#6bd08a':'#e57373'};flex:0 0 48px;text-align:right;">${e.delta>=0?'+':''}${e.delta.toFixed(1)}</span></div>`;
  const distChart=(mt)=>{
    const buckets=I.distribution[mt];
    const max=Math.max(1,...buckets.map(b=>b.count));
    return `<div style="display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:10px;">${buckets.map(b=>`<div style="flex:1;height:100%;display:flex;align-items:flex-end;" title="${b.bucket.toFixed(1)}: ${b.count}"><div style="width:100%;border-radius:3px 3px 0 0;background:${b.count?'linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000))':'var(--s3)'};height:${Math.max(3,b.count/max*100)}%;"></div></div>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:6px;font-family:'Overpass Mono',monospace;font-size:9px;color:var(--t4);"><span>1.0</span><span>5.5</span><span>10.0</span></div>`;
  };
  const d=I.community_divergence;
  return `<div style="padding:30px 38px 60px;max-width:1180px;margin:0 auto;animation:rk-fade .25s ease;">
    <div style="margin-bottom:26px;"><h1 style="font-size:26px;font-weight:700;letter-spacing:-.4px;">Insights</h1></div>

    <div style="font-family:'Overpass Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase;margin-bottom:12px;">Genre Breakdown</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:28px;">
      <div style="background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:22px;"><div style="font-size:12px;color:var(--t4);margin-bottom:16px;">Anime</div><div style="display:flex;flex-direction:column;gap:13px;">${genreSection('anime')}</div></div>
      <div style="background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:22px;"><div style="font-size:12px;color:var(--t4);margin-bottom:16px;">Manga</div><div style="display:flex;flex-direction:column;gap:13px;">${genreSection('manga')}</div></div>
    </div>

    <div style="font-family:'Overpass Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase;margin-bottom:12px;">Top Criterion</div>
    <div style="display:flex;gap:18px;margin-bottom:28px;">${criterionCard('anime','Anime')}${criterionCard('manga','Manga')}</div>

    <div style="font-family:'Overpass Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase;margin-bottom:12px;">Community Divergence</div>
    <div style="background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:28px;">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:18px;"><span style="font-family:'Overpass Mono',monospace;font-size:26px;font-weight:700;color:${d.avg_divergence>=0?'#6bd08a':'#e57373'};">${d.avg_divergence>=0?'+':''}${d.avg_divergence.toFixed(2)}</span><span style="font-size:12px;color:var(--t4);">avg vs community</span></div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;">
        <div><div style="font-size:11px;color:var(--t4);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Most Above</div>${d.most_above.length?d.most_above.map(divergenceRow).join(''):'<div style="font-size:12.5px;color:var(--t4);">None yet.</div>'}</div>
        <div><div style="font-size:11px;color:var(--t4);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Most Below</div>${d.most_below.length?d.most_below.map(divergenceRow).join(''):'<div style="font-size:12.5px;color:var(--t4);">None yet.</div>'}</div>
      </div>
    </div>

    <div style="font-family:'Overpass Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase;margin-bottom:12px;">Score Distribution</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;">
      <div style="background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:22px;"><div style="font-size:12px;color:var(--t4);margin-bottom:6px;">Anime</div>${distChart('anime')}</div>
      <div style="background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:22px;"><div style="font-size:12px;color:var(--t4);margin-bottom:6px;">Manga</div>${distChart('manga')}</div>
    </div>
  </div>`;
}

// Public profile for an arbitrary AniList user -- avatar/about/stats/favourites
// are all real, publicly-resolvable data (confirmed via live introspection),
// not private list/activity data. Favourites shelves reuse realShelfCover
// (same component the connected account's own Favorites screen uses);
// Favorite Studios click through to the studioView above.
function userView(){
  const u=state.user;if(!u)return searchView();
  const joined=u.created_at?new Date(u.created_at*1000).getFullYear():null;
  const stats=[
    {label:'Anime',value:String(u.anime_count)},{label:'Anime Score',value:fmtScore(u.anime_mean_score)},
    {label:'Episodes',value:String(u.anime_episodes_watched)},
    {label:'Manga',value:String(u.manga_count)},{label:'Manga Score',value:fmtScore(u.manga_mean_score)},
    {label:'Chapters',value:String(u.manga_chapters_read)},
  ];
  const f=u.favorites||{anime:[],manga:[],characters:[],staff:[],studios:[]};
  let shelves='';
  if(f.anime.length) shelves+=realShelfCover('Favorite Anime',f.anime,it=>`data-act="openFavTitle" data-arg="${it.anilist_id}" data-mt="anime"`);
  if(f.manga.length) shelves+=realShelfCover('Favorite Manga',f.manga,it=>`data-act="openFavTitle" data-arg="${it.anilist_id}" data-mt="manga"`);
  if(f.characters.length) shelves+=realShelfCover('Favorite Characters',f.characters,it=>`data-act="openPerson" data-arg="${it.anilist_id}" data-kind="character"`);
  if(f.staff.length) shelves+=realShelfCover('Favorite Staff',f.staff,it=>`data-act="openPerson" data-arg="${it.anilist_id}" data-kind="staff"`);
  if(f.studios.length) shelves+=`<div style="margin-bottom:28px;"><h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">Favorite Studios</h2>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">${f.studios.map(st=>`<div data-act="openStudio" data-arg="${st.anilist_id}" data-hover="border-color:var(--accent)" style="cursor:pointer;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px 18px;display:flex;align-items:center;"><span style="font-weight:700;font-size:14px;letter-spacing:.2px;">${esc(st.name)}</span></div>`).join('')}</div></div>`;
  return `<div style="animation:rk-fade .25s ease;"><div style="max-width:1000px;margin:0 auto;padding:30px 38px 60px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <div data-act="backUser" data-hover="color:var(--t1)" style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:'Overpass Mono',monospace;font-size:11px;color:var(--t2);"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>BACK</div>
    </div>
    <div style="display:flex;gap:24px;align-items:flex-end;margin-bottom:8px;">
      <div style="flex:0 0 100px;height:100px;border-radius:14px;position:relative;overflow:hidden;background:${cover(u.name)};display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);"><span style="font-family:'Overpass Mono',monospace;font-weight:700;font-size:28px;color:rgba(255,255,255,.85);">${esc(initials(u.name))}</span>${povr(u.avatar_url,u.name)}</div>
      <div style="flex:1;min-width:0;padding-bottom:4px;"><h1 style="font-size:30px;font-weight:800;letter-spacing:-.5px;">${esc(u.name)}</h1>${joined?`<div style="font-family:'Overpass Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--t4);text-transform:uppercase;margin-top:8px;">Joined ${joined}</div>`:''}</div>
    </div>
    ${u.about?`<div style="background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:18px;margin:22px 0 30px;"><p style="font-size:13.5px;color:var(--t2);line-height:1.65;">${mdLinks(u.about)}</p></div>`:''}
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:32px;${u.about?'':'margin-top:22px;'}">
      ${stats.map(s=>`<div style="background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;">
        <div style="font-family:'Overpass Mono',monospace;font-size:19px;font-weight:700;">${esc(s.value)}</div>
        <div style="font-family:'Overpass Mono',monospace;font-size:8.5px;letter-spacing:.5px;color:var(--t4);text-transform:uppercase;margin-top:6px;">${esc(s.label)}</div>
      </div>`).join('')}
    </div>
    ${shelves}
  </div></div>`;
}

/* ============================================================= events */
root.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const fn=H[el.dataset.act];
  if(fn)fn(el,e);
});
// Score track drag is now a native <input type=range> (see the track markup)
// firing this through the existing data-input dispatcher below -- no
// dedicated pointer/mouse listeners needed; the engine's own native widget
// handles drag internally, sidestepping WebView2's documented mousemove/
// pointer-capture gaps entirely (see H.trackInput's comment for why).
root.addEventListener('input',(e)=>{
  const el=e.target.closest('[data-input]');
  if(!el)return;
  const fn=H[el.dataset.input];
  if(fn)fn(el,e);
});
// 'change' fires on commit (blur / Enter) — used for the manual progress field so
// FR-53 auto-complete evaluates the final value, not each intermediate keystroke
root.addEventListener('change',(e)=>{
  const el=e.target.closest('[data-change]');
  if(!el)return;
  const fn=H[el.dataset.change];
  if(fn)fn(el,e);
});

// titlebar is painted once here — render() never touches it again
document.getElementById('titlebar').innerHTML = titlebar();
wireHover(document.getElementById('titlebar'));

async function loadRealLibrary(){
  try{
    const resp=await api.getLibrary();
    library.length=0;
    resp.results.forEach(x=>library.push(x));
    _uid=library.reduce((m,x)=>Math.max(m,x.id||0),_uid);
  }catch(e){console.error('failed to load real library:',e);}
}

// Pull first, then load, so the library the user first sees is already
// post-pull (no stale-then-refreshed flash). Shared by app open and login.
async function pullThenLoadLibrary(){
  try{ const resp=await api.syncPull(); state.pendingConflicts=resp.conflicts||[]; }
  catch(e){ /* non-fatal -- a slow/unreachable AniList never blocks login or the library from loading */ }
  await loadRealLibrary();
}

(async function boot(){
  let status;
  try{ status=await api.authStatus(); }
  catch(e){ console.error('backend unreachable:',e); state.backendUnreachable=true; render(); return; }
  if(status.connected){
    state.connected=true;state.username=status.username;
    await pullThenLoadLibrary(); // real Pull on every app open, not just the manual button
  }
  render();
})();
</script>
</body>
