<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyAnimeRank</title>
<!--
  MyAnimeRank v2 frontend — single-file HTML/JS shell (PRD milestone M1).
  Implemented from Claude Design project "MyAnimeRank" / Ranked.dc.html.
  Data shapes follow PRD Section 7 (API Contract). Runs inside the Tauri app
  (src-tauri/), whose in-process Rust API it always talks to -- there is no offline mode.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&family=Overpass+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#060709;--bg1:#0c0d10;--s1:#131419;--s2:#181a21;--s3:#1e212a;
    --line:#262a35;--line2:#1b1e27;--accent:#34a8f0;
    --t1:#eef1f6;--t2:#c2c8d2;--t3:#7d8593;--t4:#474d5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Overpass',system-ui,sans-serif;background:var(--bg0);color:var(--t1);-webkit-font-smoothing:antialiased;font-size:14px}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#232733;border-radius:6px;border:3px solid #0c0d10}
  ::-webkit-scrollbar-thumb:hover{background:#2e3340}
  input,select,button{font-family:inherit;color:inherit}
  input::placeholder{color:var(--t4)}
  select{-webkit-appearance:none;appearance:none}
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type="number"]{-moz-appearance:textfield}
  /* No opacity component -- screenEl.innerHTML=view() (a single synchronous
     swap, never cleared-then-rebuilt) means every one of these wrappers'
     first painted frame previously sat at opacity:0 against #screen's own
     unset (near-black --bg0/--bg1) background, well below the lighter
     --s1/--s2/--s3 surface tones the real content sits on -- read as a
     black flicker on every page whose root wraps in this animation. */
  @keyframes rk-fade{from{transform:translateY(6px)}to{transform:none}}
  @keyframes rk-pop{from{transform:scale(.96)}to{transform:none}}
  @keyframes rk-pulse{0%,100%{opacity:.35}50%{opacity:.7}}
  #app{display:flex;flex-direction:column;height:100vh;width:100%;background:var(--bg1);color:var(--t1);font-size:14px;overflow:hidden;transform:translateZ(0);will-change:transform}
  #titlebar{flex:0 0 auto}
  /* Window dragging is scoped to the titlebar's data-tauri-drag-region only,
     so slider gestures anywhere else never move the window. The no-drag on
     #screen is belt-and-braces for any -webkit-app-region-aware WebView. */
  #screen{flex:1;display:flex;flex-direction:column;min-height:0;-webkit-app-region:no-drag}
</style>
</head>
<body>
<div id="app"><div id="titlebar"></div><div id="screen"></div></div>

<script>
"use strict";

/* ============================================================= helpers */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// AniList bios come back as markdown (description(asHtml:false)) -- renders [text](url)
// links, ~!spoilers!~ (blurred until clicked, see H.revealSpoiler), and via mdInline()
// __bold__, _italic_ and newlines. Each raw segment is escaped independently so URLs
// already containing & aren't double-encoded. Only http(s) links are linkified to keep
// out javascript: etc.
function mdLinks(s){
  s=String(s==null?'':s);
  const re=/~!([\s\S]+?)!~|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
  let out='',last=0,m;
  while((m=re.exec(s))){
    out+=mdInline(s.slice(last,m.index));
    out+=m[1]!=null
      ?`<span data-act="revealSpoiler" title="Spoiler: click to reveal" style="filter:blur(5px);cursor:pointer;">${mdLinks(m[1])}</span>`
      :`<a href="${esc(m[3])}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">${mdInline(m[2])}</a>`;
    last=re.lastIndex;
  }
  out+=mdInline(s.slice(last));
  return out;
}
// Runs on already-escaped text, so the only markup it can produce is its own
// tags. _italic_ needs a non-word character (or the edge) on both sides, so
// snake_case words and URL paths stay plain.
function mdInline(s){
  return esc(s).replace(/__([^\s_](?:[^\n]*?[^\s_])?)__/g,'<b>$1</b>')
    .replace(/(^|\W)_([^\s_](?:[^_\n]*?[^\s_])?)_(?!\w)/g,'$1<i>$2</i>')
    .replace(/\r?\n/g,'<br>');
}
// AniList synopses carry <br>, <i>, <b> even with description(asHtml:false).
// Everything is escaped first; then the escaped <br>s become line breaks (3+
// in a row collapse to 2) and only <i>/<b>/<em>/<strong> are let back in,
// balanced so an unclosed tag can't carry its style into the rest of the
// page. Any other markup stays escaped text.
function fmtSynopsis(s){
  const open=[];
  let h=esc(s).replace(/&lt;br\s*\/?&gt;/gi,'\n')
    .replace(/[ \t]*\r?\n[ \t]*/g,'\n').replace(/\n{3,}/g,'\n\n').trim()
    .replace(/&lt;(\/?)(i|b|em|strong)&gt;/gi,(m,close,tag)=>{
      tag=tag.toLowerCase();
      if(!close){open.push(tag);return `<${tag}>`;}
      const i=open.lastIndexOf(tag);
      return i<0?'':open.splice(i).reverse().map(t=>`</${t}>`).join('');
    });
  h+=open.reverse().map(t=>`</${t}>`).join('');
  return h.replace(/\n/g,'<br>');
}
// Primary displayed name is English when AniList has one; romaji title_native
// and the romaji title itself stay untouched wherever they're already shown
// as secondary/subtitle text -- this only picks what counts as the headline.
// Accepts a {title,title_english} object, or a bare string (returned as-is).
function displayTitle(it){if(typeof it==='string')return it;return (it&&it.title_english)||(it&&it.title)||'';}
function cover(seed){let h=0;seed=String(seed||'');for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;const a=h%360,b=(a+42)%360;return `linear-gradient(135deg,hsl(${a} 46% 30%),hsl(${b} 52% 17%))`;}
function initials(t){t=String(t||'').trim();if(!t)return '?';const w=t.split(/\s+/).filter(Boolean);return ((w[0]||'')[0]+(w[1]?w[1][0]:'')).toUpperCase();}
function fmtScore(n){return (n==null)?'—':Number(n).toFixed(1);}
// Joins only the parts of a meta line that exist ("TV · ⭐ 8.5" when year is
// null), so a missing field never prints as "null" or leaves a stray separator.
function joinMeta(parts){return parts.filter(p=>p!=null&&p!=='').join(' · ');}
function pct(n,max){return Math.max(0,Math.min(100,(n/max)*100))+'%';}

/* ============================================================= API layer
   Desktop app (Tauri): there is no HTTP server. Each call goes through the
   `api` command straight into the Rust router in the same process, with the
   same method, path and JSON as before.
   Browser dev (`myanimerank --serve`): plain same-origin fetch, as before.
   There is no offline/mock mode -- if the backend can't be reached at boot,
   boot() shows backendDownView() and nothing else (FR-47). */
const TAURI=window.__TAURI__||null;
const API_BASE=window.location.origin;

async function apiFetch(path,opts={}){
  let status,text;
  if(TAURI){
    const r=await TAURI.core.invoke('api',{method:opts.method||'GET',path,body:opts.body??null});
    status=r.status;text=r.body;
  }else{
    const resp=await fetch(API_BASE+path,{headers:{'Content-Type':'application/json'},...opts});
    status=resp.status;text=await resp.text();
  }
  if(status<200||status>=300){
    let detail='';try{detail=JSON.parse(text).detail||'';}catch(e){}
    const err=new Error(`API ${path} failed: ${status} ${detail}`);err.status=status;throw err;
  }
  if(status===204||!text)return null;
  return JSON.parse(text);
}

const api={
  authStatus:()=>apiFetch('/auth/status'),
  authLogout:()=>apiFetch('/auth/logout',{method:'POST'}),
  getLibrary:()=>apiFetch('/library'),
  putStatus:(id,status)=>apiFetch(`/media/${id}/status`,{method:'PUT',body:JSON.stringify({status})}),
  putProgress:(id,progress)=>apiFetch(`/media/${id}/progress`,{method:'PUT',body:JSON.stringify({progress})}),
  putRepeat:(id,repeat_count)=>apiFetch(`/media/${id}/repeat`,{method:'PUT',body:JSON.stringify({repeat_count})}),
  deleteMedia:(id)=>apiFetch(`/media/${id}`,{method:'DELETE'}),
  search:(q,type)=>apiFetch(`/search?q=${encodeURIComponent(q)}&type=${type}`),
  searchCharacters:(q)=>apiFetch(`/characters/search?q=${encodeURIComponent(q)}`),
  searchStaff:(q)=>apiFetch(`/staff/search?q=${encodeURIComponent(q)}`),
  searchStudios:(q)=>apiFetch(`/studios/search?q=${encodeURIComponent(q)}`),
  searchUsers:(q)=>apiFetch(`/users/search?q=${encodeURIComponent(q)}`),
  getStudio:(anilistId)=>apiFetch(`/studios/${anilistId}`),
  getUser:(anilistId)=>apiFetch(`/users/${anilistId}`),
  importMedia:(body)=>apiFetch('/media',{method:'POST',body:JSON.stringify(body)}),
  putRating:(id,scores)=>apiFetch(`/media/${id}/rating`,{method:'PUT',body:JSON.stringify(scores)}),
  getDiscover:(section,mediaType)=>apiFetch(`/discover?section=${section}&media_type=${mediaType}`),
  getMediaByAnilist:(anilistId)=>apiFetch(`/media/by-anilist/${anilistId}`),
  getProfileStats:()=>apiFetch('/profile/stats'),
  getFavorites:()=>apiFetch('/favorites'),
  toggleFavorite:(type,anilistId)=>apiFetch('/favorites/toggle',{method:'POST',body:JSON.stringify({type,anilist_id:anilistId})}),
  getCharacter:(anilistId)=>apiFetch(`/characters/${anilistId}`),
  getStaff:(anilistId)=>apiFetch(`/staff/${anilistId}`),
  syncPull:()=>apiFetch('/sync/pull',{method:'POST'}),
  resolveConflict:(mediaId,winner)=>apiFetch(`/sync/resolve/${mediaId}`,{method:'POST',body:JSON.stringify({winner})}),
  getFeed:(type)=>apiFetch(`/feed?type=${type}`),
  getCommunity:(mediaId)=>apiFetch(`/media/${mediaId}/community`),
  getCommunityByAnilist:(anilistId)=>apiFetch(`/media/by-anilist/${anilistId}/community`),
  getInsights:()=>apiFetch('/insights'),
};
let _communityCache={};
// it.id is a real local media_id for in-library items, or a synthetic locally-
// generated one (mk()'s ++_uid) for not-yet-imported Discover items -- either
// way it's fine as a cache key here, since only it.anilist_id (always real)
// ever gets sent to the server for the not-in-library case.
async function loadCommunity(it,inLib){
  try{ _communityCache[it.id]=inLib?await api.getCommunity(it.id):await api.getCommunityByAnilist(it.anilist_id); }
  catch(e){ console.error('community fetch failed:',e); _communityCache[it.id]=null; }
  render();
}
// _feedCache[type]: undefined = loading, false = last fetch failed (opening the
// tab again retries), array = loaded (possibly empty).
let _feedCache={};
async function loadFeed(type){
  delete _feedCache[type];
  try{ const resp=await api.getFeed(type); _feedCache[type]=resp.activities; }
  catch(e){ console.error('feed fetch failed:',e); _feedCache[type]=false; }
  render();
}
let _insights=null;
async function loadInsights(){
  try{ _insights=await api.getInsights(); }
  catch(e){ console.error('insights fetch failed:',e); _insights=false; }
  render();
}
function timeAgo(iso){
  if(!iso)return '';
  const diffMs=Date.now()-new Date(iso).getTime();
  const mins=Math.floor(diffMs/60000);
  if(mins<1)return 'just now';
  if(mins<60)return `${mins} minute${mins===1?'':'s'} ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return `${hrs} hour${hrs===1?'':'s'} ago`;
  const days=Math.floor(hrs/24);
  if(days===1)return 'yesterday';
  return `${days} days ago`;
}
let _profileStats=null,_profileFavorites=null;
async function loadProfileData(){
  try{
    const [stats,favs]=await Promise.all([api.getProfileStats(),api.getFavorites()]);
    _profileStats=stats;_profileFavorites=favs;
  }catch(e){ console.error('profile load failed:',e); }
  render();
}
const DISCOVER_SECTIONS=[
  {key:'trending',label:'Currently Trending'},
  {key:'current_season',label:'Current Season'},
  {key:'upcoming_season',label:'Upcoming Season'},
  {key:'top_ranked',label:'Top Ranked'},
  {key:'top_ranked_movies',label:'Top Ranked Movies'},
  {key:'popular',label:'Popular'},
];
let _discoverCache={};
async function loadDiscoverType(mt){
  await Promise.all(DISCOVER_SECTIONS.map(async sec=>{
    try{
      const resp=await api.getDiscover(sec.key,mt);
      _discoverCache[`${sec.key}:${mt}`]=resp.results;
    }catch(e){ console.error('discover fetch failed:',sec.key,mt,e); }
  }));
  render();
}
// Search results caches, one per result shape, populated by a debounced fetch
// and read synchronously by render -- same "async fetch fills a cache, sync
// render reads it" pattern as library. media is shared between the full Search
// screen (state.query) and the Discover-tab import modal (state.dquery), and is
// the only one that feeds the import flow. One debounce timer across all kinds,
// so switching category cancels a pending search of another kind.
const _searchResults={media:[],person:[],studio:[],user:[]};
const SEARCH_FETCHERS={
  media:(q,type)=>api.search(q,type),
  person:(q,kind)=>kind==='staff'?api.searchStaff(q):api.searchCharacters(q),
  studio:(q)=>api.searchStudios(q),
  user:(q)=>api.searchUsers(q),
};
// _searchPending is true from a keystroke until that query's results land, so
// the views say "Searching…" instead of "no titles match" meanwhile. _searchSeq
// makes the latest query win: a slower earlier response is dropped.
let _searchDebounce=null,_searchSeq=0,_searchPending=false;
async function runSearch(kind,q,arg,seq){
  if(!q||!q.trim()){_searchResults[kind]=[];_searchPending=false;render();return;}
  let results=[];
  try{ const resp=await SEARCH_FETCHERS[kind](q,arg); results=resp.results; }
  catch(e){ console.error(`${kind} search failed:`,e); }
  if(seq!==_searchSeq)return;
  _searchResults[kind]=results;_searchPending=false;
  render();
}
function triggerSearch(kind,q,arg){
  clearTimeout(_searchDebounce);
  const seq=++_searchSeq;
  _searchPending=!!(q&&q.trim());
  _searchDebounce=setTimeout(()=>runSearch(kind,q,arg,seq),350);
}
// Full Search screen: route state.query to the fetcher for state.searchCategory.
function triggerCategorySearch(){
  const c=state.searchCategory;
  if(c==='character'||c==='staff')triggerSearch('person',state.query,c);
  else if(c==='studio'||c==='user')triggerSearch(c,state.query);
  else triggerSearch('media',state.query,state.searchType);
}
// Fire-and-forget background sync to the real backend, mirroring the
// backend's own "local is authoritative, push happens async" design (FR-24) --
// the local mutation + render() already happened by the time this is called,
// so a slow/failed backend call never blocks the UI. Errors are logged, not
// surfaced -- the backend's own retry queue (FR-26) is what actually recovers
// a failed push; this is just the frontend's side of telling it what changed.
function backgroundSync(fn){
  fn().catch(e=>console.error('backend sync failed:',e));
}

// Anime/Manga badge (matches design's dangerouslySetInnerHTML pills)
function pill(mt){
  const anime = mt==='anime';
  const dot = anime
    ? `<span style="width:6px;height:6px;border-radius:2px;background:currentColor;transform:rotate(45deg);"></span>`
    : `<span style="width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor;"></span>`;
  return `<span style="display:inline-flex;align-items:center;gap:6px;font-family:'Overpass Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:6px;padding:3px 9px;">${dot}${anime?'Anime':'Manga'}</span>`;
}

/* ============================================================= criteria */
const ANIME_CRITS = [
  {key:'story',label:'Story',desc:'Pacing, structure, and how satisfying the arc lands.'},
  {key:'characters',label:'Characters',desc:'Depth, growth, and how much the cast carries the work.'},
  {key:'animation',label:'Animation',desc:'Fluidity, direction, and consistency of the visuals.'},
  {key:'audio',label:'Audio',desc:'Soundtrack, voice work, and sound design.'},
  {key:'enjoyment',label:'Enjoyment',desc:'How much you personally enjoyed watching it.'},
];
const MANGA_CRITS = [
  {key:'story',label:'Story',desc:'Pacing, structure, and how satisfying the arc lands.'},
  {key:'characters',label:'Characters',desc:'Depth, growth, and how much the cast carries the work.'},
  {key:'animation',label:'Art',desc:'Linework, paneling, and visual storytelling.'},
  {key:'enjoyment',label:'Enjoyment',desc:'How much you personally enjoyed reading it.'},
];
function crits(mt){return mt==='manga'?MANGA_CRITS:ANIME_CRITS;}
function computeOverall(mt,r){
  if(!r)return null;
  const ks = crits(mt).map(c=>c.key);
  const sum = ks.reduce((a,k)=>a+(r[k]||0),0);
  return Math.round((sum/ks.length)*10)/10;
}

const STATUS = {
  anime:['watching','rewatching','completed','paused','dropped','planning'],
  manga:['reading','rereading','completed','paused','dropped','planning'],
};
const STATUS_LABEL = {watching:'Watching',rewatching:'Rewatching',reading:'Reading',rereading:'Rereading',completed:'Completed',paused:'Paused',dropped:'Dropped',planning:'Planning'};
// Real AniList `format` values are raw enum strings (TV_SHORT, ONE_SHOT, ...),
// not Title-Case display strings -- group by the raw
// key, display via FORMAT_LABEL, never by string identity.
const FORMAT_ORDER = {anime:['TV','MOVIE','OVA','ONA','TV_SHORT','SPECIAL','MUSIC'],manga:['MANGA','NOVEL','ONE_SHOT']};
const FORMAT_LABEL = {TV:'TV',TV_SHORT:'TV Short',MOVIE:'Movie',SPECIAL:'Special',OVA:'OVA',ONA:'ONA',MUSIC:'Music',MANGA:'Manga',NOVEL:'Novel',ONE_SHOT:'One Shot'};
// Display label for any raw AniList enum (format, season, relation type,
// character role): FORMAT_LABEL and the few spellings title-casing gets wrong
// first, otherwise title-case with underscores as spaces (SIDE_STORY -> Side
// Story, WINTER -> Winter). Callers keep comparing against the raw value.
const ENUM_LABEL = Object.assign({SPIN_OFF:'Spin-off'},FORMAT_LABEL);
function enumLabel(v){
  if(v==null||v==='')return '';
  v=String(v);
  return ENUM_LABEL[v]||v.toLowerCase().split('_').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

/* ============================================================= library */
// `library` is the in-memory copy of GET /library -- filled by loadRealLibrary()
// at boot/login/pull and kept in sync by each mutation's background PUT. It is
// never persisted client-side: library.db (via the API) is the only store.
const library = [];
// Earlier builds cached the whole library in localStorage['mar_library'];
// clear any leftover copy so no cached data is reachable before login (FR-47).
try{ localStorage.removeItem('mar_library'); }catch(e){}

// Not-yet-imported titles (Discover, favorites, relations) get a synthetic
// local id so they can key per-session caches like library rows do; only their
// real anilist_id is ever sent to the server. loadRealLibrary() keeps _uid
// above every real id so the two never collide.
let _uid = 0;
function mk(o){
  return Object.assign({
    id:++_uid, title_native:null, title_english:null,
    genres:[], tags:[], producers:[],
    status:'planning', progress:0, repeat_count:0,
    anilist_list_entry_id:null, updated_at:null, rating:null,
  }, o);
}

// Poster/avatar overlay: a real <img> layered over a gradient+initials box. Sits
// inside a position:relative;overflow:hidden box; onerror removes itself so the
// placeholder underneath shows through on a null URL or a failed load.
function povr(url,label){ return url?`<img src="${esc(url)}" alt="${esc(label||'')}" loading="lazy" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">`:''; }

/* ============================================================= state */
const state = {
  connected:false,
  view:'library',            // library|discover|feed|profile|search|rating|detail|insights|person|studio|user
  mediaType:'anime',
  libSearch:'', libSort:'score', libSortMenuOpen:false,
  libGenre:null, libYear:null, libGenreMenuOpen:false, libYearMenuOpen:false,
  chainLoading:false,
  expanded: JSON.parse(localStorage.getItem('mar_expanded')||'{}'),
  // search / catalog
  searchType:'anime', query:'',
  searchCategory:'anime', searchCategoryMenuOpen:false,
  discoverType:'anime', discoverSearchOpen:false, dquery:'',
  // feed
  feedType:'your',
  // modals
  importItem:null, importStatus:'planning',
  profileSettingsOpen:false, pulling:false, backendUnreachable:false,
  loginError:null,           // shown on the login screen when start_login fails
  // detail
  current:null,             // {source:'lib'|'catalog', item}
  detailMenuOpen:false, editStatus:false, editProgress:false, rewatchConfirm:null,
  // rating
  rating:null,              // {ids:[id], idx, step, scores{}, variant, chainAdd}
  // person / studio / user -- personStack holds prior person objects for
  // chained Character<->Staff navigation (Character -> VA -> Character...);
  // personReturn stays the single true origin view (Library/Search/Detail/
  // User/etc), only ever set when *entering* the chain from outside it.
  person:null, personStack:[], studio:null, user:null,
  // Works/Appearances/Media list (date-grouped) and Characters Voiced list
  // (alphabetical) filter state -- shared across Studio/Character/Staff
  // pages since only one is ever visible at a time; reset on each open.
  workListSearch:'', workListOnMyList:false, charListSearch:'', charListOnMyList:false,
};
function persistExpanded(){localStorage.setItem('mar_expanded',JSON.stringify(state.expanded));}

function defaultExpanded(mt,status){
  const open = mt==='anime'?['watching','rewatching']:['reading','rereading'];
  return open.includes(status);
}
function secExpanded(mt,status){
  const k=mt+':'+status;
  if(k in state.expanded) return state.expanded[k];
  return defaultExpanded(mt,status);
}

/* ============================================================= actions */
const H = {};
// Real window chrome only exists inside the desktop app -- in a plain
// browser tab (`--serve` dev mode) these no-op harmlessly instead of
// throwing.
const appWindow=()=>TAURI?TAURI.window.getCurrentWindow():null;
H.winMinimize = ()=>{ if(TAURI)appWindow().minimize(); };
H.winMaximize = ()=>{ if(TAURI)appWindow().toggleMaximize(); };
H.winClose = ()=>{ if(TAURI)appWindow().close(); };
function go(view){state.view=view;state.libSortMenuOpen=false;state.detailMenuOpen=false;render();}
// Fast path for the 4 open/close-only dropdowns below: mutating opacity/pointer-events
// directly (instead of calling render()) avoids destroying+recreating their box-shadow
// layout box via innerHTML on every toggle, which is what caused the black-flash.
function setMenuOpen(id,open){const n=document.getElementById(id);if(n){n.style.opacity=open?'1':'0';n.style.pointerEvents=open?'auto':'none';}}
// Same fast-path idea as setMenuOpen, for always-rendered overlay dialogs whose
// body depends on per-instance data (e.g. which pending conflict) set at the
// moment they're opened -- re-renders just that one element instead of render()
// rebuilding the whole screen. Mirrors renderStepsNav's existing single-element
// refresh convention.

// Login can't navigate this page to AniList and back: AniList redirects to
// the fixed OAuth listener port (8931), not to this page. So login opens
// elsewhere (the system browser in the desktop app, a new tab in browser dev)
// and this page polls /auth/status until the listener has stored the token.
let _authPollTimer=null;
function startAuthPolling(){
  if(_authPollTimer)return;
  _authPollTimer=setInterval(async()=>{
    try{
      const status=await api.authStatus();
      if(status.connected){
        clearInterval(_authPollTimer);_authPollTimer=null;
        state.connected=true;state.username=status.username;
        _profileStats=null;_profileFavorites=null;
        // Leave the login screen now: the pull can take several seconds, and a
        // login screen that stays up just invites another Connect click.
        state.pulling=true;render();
        await pullThenLoadLibrary(); // FR-23: first login imports the AniList lists
        state.pulling=false;render();
      }
    }catch(e){/* transient network hiccup while polling -- keep trying */}
  },1500);
}

};

// FR-44 multi-hop: AniList relations are adjacency-only -- confirmed live
// (Jujutsu Kaisen 0 never lists 2nd Season directly, only its immediate
// neighbor) -- so a single-hop lookup misses most of a franchise. Walk PREQUEL
// backward and SEQUEL forward from the opened title, fetching each newly
// discovered title's own community data as needed (library rows don't store
// relations themselves, only what's already been visited this session does).
// Capped and cycle-guarded against a malformed relation graph; never crosses
// media_type. A relation not yet in the local library used to stop that
// direction entirely -- confirmed live against Tensura that franchises with
// an OVA/"Part 2" entry sitting *between* numbered seasons (not just at the
// tail) would lose everything past it. Now the walk continues through such
// entries as {pending:true,...} chain steps (real AniList title/cover/year),
// using the by-anilist community route -- same one Detail already uses for
// not-yet-imported titles -- instead of requiring a local row to continue from.
const MAX_CHAIN_HOPS=20;
async function fetchCommunityByAnilist(anilistId,localItem){
  const cacheKey=localItem?localItem.id:'a:'+anilistId;
  if(_communityCache[cacheKey]!==undefined)return _communityCache[cacheKey];
  try{
    const resp=localItem?await api.getCommunity(localItem.id):await api.getCommunityByAnilist(anilistId);
    _communityCache[cacheKey]=resp;return resp;
  }catch(e){ console.error('community fetch failed during chain walk:',e); _communityCache[cacheKey]=null; return null; }
}
async function walkChain(startItem,relType){
  const chain=[];
  const visited=new Set([startItem.anilist_id]);
  let curAnilistId=startItem.anilist_id,curLocal=startItem,curMediaType=startItem.media_type;
  for(let hop=0;hop<MAX_CHAIN_HOPS;hop++){
    const comm=await fetchCommunityByAnilist(curAnilistId,curLocal);
    if(!comm)break;
    // A title can carry multiple same-type relation edges at once (e.g. a real
    // prequel season AND an unrelated recap/special sharing the PREQUEL tag,
    // confirmed live against Jujutsu Kaisen: Shimetsu Kaiyuu - Zenpen) -- try
    // every candidate, prefer one already in the local library, not just
    // whichever edge AniList happens to list first.
    const candidates=(comm.relations||[]).filter(r=>r.type===relType && r.anilist_id && r.media_type===curMediaType && !visited.has(r.anilist_id));
    if(!candidates.length)break;
    let nextLocal=null,nextCand=null;
    for(const cand of candidates){
      const m=library.find(x=>x.anilist_id===cand.anilist_id && x.media_type===curMediaType);
      if(m){ nextLocal=m;nextCand=cand;break; }
    }
    if(!nextCand)nextCand=candidates[0];
    visited.add(nextCand.anilist_id);
    if(nextLocal){
      chain.push(nextLocal.id);
      curAnilistId=nextLocal.anilist_id;curLocal=nextLocal;curMediaType=nextLocal.media_type;
    }else{
      chain.push({pending:true,anilist_id:nextCand.anilist_id,title:nextCand.title,title_english:nextCand.title_english,cover_url:nextCand.cover_url,year:nextCand.year,media_type:curMediaType});
      curAnilistId=nextCand.anilist_id;curLocal=null;
    }
  }
  return chain;
}
H.startRatingChain = async ()=>{
  if(state.chainLoading)return;
  const it=state.current.item;
  state.chainLoading=true;render();
  const [prequels,sequels]=await Promise.all([walkChain(it,'PREQUEL'),walkChain(it,'SEQUEL')]);
  state.chainLoading=false;
  const idOf=x=>typeof x==='object'?x.anilist_id:byId(x).anilist_id;
  const seen=new Set();
  const chain=[...prequels.slice().reverse(),it.id,...sequels].filter(x=>{
    const aid=idOf(x);if(seen.has(aid))return false;seen.add(aid);return true;
  });
  openRating(chain);
};

H.nextStep = async ()=>{const r=state.rating;const cs=crits(curRatingItem().media_type);
  if(r.step<cs.length-1){r.step++;updateCriterionPanel();return;}
  // finishing this item (or advancing to the next title in a chain) is a real
  // content change — title/poster/anchors all change — so it keeps the full render()
  await commitRating();
  r.lastRealId=curRatingItem().id;
  if(r.idx<r.ids.length-1){
    r.idx++;
    // The next chain position may be a not-yet-imported {pending:true} marker
    // (no local id yet) -- render() dispatches those to pendingImportView()
    // instead of the normal stepper, so there's no score/step to prime here.
    if(typeof r.ids[r.idx]!=='object'){r.step=0;r.scores=existingScores(curRatingItem());}
  }else{ finishChain();return; }
  render();
};
H.backSeason = ()=>{
  const r=state.rating;let i=r.idx-1;
  // Skip backward past pending/skipped markers -- "undo a skip" isn't a
  // feature here, land on the nearest real (rated or imported) step instead.
  while(i>=0 && typeof r.ids[i]==='object')i--;
  if(i>=0){r.idx=i;r.step=0;r.scores=existingScores(curRatingItem());render();}
};
// Shared by H.nextStep's normal finish and H.chainSkipStep's finish -- reopens
// Detail for the last REAL (rated or imported) title in the chain, tracked via
// r.lastRealId rather than r.ids[r.ids.length-1], since the final chain entry
// can be a marker the user chose to skip (no local item to open at all).
function finishChain(){
  const r=state.rating;const returnView=r.returnView;const lastId=r.lastRealId;
  state.rating=null;
  openDetail({source:'lib',item:byId(lastId)});
  state.detailReturn=returnView;
}
// FR-44 skip: leaves no library row (an unseen prequel/sequel shouldn't get a
// permanent unrated entry) -- just advances past this chain position.
H.chainSkipStep = ()=>{
  const r=state.rating;
  if(r.idx<r.ids.length-1){
    r.idx++;
    if(typeof r.ids[r.idx]!=='object'){r.step=0;r.scores=existingScores(curRatingItem());}
    render();
  }else{ finishChain(); }
};
// FR-44 add & rate: same import path Discover/Search already use (addFromCatalog),
// fed with the relation edge's own real anilist_id/title/cover/year -- no extra
// detail fetch. Mutates this chain slot from marker -> real local id in place so
// Back a Season later finds a normal rated/imported step, not a dead marker.
H.chainAddAndRate = async ()=>{
  const r=state.rating;const step=r.ids[r.idx];if(!step||typeof step!=='object')return;
  // The relation edge that found this step only carries title/cover/year --
  // no genres/episodes/format/synopsis/avg_score at all (confirmed: that's
  // not a field AniList's relations query fetches, not a degraded response).
  // Importing that thin shape directly silently persisted a permanently
  // incomplete row (confirmed against 2 real library rows this exact way).
  // Fetch the same full-detail lookup openTitleByAnilistId() already uses
  // for Discover-sourced titles first; only fall back to the thin edge
  // fields if that lookup itself fails, so one bad request doesn't block
  // the whole chain.
  let full;
  try{
    const resp=await api.getMediaByAnilist(step.anilist_id);
    const {in_library,...item}=resp;
    full=item;
  }catch(e){
    console.error('full detail fetch failed during chain add, falling back to thin relation data:',e);
    full={anilist_id:step.anilist_id,media_type:step.media_type,title:step.title,title_english:step.title_english,cover_url:step.cover_url,year:step.year};
  }
  const added=await addFromCatalog(full,'planning');
  if(!added)return;
  r.ids[r.idx]=added.id;r.lastRealId=added.id;r.step=0;r.scores=existingScores(added);render();
};
// A JS-tracked mousemove/pointermove drag was tried and confirmed unreliable
// specifically inside the real WebView2 desktop window (this app's
// actual runtime on Windows) -- documented WebView2 gaps: "MouseHover and
// MouseMove events do not work with WebView2" (MicrosoftEdge/WebView2Feedback
// #425) and pointer capture is lost when the cursor leaves the control
// (microsoft/microsoft-ui-xaml #8677). Both explain why manual pointer/mouse
// tracking passed every synthetic browser-tab test yet still failed in the
// real window: WebView2 simply doesn't reliably deliver the events that
// approach depends on. Fix: stop depending on them -- an invisible native
// <input type=range> overlays the existing custom visuals (fill bar/thumb/
// ticks stay as pure decoration, pointer-events:none) so drag is handled by
// the engine's own native widget internals, never JS-tracked mouse events.
H.trackInput = (el)=>{
  const v=+el.value;
  state.rating.scores[curCrit().key]=v;updateScoreDisplay();renderStepsNav();
};

          gender:r.gender,birthYear:r.birth_year,birthMonth:r.birth_month,birthDay:r.birth_day,age:r.age,yearsActive:r.years_active||[],homeTown:r.home_town,bloodType:r.blood_type,

      }else{

          shelfLabel:'Voice Actors',shelfKind:'staff',shelfItems:r.voice_actors.map(v=>[v.name,v.language||'',v.image_url,v.anilist_id]),

/* ============================================================= data ops */
function byId(id){return library.find(x=>x.id===id);}
function totalCount(it){return it.media_type==='anime'?it.episodes:it.chapters;}
// FR-53: single source of truth for a progress change — every edit path (quick
// +1, detail steppers, manual entry) routes through here so the auto-complete
// rules apply uniformly. Clamps to [0, total]; only fires the status transition
// on the crossing INTO total (old !== total) so repeatedly tapping +1 at the cap
// can't keep incrementing repeat_count.
function applyProgress(it,next){
  const max=totalCount(it);
  const old=it.progress;
  let p=Math.max(0,next);
  if(max!=null) p=Math.min(p,max);
  it.progress=p;
  it.updated_at=new Date().toISOString();
  if(max && p===max && old!==max){
    if(it.status==='watching'||it.status==='reading'){ it.status='completed'; }
    else if(it.status==='rewatching'||it.status==='rereading'){ it.repeat_count=(it.repeat_count||0)+1; it.status='completed'; }
    // Paused/Dropped/Planning/Completed: leave status as-is (FR-53)
  }
  return it;
}
function countLabel(it){const n=totalCount(it);const unit=it.media_type==='anime'?'eps':'ch';return n!=null?n+' '+unit:unit;}
// FR-57: AniList returns null episodes/chapters for hiatus/ongoing/unannounced
// titles (confirmed real case: Berserk). No total means no denominator, no "?"
// placeholder, no "Ongoing" label -- just a bare read/watched count.
function progressLabel(it){const n=totalCount(it);const unit=it.media_type==='anime'?'eps':'ch';if(n==null)return it.progress+' '+unit+' '+(it.media_type==='anime'?'watched':'read');return it.progress+' / '+n+' '+unit;}
async function addFromCatalog(c,status){
  let ex=library.find(x=>x.anilist_id===c.anilist_id);
  if(ex){
    ex.status=status;
    backgroundSync(()=>api.putStatus(ex.id,status));
    return ex;
  }
  try{
    const resp=await api.importMedia({...c,status:status});
    // real backend id -- everything downstream (rating, progress, status PUTs)
    // needs it. A failed import adds nothing locally: a row without a real id
    // would 404 on every later write.
    const it=mk(Object.assign({},c,{status:status,progress:0,rating:null,id:resp.id}));
    library.push(it);return it;
  }catch(e){
    console.error('import failed:',e);
    alert('Could not add this title -- the import request failed.');
    return null;
  }
}
async function ensureFavoritesLoaded(){
  if(_profileFavorites)return;
  try{ _profileFavorites=await api.getFavorites(); }catch(e){ console.error('favorites fetch failed:',e); }
}
function openDetail(cur){
  if(state.view&&state.view!=='detail')state.detailReturn=state.view;
  state.current=cur;state.detailMenuOpen=false;state.editStatus=false;state.editProgress=false;state.rewatchConfirm=null;
  if(_profileFavorites){
    cur.item._fav=_profileFavorites[cur.item.media_type].some(f=>f.anilist_id===cur.item.anilist_id);
  } else {
    ensureFavoritesLoaded().then(()=>{
      if(_profileFavorites&&state.current===cur){
        cur.item._fav=_profileFavorites[cur.item.media_type].some(f=>f.anilist_id===cur.item.anilist_id);
        render();
      }
    });
  }
  go('detail');
}

function openRating(ids){
  // anchorScope: 'genre' (shared-genre anchors, FR-8 default) | 'all' (same media_type, no genre filter).
  // Fresh per openRating call, so it resets to 'genre' for each new title (incl. Rate Series advance).
  // returnView: captured NOW, while state.view still genuinely reflects where
  // the user came from -- by the time rating finishes, state.view is stuck at
  // 'rating' the whole time, so openDetail()'s own state.view-based capture
  // would stamp detailReturn='rating', a dead reference once state.rating is
  // nulled on completion (that's the "Back does nothing" bug: it navigates to
  // a rating view with no session behind it, throwing mid-render). If rating
  // was opened from Detail (editCurrent/Rate Series), the real origin is
  // already sitting in detailReturn from before Detail was opened; otherwise
  // (e.g. Discover's "Add & rate") state.view itself is the real origin.
  const returnView=state.view==='detail'?(state.detailReturn||'library'):state.view;
  // ids[0] is always a real local id -- Rate Series only ever starts from an
  // in-library title's own Detail page; only interior/tail hops discovered by
  // walkChain() can be {pending:true} not-yet-imported markers.
  state.rating={ids:ids,idx:0,step:0,variant:'track',anchorScope:'genre',scores:existingScores(byId(ids[0])),returnView:returnView,lastRealId:ids[0]};
  go('rating');
}
function curRatingItem(){const r=state.rating;return byId(r.ids[r.idx]);}
function curRatingItemById(id){return byId(id);}
function curCrit(){return crits(curRatingItem().media_type)[state.rating.step];}
function existingScores(it){
  const s={};crits(it.media_type).forEach(c=>{s[c.key]=(it.rating&&it.rating[c.key])||5;});return s;
}
async function commitRating(){
  const it=curRatingItem();const r=state.rating;const mt=it.media_type;
  const rating={story:r.scores.story,characters:r.scores.characters,animation:r.scores.animation||0,audio:mt==='anime'?(r.scores.audio||0):0,enjoyment:r.scores.enjoyment};
  rating.overall=computeOverall(mt,rating); // optimistic local value -- mirrors the server's exact formula (ported in M3)
  it.rating=rating;it.updated_at=new Date().toISOString();
  try{
    const resp=await api.putRating(it.id,rating);
    rating.overall=resp.overall; // FR-9: server-computed value is authoritative
  }catch(e){ console.error('rating submit failed:',e); }
}
function anchorsFor(it,critKey,scope){
  // FR-8: 'genre' scope keeps only titles sharing >=1 genre; 'all' drops the genre filter
  // entirely (same media_type only). Sort desc by the criterion either way.
  return library.filter(x=>x.media_type===it.media_type && x.id!==it.id && x.rating
      && (scope==='all' || x.genres.some(g=>it.genres.includes(g))))
    .map(x=>({title:x.title,title_english:x.title_english,score:x.rating[critKey]||0,cover_url:x.cover_url,media_type:x.media_type}))
    .sort((a,b)=>b.score-a.score).slice(0,6);
}

/* ---- rating screen fragments, shared between ratingView()'s full render and the
   fast-path update*()/render*() functions below so a criterion/score/anchor-scope
   change never has to go through render()'s full innerHTML replace (which would
   destroy and recreate the poster <img> and everything else on every click). */
function stepsNavHtml(){
  const r=state.rating;const cs=crits(curRatingItem().media_type);
  return cs.map((cc,i)=>{
    const done=i<r.step, cur=i===r.step;
    return `<div data-act="gotoStep" data-arg="${i}" style="flex:1;cursor:pointer;">
      <div style="height:3px;border-radius:2px;background:${cur||done?'var(--accent)':'var(--s3)'};margin-bottom:8px;transition:all .2s;"></div>
      <div style="display:flex;align-items:center;gap:7px;">
        <div style="width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Overpass Mono',monospace;font-size:10px;font-weight:700;background:${cur?'var(--accent)':'transparent'};color:${cur?'#04121d':done?'var(--accent)':'var(--t4)'};border:1px solid ${cur||done?'var(--accent)':'var(--line)'};">${i+1}</div>
        <span style="font-size:12px;font-weight:600;color:${cur?'var(--t1)':'var(--t3)'};">${cc.label}</span>
        <span style="margin-left:auto;font-family:'Overpass Mono',monospace;font-size:12px;font-weight:600;color:${r.scores[cc.key]!=null?'var(--t2)':'var(--t4)'};">${fmtScore(r.scores[cc.key])}</span>
      </div>
    </div>`;
  }).join('');
}
function sliderTicksHtml(anchors){
  return anchors.map(a=>`<div title="${esc(displayTitle(a))} · ${fmtScore(a.score)}" style="position:absolute;left:${pct(a.score-1,9)};top:-3px;transform:translateX(-50%);pointer-events:none;"><div style="width:2px;height:14px;background:var(--t4);border-radius:2px;"></div></div>`).join('');
}
function anchorListHtml(anchors){
  return anchors.length?anchors.map(a=>`<div style="display:flex;align-items:center;gap:11px;padding:9px;border-radius:10px;background:var(--s2);border:1px solid var(--line2);">
    <div style="flex:0 0 34px;height:48px;border-radius:5px;position:relative;overflow:hidden;background:${cover(a.title)};display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);"><span style="font-family:'Overpass Mono',monospace;font-weight:700;font-size:11px;color:rgba(255,255,255,.8);">${esc(initials(displayTitle(a)))}</span>${povr(a.cover_url,displayTitle(a))}</div>
    <div style="min-width:0;flex:1;"><div style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(displayTitle(a))}</div><div style="height:4px;border-radius:3px;background:var(--s3);margin-top:6px;overflow:hidden;"><div style="height:100%;width:${pct(a.score,10)};background:var(--t3);border-radius:3px;"></div></div></div>
    <span style="font-family:'Overpass Mono',monospace;font-size:15px;font-weight:700;color:var(--t2);">${fmtScore(a.score)}</span>
  </div>`).join(''):`<div style="text-align:center;padding:30px 10px;color:var(--t4);font-family:'Overpass Mono',monospace;font-size:11px;line-height:1.6;">no comparable<br>titles rated yet</div>`;
}
// Track and Dial are both always in the DOM (see ratingView()'s `control`), so both
// get updated every time regardless of which is currently visible -- otherwise the
// hidden one would show stale data the moment it's switched back into view.
function updateScoreDisplay(){
  const r=state.rating;const it=curRatingItem();const c=crits(it.media_type)[r.step];
  const score=r.scores[c.key]||5;const scPct=pct(score-1,9);
  const trackScoreEl=document.getElementById('rs-score-track');if(trackScoreEl)trackScoreEl.textContent=fmtScore(score);
  const dialScoreEl=document.getElementById('rs-score-dial');if(dialScoreEl)dialScoreEl.textContent=fmtScore(score);
  const fill=document.getElementById('rs-slider-fill');if(fill)fill.style.width=scPct;
  const thumb=document.getElementById('rs-slider-thumb');if(thumb)thumb.style.left=scPct;
  const trackInput=document.getElementById('rs-track-input');if(trackInput&&+trackInput.value!==score)trackInput.value=score;
  const dial=document.getElementById('rs-dial');if(dial)dial.style.background=`conic-gradient(var(--accent) ${scPct}, var(--s3) 0)`;
  const overallEl=document.getElementById('rs-overall');if(overallEl)overallEl.textContent=fmtScore(computeOverall(it.media_type,r.scores));
}
function renderStepsNav(){const n=document.getElementById('rs-steps');if(n)n.innerHTML=stepsNavHtml();}
function renderAnchorList(){
  const r=state.rating;const it=curRatingItem();const c=crits(it.media_type)[r.step];
  const anchors=anchorsFor(it,c.key,r.anchorScope);
  const list=document.getElementById('rs-anchor-list');if(list)list.innerHTML=anchorListHtml(anchors);
  return anchors;
}
function renderSliderAnchors(anchors){
  const n=document.getElementById('rs-slider-anchors');if(n)n.innerHTML=sliderTicksHtml(anchors);
}
// Full step-change update: criterion label/desc, score/slider/dial, overall,
// steps-nav, anchor list + scope label, Previous/Next button state. Deliberately
// never touches the poster <img>, title header, or chain banner — those only
// depend on curRatingItem(), which doesn't change on a step navigation.
function updateCriterionPanel(){
  const r=state.rating;const it=curRatingItem();const cs=crits(it.media_type);const c=cs[r.step];
  const stepnumEl=document.getElementById('rs-stepnum');if(stepnumEl)stepnumEl.textContent=`Criterion ${r.step+1} / ${cs.length}`;
  const labelEl=document.getElementById('rs-label');if(labelEl)labelEl.textContent=c.label;
  const descEl=document.getElementById('rs-desc');if(descEl)descEl.textContent=c.desc;
  const anchorCritLabelEl=document.getElementById('rs-anchor-crit-label');if(anchorCritLabelEl)anchorCritLabelEl.textContent=c.label;
  updateScoreDisplay();

  const nextLabelEl=document.getElementById('rs-next-label');
  if(nextLabelEl)nextLabelEl.textContent=r.step<cs.length-1?'Next':(r.idx<r.ids.length-1?'Next Title':'Finish');
}
function myRank(it){
  const rated=library.filter(x=>x.media_type===it.media_type && x.rating).sort((a,b)=>b.rating.overall-a.rating.overall);
  return rated.indexOf(it)+1;
}

/* ============================================================= render */
// root stays the delegated-event target (click/input/change listeners below are
// bound here once, at boot); screenEl is the only node render() ever tears down.
// titlebar is state-independent (see titlebar() — no state reads) so it's painted
// once into its own persistent node and never touched again, instead of being
// destroyed/rebuilt on every click along with the rest of the tree.
const root=document.getElementById('app');
const screenEl=document.getElementById('screen');

function wireHover(container){
  container.querySelectorAll('[data-hover]').forEach(el=>{
    el.addEventListener('mouseenter',()=>{el._o=el.getAttribute('style')||'';el.setAttribute('style',el._o+';'+el.dataset.hover);});
    el.addEventListener('mouseleave',()=>{el.setAttribute('style',el._o||'');});
  });
}

function render(){
  // preserve focus + caret for inputs across re-render
  const act=document.activeElement;
  const focusId=act&&act.id&&/^in-/.test(act.id)?act.id:null;
  const selStart=focusId?act.selectionStart:null, selEnd=focusId?act.selectionEnd:null;

  screenEl.innerHTML = view();

  if(focusId){const n=document.getElementById(focusId);if(n){n.focus();try{n.setSelectionRange(selStart,selEnd);}catch(e){}}}
  wireHover(screenEl);
}

function view(){
  if(state.backendUnreachable)return backendDownView();
  return (state.connected ? shell() : loginGate()) + importModal() + discoverSearchModal() + profileSettingsModal() + rewatchDialog() + conflictDialog();
}

// FR-58: per-entry conflict resolution UI. Doesn't exist in the original mock
// at all -- genuinely new. Mirrors rewatchDialog()'s visual pattern (icon +
// label header, body copy, two-button footer) since that's the established
// "confirm a consequential choice" dialog style in this app.
function conflictDialog(){
  // Always rendered (see profileSettingsModal's convention) -- open/closed is
  // a pure opacity/pointer-events flip via setMenuOpen, never a render().
  // c can be null while hidden (no pending conflict at all yet, e.g. before
  // any Pull has ever run); the safe fallback below only ever feeds the
  // invisible-while-closed markup, never something the user can see.
  const list=state.pendingConflicts;
  const idx=state.conflictIdx;
  const open=!!(list&&list.length&&idx!=null&&list[idx]);
  const c=open?list[idx]:{title:'',local:{status:'',progress:0},remote:{status:'',progress:0}};
  return `<div id="modal-conflict" data-act="closeConflicts" style="position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,5,7,.8);backdrop-filter:blur(4px);opacity:${open?'1':'0'};pointer-events:${open?'auto':'none'};">
    <div data-act="stop" style="width:460px;max-width:100%;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6);">

        <div style="width:36px;height:36px;border-radius:9px;background:color-mix(in srgb,#e0a24a 16%,transparent);border:1px solid color-mix(in srgb,#e0a24a 40%,transparent);display:flex;align-items:center;justify-content:center;color:#e0a24a;flex:0 0 auto;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke-linejoin="round"/></svg>
        </div>
        <span style="font-family:'Overpass Mono',monospace;font-size:11px;letter-spacing:2px;color:#e0a24a;text-transform:uppercase;">Sync conflict (${open?idx+1:0}/${list?list.length:0})</span>
      </div>
      <p style="font-size:14px;font-weight:700;margin-bottom:10px;">${esc(displayTitle(c))}</p>
      <p style="font-size:12.5px;color:var(--t3);line-height:1.5;margin-bottom:16px;">This title changed both here and on AniList since the last sync. Pick which version to keep.</p>
      <div style="display:flex;gap:10px;margin-bottom:20px;">
        <div style="flex:1;background:var(--s2);border:1px solid var(--line2);border-radius:11px;padding:12px;">
          <div style="font-family:'Overpass Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--t4);text-transform:uppercase;margin-bottom:6px;">This app</div>
          <div style="font-size:13px;font-weight:600;">${esc(STATUS_LABEL[c.local.status]||c.local.status)}</div>
          <div style="font-size:12px;color:var(--t3);margin-top:2px;">Progress: ${esc(c.local.progress)}</div>
        </div>
        <div style="flex:1;background:var(--s2);border:1px solid var(--line2);border-radius:11px;padding:12px;">
          <div style="font-family:'Overpass Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--t4);text-transform:uppercase;margin-bottom:6px;">AniList</div>
          <div style="font-size:13px;font-weight:600;">${esc(STATUS_LABEL[c.remote.status]||c.remote.status)}</div>
          <div style="font-size:12px;color:var(--t3);margin-top:2px;">Progress: ${esc(c.remote.progress)}</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <div data-act="resolveConflict" data-arg="local" style="flex:1;padding:12px;border-radius:11px;background:var(--s3);border:1px solid var(--line);color:var(--t2);font-weight:600;font-size:13px;cursor:pointer;text-align:center;">Keep this app's</div>
        <div data-act="resolveConflict" data-arg="remote" style="flex:1;padding:12px;border-radius:11px;background:var(--accent);color:#04121d;font-weight:700;font-size:13px;cursor:pointer;text-align:center;">Use AniList's</div>
      </div>
    </div>
  </div>`;
}

/* ---- titlebar ---- */
function titlebar(){
  const btn=(act,h,hover)=>`<div data-act="${act}" data-hover="${hover}" style="width:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);height:100%">${h}</div>`;
  // Tauri starts a window drag only when the mousedown target ITSELF carries
  // data-tauri-drag-region (double-click toggles maximize). The logo/title
  // children are pointer-events:none so clicks on them land on the region.
  // The attribute sits only on the logo/title block, never on an ancestor of
  // the window-control buttons, so those buttons stay clickable.
  return `<div style="flex:0 0 auto;height:40px;background:var(--bg0);border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 0 0 14px;user-select:none;">
    <div data-tauri-drag-region style="display:flex;align-items:center;gap:10px;flex:1;height:100%;">
      <div style="pointer-events:none;width:13px;height:13px;border-radius:3px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);"></div>
      <span style="pointer-events:none;font-family:'Overpass Mono',monospace;font-weight:700;font-size:12px;letter-spacing:3px;">MyAnimeRank</span>
      <span style="pointer-events:none;font-family:'Overpass Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--t4);padding-left:8px;border-left:1px solid var(--line2);">anime · manga scoring</span>
    </div>
    <div style="-webkit-app-region:no-drag;display:flex;align-items:stretch;height:100%;">
      ${btn('winMinimize','<div style="width:11px;height:1px;background:currentColor;"></div>','background:var(--s2);color:var(--t1)')}
      ${btn('winMaximize','<div style="width:9px;height:9px;border:1px solid currentColor;border-radius:1px;"></div>','background:var(--s2);color:var(--t1)')}
      ${btn('winClose','<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.3"/></svg>','background:#c0392b;color:#fff')}
    </div>
  </div>`;
}

/* ---- login gate ---- */
function loginGate(){
  return `<div style="flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% -10%, #101218 0%, var(--bg1) 60%);padding:40px;">
    <div style="text-align:center;max-width:340px;">
      <div style="width:62px;height:62px;border-radius:16px;background:var(--accent);transform:rotate(45deg);margin:0 auto 30px;box-shadow:0 0 0 8px color-mix(in srgb, var(--accent) 14%, transparent);"></div>
      <div style="font-family:'Overpass Mono',monospace;font-weight:700;font-size:20px;letter-spacing:5px;margin-bottom:10px;">MyAnimeRank</div>
      <p style="font-size:14px;color:var(--t3);line-height:1.6;margin-bottom:34px;">Score anime and manga on your own terms &mdash; connect your AniList account to pull in your lists and start rating.</p>
      <div data-act="connect" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;border-radius:12px;background:var(--accent);color:#04121d;cursor:pointer;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 30%,transparent);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Connect AniList
      </div>
      ${state.loginError?`<p style="font-size:13px;color:#e57373;line-height:1.5;margin-top:18px;">Couldn't start login: ${esc(state.loginError)}</p>`:''}

/* ---- backend unreachable ---- */
// Shown instead of everything else when boot() can't reach the API. There is no
// offline fallback (FR-47): no tabs, library, or cached data render here.
function backendDownView(){
  return `<div style="flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% -10%, #101218 0%, var(--bg1) 60%);padding:40px;">
    <div style="text-align:center;max-width:380px;">
      <div style="font-size:18px;font-weight:700;margin-bottom:10px;">Can't reach the app backend</div>
      <p style="font-size:14px;color:var(--t3);line-height:1.6;margin-bottom:26px;">MyAnimeRank couldn't reach its backend. Restart the app (or <code style="font-family:'Overpass Mono',monospace;color:var(--t2);">myanimerank --serve</code> for browser dev), then retry.</p>
      <div data-act="retryBackend" style="display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:12px;background:var(--accent);color:#04121d;cursor:pointer;font-weight:700;font-size:14px;">Retry</div>
    </div>
  </div>`;
}

/* ---- shell (main + nav) ---- */
function shell(){
  let body='';
  switch(state.view){
    case 'library': body=libraryView(); break;
    case 'discover': body=discoverView(); break;
    case 'feed': body=feedView(); break;
    case 'profile': body=profileView(); break;
    case 'search': body=searchView(); break;
    case 'rating': body=(state.rating&&typeof state.rating.ids[state.rating.idx]==='object')?pendingImportView():ratingView(); break;
    case 'detail': body=detailView(); break;
    case 'insights': body=insightsView(); break;
    case 'person': body=personView(); break;
    case 'studio': body=studioView(); break;
    case 'user': body=userView(); break;
    default: body=libraryView();
  }
  return `<div style="flex:1;display:flex;flex-direction:column;min-height:0;">
    <div style="flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;background:radial-gradient(120% 80% at 50% -10%, #101218 0%, var(--bg1) 60%);">${body}</div>
    ${bottomNav()}
  </div>`;
}

function bottomNav(){
  const items=[
    {key:'anime',label:'Anime',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>'},
    {key:'manga',label:'Manga',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg>'},
    {key:'discover',label:'Discover',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>'},
    {key:'feed',label:'Feed',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 019 9M4 4a16 16 0 0116 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/></svg>'},
    {key:'profile',label:'Profile',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>'},
  ];
  const active=(k)=>{
    if(k==='anime')return state.view==='library'&&state.mediaType==='anime';
    if(k==='manga')return state.view==='library'&&state.mediaType==='manga';
    return state.view===k;
  };
  return `<div style="flex:0 0 66px;background:var(--bg0);border-top:1px solid var(--line2);display:flex;">
    ${items.map(n=>{const a=active(n.key);return `<div data-act="nav" data-arg="${n.key}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:${a?'var(--accent)':'var(--t3)'};background:${a?'color-mix(in srgb,var(--accent) 8%,transparent)':'transparent'};transition:all .14s;">
      <div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;">${n.icon}</div>
      <span style="font-family:'Overpass Mono',monospace;font-size:9px;letter-spacing:.5px;text-transform:uppercase;">${n.label}</span>
    </div>`;}).join('')}
  </div>`;
}

/* ---- library (Anime/Manga tab) ---- */
function libraryView(){
  const mt=state.mediaType;
  const label=mt==='anime'?'anime':'manga';
  const critSortOpts=[['story','By Story'],['characters','By Characters'],['animation','By Animation'],['audio','By Audio'],['enjoyment','By Enjoyment']]
    .filter(o=>!(mt==='manga'&&o[0]==='audio'));
  const sortOpts=[['score','By Score'],['title','By Title'],['progress','By Progress'],['updated','Last Updated'],...critSortOpts];
  const tabItems=library.filter(x=>x.media_type===mt);
  const genreOpts=[...new Set(tabItems.flatMap(x=>x.genres||[]))].sort();
  const yearOpts=[...new Set(tabItems.map(x=>x.year).filter(Boolean))].sort((a,b)=>b-a);
  const q=state.libSearch.trim().toLowerCase();
  // FR-31: matches the English headline, romaji and native titles alike.
  let items=tabItems.filter(x=>(!q||[x.title,x.title_english,x.title_native].some(t=>t&&t.toLowerCase().includes(q)))
    && (!state.libGenre||(x.genres||[]).includes(state.libGenre))
    && (!state.libYear||x.year===state.libYear));
  const critKeys=['story','characters','animation','audio','enjoyment'];
  const sorter={
    score:(a,b)=>((b.rating?b.rating.overall:-1)-(a.rating?a.rating.overall:-1)),
    title:(a,b)=>displayTitle(a).localeCompare(displayTitle(b)),
    progress:(a,b)=>b.progress-a.progress,
    updated:(a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)),
    ...Object.fromEntries(critKeys.map(k=>[k,(a,b)=>((b.rating?(b.rating[k]??0):-1)-(a.rating?(a.rating[k]??0):-1))])),
  }[state.libSort];
  items=items.slice().sort(sorter);

  const filterMenu=(id,opts,current,allLabel,actName,fmt)=>{
    const open=state[id==='menu-libGenre'?'libGenreMenuOpen':'libYearMenuOpen'];
    return `<div id="${id}" style="position:absolute;top:100%;right:0;margin-top:6px;z-index:10;background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);min-width:170px;max-height:280px;overflow-y:auto;opacity:${open?'1':'0'};pointer-events:${open?'auto':'none'};">
    <div data-act="${actName}" data-hover="background:var(--s3)" style="padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:${current===null?'var(--accent)':'var(--t2)'};">${allLabel}</div>
    ${opts.map(o=>`<div data-act="${actName}" data-arg="${esc(String(o))}" data-hover="background:var(--s3)" style="padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:${current===o?'var(--accent)':'var(--t2)'};">${esc(fmt?fmt(o):String(o))}</div>`).join('')}
  </div>`;
  };

  const header=`<div style="max-width:900px;margin:0 auto;padding:24px 24px 10px;animation:rk-fade .25s ease;">
    <h1 style="font-size:24px;font-weight:700;letter-spacing:-.4px;margin-bottom:16px;">Your ${mt==='anime'?'Anime':'Manga'}</h1>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
      <div style="position:relative;flex:1;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t4);"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="in-libSearch" data-input="libSearch" value="${esc(state.libSearch)}" placeholder="Search your ${label}&hellip;" style="width:100%;height:42px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:0 14px 0 38px;font-size:13px;color:var(--t1);outline:none;" />
      </div>
      <div style="position:relative;flex:0 0 auto;">
        <div data-act="openSearch" title="Search AniList to import" data-hover="border-color:var(--accent);color:var(--t1)" style="width:42px;height:42px;border-radius:10px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div style="position:relative;flex:0 0 auto;">
        <div data-act="toggleLibGenreMenu" title="Genre" data-hover="border-color:var(--accent);color:var(--t1)" style="width:42px;height:42px;border-radius:10px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:${state.libGenre?'var(--accent)':'var(--t3)'};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L4 3a1 1 0 0 0-1 1l.24 5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.82z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>
        </div>
        ${filterMenu('menu-libGenre',genreOpts,state.libGenre,'All genres','setLibGenre')}
      </div>
      <div style="position:relative;flex:0 0 auto;">
        <div data-act="toggleLibYearMenu" title="Year" data-hover="border-color:var(--accent);color:var(--t1)" style="width:42px;height:42px;border-radius:10px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:${state.libYear?'var(--accent)':'var(--t3)'};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
        ${filterMenu('menu-libYear',yearOpts,state.libYear,'All years','setLibYear')}
      </div>
      <div style="position:relative;flex:0 0 auto;">
        <div data-act="toggleLibSortMenu" title="Sort" data-hover="border-color:var(--accent);color:var(--t1)" style="width:42px;height:42px;border-radius:10px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        </div>
        <div id="menu-libSort" style="position:absolute;top:100%;right:0;margin-top:6px;z-index:10;background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);min-width:170px;opacity:${state.libSortMenuOpen?'1':'0'};pointer-events:${state.libSortMenuOpen?'auto':'none'};">
          ${sortOpts.map(o=>`<div data-act="setLibSort" data-arg="${o[0]}" data-hover="background:var(--s3)" style="padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:${state.libSort===o[0]?'var(--accent)':'var(--t2)'};">${o[1]}</div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;

  const order=STATUS[mt];
  const sections=order.map(status=>{
    const rows=items.filter(x=>x.status===status);
    return {status,rows};
  }).filter(s=>s.rows.length||true); // keep all headers (design shows counts)

  const body=`<div style="max-width:900px;margin:0 auto;padding:0 24px 60px;">
    ${sections.map(sec=>{
      const exp=secExpanded(mt,sec.status);
      let inner='';
      if(exp){
        if(sec.status==='completed'){
          // norm() maps a format string onto FORMAT_ORDER's raw enum keys
          // ('Movie' or 'MOVIE' -> 'MOVIE') so grouping never depends on casing.
          const norm=(f)=>(f||'').toUpperCase().replace(/ /g,'_');
          const known=FORMAT_ORDER[mt].map(fmt=>({label:enumLabel(fmt),items:sec.rows.filter(r=>norm(r.format)===fmt)}));
          const otherItems=sec.rows.filter(r=>!FORMAT_ORDER[mt].includes(norm(r.format)));
          const groups=known.concat(otherItems.length?[{label:'Other',items:otherItems}]:[]).filter(g=>g.items.length);
          inner=`<div style="padding:0 0 16px;"><div style="display:flex;flex-direction:column;gap:18px;">${groups.map(fg=>`
            <div>
              <div style="display:flex;align-items:baseline;gap:8px;margin:0 0 8px 26px;">
                <span style="font-family:'Overpass Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--t3);text-transform:uppercase;font-weight:700;">${esc(fg.label)}</span>
                <span style="font-family:'Overpass Mono',monospace;font-size:10px;color:var(--t4);">${fg.items.length}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">${fg.items.map(libRow).join('')}</div>
            </div>`).join('')}</div></div>`;
        } else {
          inner=`<div style="padding:0 0 16px;"><div style="display:flex;flex-direction:column;gap:8px;">${sec.rows.map(libRow).join('')||emptyRow()}</div></div>`;
        }
      }
      return `<div style="border-bottom:1px solid var(--line2);">
        <div data-act="toggleSec" data-arg="${mt}:${sec.status}" style="display:flex;align-items:center;gap:10px;padding:14px 4px;cursor:pointer;">
          <svg width="12" height="12" viewBox="0 0 24 24" style="transform:rotate(${exp?90:0}deg);transition:transform .15s;color:var(--t3);flex:0 0 auto;"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-weight:700;font-size:15px;flex:1;">${STATUS_LABEL[sec.status]}</span>
          <span style="font-family:'Overpass Mono',monospace;font-size:12px;font-weight:700;color:var(--t4);">${sec.rows.length}</span>
        </div>
        ${inner}
      </div>`;
    }).join('')}
  </div>`;
  return header+body;
}
function emptyRow(){return `<div style="padding:12px 26px;color:var(--t4);font-family:'Overpass Mono',monospace;font-size:11px;">nothing here yet</div>`;}
function libRow(it){
  const rep=it.repeat_count>0;
  const repLabel=(it.media_type==='anime'?'↺ ':'↺ ')+it.repeat_count+'×';
  return `<div data-act="openDetail" data-arg="${it.id}" data-hover="background:var(--s2)" style="display:flex;align-items:center;gap:12px;padding:8px 4px 8px 26px;border-radius:10px;cursor:pointer;">
    <div style="flex:0 0 40px;height:56px;border-radius:6px;position:relative;overflow:hidden;background:${cover(it.title)};display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);">
      <span style="font-family:'Overpass Mono',monospace;font-weight:700;font-size:11px;color:rgba(255,255,255,.82);">${esc(initials(displayTitle(it)))}</span>${povr(it.cover_url,displayTitle(it))}
    </div>
    <div style="min-width:0;flex:1;">
      <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(displayTitle(it))}</div>
      <div style="display:flex;align-items:center;gap:7px;margin-top:3px;">
        <span style="font-family:'Overpass Mono',monospace;font-size:11px;color:var(--t4);">${esc(progressLabel(it))}</span>
        ${rep?`<span style="font-family:'Overpass Mono',monospace;font-size:9.5px;font-weight:700;color:var(--t3);background:var(--s3);border-radius:5px;padding:2px 6px;">${repLabel}</span>`:''}

/* ---- feed ---- */
// AniList ListActivity: status is a verb phrase ("watched episode", "read
// chapter", "completed", "plans to watch", "dropped", ...) and progress a bare
// number or range ("27 - 28"). Returns the text either side of the title:
// "watched episodes 27–28 of" | Frieren, "completed" | Punpun, or for a verb
// that doesn't name the unit, "dropped" | Vagabond | " at chapter 12".
function feedPhrase(a){
  const verb=String(a.verb||'').trim();
  const range=String(a.progress_range||'').trim().replace(/\s*-\s*/g,'–');
  if(!range)return {before:verb,after:''};
  const plural=range.includes('–')?'s':'';
  const m=verb.match(/^(.*)\b(episode|chapter)$/);
  if(m)return {before:`${m[1]}${m[2]}${plural} ${range} of`,after:''};
  return {before:verb,after:` at ${a.media_type==='manga'?'chapter':'episode'}${plural} ${range}`};
}

    <div style="flex:1;">${bar(13,'70%',0)}${bar(10,'90px',9)}</div>
    <div style="flex:0 0 46px;height:64px;border-radius:6px;background:var(--line);animation:rk-pulse 1.2s ease-in-out infinite;"></div>

}
